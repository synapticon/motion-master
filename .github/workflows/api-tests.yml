name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API tests
    runs-on: [self-hosted, ci-belgrade-linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The HTTP client is generated from swagger.yml and gitignored, so it
      # must be produced before the client package (and thus the tests) can
      # resolve ./generated/http-client.
      - name: Generate API client
        run: pnpm --filter @synapticon/motion-master-client generate

      - name: Run API tests
        run: pnpm --filter motion-master-api-tests test
        env:
          MM_URL: https://127.0.0.1:61447
