name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API tests
    runs-on: [self-hosted, OptiPlex-3080]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: hil/api
        run: npm ci --prefer-offline --no-audit

      - name: Run API tests
        working-directory: hil/api
        run: npm test
