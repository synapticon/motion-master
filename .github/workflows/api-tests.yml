name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API tests
    runs-on: [self-hosted, ci-belgrade-linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter motion-master-api-tests test
        env:
          MM_URL: https://127.0.0.1:61447
