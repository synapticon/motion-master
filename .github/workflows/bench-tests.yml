name: Bench Tests

on:
  workflow_dispatch:
    # The Actions tab shows each description in full above its field, so they stay short. The
    # README of hil/bench describes each input in full.
    inputs:
      # Empty builds the Docker image from the selected branch, about 20 s when no C++ changed. A
      # version that is not on Docker Hub fails the run before any test runs.
      version:
        description: "Server version from Docker Hub, e.g. 6.0.0-alpha.95. Empty: build the branch."
        required: false
        default: ""
      # An expression that matches no test fails the run.
      tests:
        description: "pytest -k expression, e.g. \"scan and not power\". Empty: every test."
        required: false
        default: ""
      # A dump of the motion test is about 1.7 MB, so this is for a failing test only.
      process-data-dumps:
        description: "Upload a process-data dump (.mmpd) of each motion test."
        type: boolean
        required: false
        default: false

# One bench, one run. A second run waits until the first one ends.
concurrency:
  group: bench-ci-belgrade-linux
  cancel-in-progress: false

jobs:
  bench-tests:
    name: Run bench tests
    runs-on: [self-hosted, ci-belgrade-linux]
    timeout-minutes: 60

    env:
      CONTAINER: motion-master-bench
      MM_HTTP_URL: https://127.0.0.1:61447
      MM_WS_URL: wss://127.0.0.1:62281

    steps:
      # The tests always come from the selected branch. vcpkg, a submodule, is needed only to
      # build the image.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.version == '' && 'recursive' || 'false' }}

      - name: Build the server image
        if: inputs.version == ''
        run: |
          docker build -t "$CONTAINER" .
          echo "IMAGE=$CONTAINER" >> "$GITHUB_ENV"
          echo "Server: image built from \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA::7}\`." >> "$GITHUB_STEP_SUMMARY"

      # The version goes through an environment variable, so that the shell never reads it as code.
      # A tag on Docker Hub has no v, so a leading v is dropped.
      - name: Pull the server image
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::'$VERSION' is not a version."
            exit 1
          fi
          image="synapticon/motion-master:$version"
          if ! docker pull "$image"; then
            echo "::error::$image is not on Docker Hub."
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Server: \`$image\`, pulled from Docker Hub." >> "$GITHUB_STEP_SUMMARY"

      # --network host, because the server binds to 127.0.0.1. The capabilities are those of
      # SOEM (raw socket, promiscuous mode) and of the RT loop (SCHED_FIFO, mlockall).
      - name: Start the server
        run: |
          docker rm -f "$CONTAINER" > /dev/null 2>&1 || true
          docker run -d --rm --name "$CONTAINER" --network host \
            --cap-add NET_RAW --cap-add NET_ADMIN --cap-add SYS_NICE --cap-add IPC_LOCK \
            --ulimit memlock=-1 "$IMAGE"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the test dependencies
        working-directory: hil/bench
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The selection goes through an environment variable, so that the shell never reads it as
      # code.
      - name: Run the tests
        working-directory: hil/bench
        env:
          TESTS: ${{ inputs.tests }}
          DUMPS: ${{ inputs.process-data-dumps }}
        run: |
          args=(--junitxml=report.xml)
          if [[ -n "$TESTS" ]]; then
            args+=(-k "$TESTS")
          fi
          if [[ "$DUMPS" == "true" ]]; then
            args+=(--process-data-dumps)
          fi
          pytest "${args[@]}"

      - name: Save the server log
        if: always()
        run: docker logs "$CONTAINER" > hil/bench/server.log 2>&1 || true

      - name: Stop the server
        if: always()
        run: docker stop "$CONTAINER" || true

      # The tests switch the drives off when they end. This step also covers a run that was
      # cancelled, timed out, or stopped before the tests.
      - name: Switch the drives off
        if: always()
        working-directory: hil/bench
        env:
          PYTHONPATH: ../../clients/python
        run: python -c "import bench; bench.switch_off()" || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-tests-${{ github.run_id }}
          path: |
            hil/bench/report.xml
            hil/bench/server.log
            hil/bench/dumps/*.mmpd
