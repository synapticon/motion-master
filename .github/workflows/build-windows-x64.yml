name: Build & Test (Windows x64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Split restore/save so the vcpkg binary cache is written even when a later
      # build step fails — actions/cache only saves on job success, which would
      # otherwise rebuild every dependency (openssl alone is ~8 min) on each red run.
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Before get-cmake, because vcvars64.bat also puts the CMake and Ninja of Visual Studio on
      # PATH, and the CMake that get-cmake installs must come first.
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset x64-windows-debug

      - name: Save vcpkg cache
        # Persist the freshly built dependencies even if the build/test below fails.
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset x64-windows-debug

      - name: Test
        run: ctest --test-dir build/x64-windows-debug --output-on-failure
