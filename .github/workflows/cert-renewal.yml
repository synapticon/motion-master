name: Renew TLS Certificate

on:
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10:00 UTC
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    # contents: write lets the default GITHUB_TOKEN create/update the rolling `tls-cert` release.
    permissions:
      contents: write

    steps:
      - name: Install acme.sh
        run: curl -fsSL https://get.acme.sh | sh -s email=msankovic@synapticon.com

      - name: Issue certificate
        env:
          ACMEDNS_CONFIG: ${{ secrets.ACMEDNS_CONFIG }}
        run: |
          printf '%s' "$ACMEDNS_CONFIG" > acmedns.json
          # acme.sh's dns_acmedns plugin reads ACMEDNS_* from the environment, NOT a file — so the
          # credentials must be exported here, or it self-registers a throwaway acme-dns account
          # whose subdomain doesn't match our permanent CNAME and validation never succeeds.
          # get() handles both the flat /register response and the certbot domain-keyed wrapper;
          # the username/password/subdomain field names are fixed by the acme-dns API.
          get() { jq -r --arg k "$1" \
            'if has($k) then .[$k] else (to_entries[0].value[$k] // empty) end' acmedns.json; }
          export ACMEDNS_BASE_URL="https://auth.acme-dns.io"
          export ACMEDNS_USERNAME="$(get username)"
          export ACMEDNS_PASSWORD="$(get password)"
          export ACMEDNS_SUBDOMAIN="$(get subdomain)"
          rm -f acmedns.json
          # Abort before any validation attempt if the parse didn't yield the CNAME target, so a
          # bad config can't burn a Let's Encrypt failed-validation slot. This subdomain is not
          # secret — it is the public CNAME target documented in CLAUDE.md.
          expected="4723b93a-99f5-43d7-93f1-195dbb4168ea"
          if [ -z "$ACMEDNS_USERNAME" ] || [ "$ACMEDNS_SUBDOMAIN" != "$expected" ]; then
            echo "::error::acme-dns parse failed (subdomain='$ACMEDNS_SUBDOMAIN', expected '$expected')"
            exit 1
          fi
          # ONE certificate carries both names Motion Master is reached by, so every host serves
          # the same file whether it is bound to loopback or to the LAN:
          #   local.motion-master.synapticon.com  — A record pinned to 127.0.0.1; the browser and
          #     the server share a machine. Stays a plain static record in the parent zone, so an
          #     outage of the ip.… responder cannot break the ordinary desktop install.
          #   *.ip.motion-master.synapticon.com   — off-loopback: <dashed-ip>.ip.… resolves to that
          #     LAN address, so an appliance is reachable from another machine's browser under a
          #     publicly-trusted name. Wildcards are DNS-01 only, which is what we already run.
          # Both challenge names CNAME to the SAME acme-dns account, which is fine because acme-dns
          # keeps two rolling TXT records per account and this issuance needs exactly two. That is
          # also the ceiling: a THIRD name on this cert would silently evict one of the two, so it
          # would need a second acme-dns account and its own CNAME. local.… stays first — acme.sh
          # names its output directory after the first -d, which the publish step below depends on.
          ~/.acme.sh/acme.sh --issue --force \
            -d local.motion-master.synapticon.com \
            -d '*.ip.motion-master.synapticon.com' \
            --dns dns_acmedns \
            --server letsencrypt

      # Publish the fresh cert/key as assets on a rolling release with a fixed tag — the single
      # source of truth for the certificate. Both the running binary's startup self-heal and every
      # build-time bake (Dockerfile, release.yml) fetch from this stable URL, independent of app
      # releases (which may be months apart, by which point their bundled cert would have expired):
      #   https://github.com/synapticon/motion-master/releases/download/tls-cert/cert.pem
      #   https://github.com/synapticon/motion-master/releases/download/tls-cert/key.pem
      # The keypair only authenticates names that resolve to loopback or to a LAN address, so
      # publishing it is no wider an exposure than the cert already bundled in every public release
      # artifact: impersonating either name requires already being on-path inside that network.
      - name: Publish cert to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ~/.acme.sh/local.motion-master.synapticon.com_ecc/fullchain.cer cert.pem
          cp ~/.acme.sh/local.motion-master.synapticon.com_ecc/local.motion-master.synapticon.com.key key.pem
          # Every running host self-heals from this release, and the binary rejects a cert that
          # does not cover both names (cert_updater.cc) — so a cert missing a SAN would be pushed
          # to every host and refused by all of them. Catch that here instead.
          for name in local.motion-master.synapticon.com '*.ip.motion-master.synapticon.com'; do
            if ! openssl x509 -in cert.pem -noout -ext subjectAltName | grep -qF "DNS:$name"; then
              echo "::error::issued certificate does not cover $name"
              exit 1
            fi
          done
          notes="Latest Let's Encrypt certificate for local.motion-master.synapticon.com (resolves to 127.0.0.1) and *.ip.motion-master.synapticon.com (LAN deployments: <dashed-ip>.ip.… resolves to that address). Rotated monthly by cert-renewal.yml. Updated $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          if gh release view tls-cert --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit tls-cert --repo "$GITHUB_REPOSITORY" --notes "$notes"
            gh release upload tls-cert cert.pem key.pem --repo "$GITHUB_REPOSITORY" --clobber
          else
            # --prerelease keeps this off the repo's "Latest" badge (which --latest=false alone
            # does not, once it is the only non-prerelease release); the stable per-tag download
            # URL is unaffected.
            gh release create tls-cert cert.pem key.pem \
              --repo "$GITHUB_REPOSITORY" \
              --title "TLS certificate (rolling)" \
              --notes "$notes" \
              --prerelease
          fi
