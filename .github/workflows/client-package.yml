name: Client package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  client-package:
    name: TypeScript client installs from its tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the client
        run: pnpm run build:client

      # The workspace consumes the TypeScript source, so only a packed tarball shows what an npm
      # user gets. pnpm pack applies publishConfig, the same as pnpm publish.
      - name: Pack the client
        working-directory: web/packages/motion-master-client
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball in an empty project and load it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          echo '{ "name": "consumer", "private": true }' > package.json
          npm install --no-audit --no-fund ../synapticon-motion-master-client-*.tgz
          test -f node_modules/@synapticon/motion-master-client/README.md
          # No server listens on port 9, so the request must fail inside fetch. A TypeError from the
          # client itself means the client never reached fetch.
          node --input-type=module -e "
            import { MotionMasterClient, parseMmpd } from '@synapticon/motion-master-client'
            const client = new MotionMasterClient({ baseUrl: 'http://127.0.0.1:9' })
            if (typeof client.api.getVersion !== 'function' || typeof parseMmpd !== 'function') {
              throw new Error('the ES module import is incomplete')
            }
            try {
              await client.api.getVersion()
              throw new Error('a request to a closed port succeeded')
            } catch (err) {
              if (!(err instanceof TypeError) || err.message !== 'fetch failed') {
                throw err
              }
            }
          "
          node -e "
            const { MotionMasterClient } = require('@synapticon/motion-master-client')
            if (typeof MotionMasterClient !== 'function') {
              throw new Error('require() of the package is incomplete')
            }
          "

      # The server's cia402::decodeState and the Python client are tested against the same table.
      - name: Cia402.state() of the installed package decodes the shared statusword table
        working-directory: ${{ runner.temp }}/consumer
        env:
          TABLE: ${{ github.workspace }}/libs/node/tests/data/cia402_statusword_states.json
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { AlState, Cia402 } from '@synapticon/motion-master-client'
            const table = JSON.parse(readFileSync(process.env.TABLE, 'utf8'))
            const wrong = table.cases.filter((c) => Cia402.state(c.statusword) !== c.state)
            if (wrong.length > 0) {
              throw new Error('Cia402.state() decodes differently from the table: ' + JSON.stringify(wrong))
            }
            if (Cia402.STATUSWORD.index !== 0x6041 || AlState.PREOP !== 2) {
              throw new Error('the addresses or the AL states are wrong')
            }
            console.log(table.cases.length + ' statuswords decode as the table says')
          "

  python-client-package:
    name: Python client installs from its wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the sdist and the wheel
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$RUNNER_TEMP/dist"

      # Every file of the wheel outside its .dist-info directory is something an install adds to
      # site-packages. That must be the two modules and nothing of examples/.
      - name: The wheel holds the two modules only
        working-directory: ${{ runner.temp }}/dist
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("*.whl")
          modules = sorted(n for n in zipfile.ZipFile(wheel).namelist() if ".dist-info/" not in n)
          if modules != ["motion_master_client.py", "motion_master_objects.py"]:
              raise SystemExit(f"::error::the wheel holds {modules}")
          PY

      # An empty directory outside the clone, so the import can only find the installed modules.
      - name: Install the wheel in an empty virtual environment and load it
        working-directory: ${{ runner.temp }}
        env:
          TABLE: ${{ github.workspace }}/libs/node/tests/data/cia402_statusword_states.json
        run: |
          python -m venv "$RUNNER_TEMP/consumer-venv"
          mkdir consumer && cd consumer
          "$RUNNER_TEMP"/consumer-venv/bin/pip install ../dist/*.whl
          "$RUNNER_TEMP"/consumer-venv/bin/python - <<'PY'
          import json, os, pathlib
          import requests
          import motion_master_client
          from motion_master_client import AlState, Cia402, MotionMasterClient

          if "site-packages" not in motion_master_client.__file__:
              raise SystemExit(f"::error::the module came from {motion_master_client.__file__}")

          table = json.loads(pathlib.Path(os.environ["TABLE"]).read_text())
          wrong = [c for c in table["cases"] if Cia402.state(c["statusword"]) != c["state"]]
          if wrong:
              raise SystemExit(f"::error::Cia402.state() decodes differently from the table: {wrong}")
          assert Cia402.STATUSWORD.index == 0x6041 and AlState.PREOP == 2

          # Without a config.toml, the error names where to get the template.
          try:
              MotionMasterClient.from_config()
              raise SystemExit("::error::from_config() found a config that does not exist")
          except FileNotFoundError as error:
              assert "config.example.toml" in str(error) and "https://" in str(error), error

          # No server listens on port 9, so the client must fail on the connection, not before it.
          pathlib.Path("config.toml").write_text('host = "127.0.0.1"\nhttp_port = 9\nws_port = 9\n')
          try:
              MotionMasterClient.from_config()
              raise SystemExit("::error::a request to a closed port succeeded")
          except requests.ConnectionError:
              pass
          print(f"{len(table['cases'])} statuswords decode as the table says")
          PY
