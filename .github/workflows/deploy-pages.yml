name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs so a queued
# deploy is not dropped when a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Checkout theme submodule
        run: git submodule update --init extern/doxygen-awesome-css

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y doxygen

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Doxyfile
        run: |
          MM_VERSION=$(cat VERSION)
          mkdir -p build/docs
          cmake \
            -D MM_VERSION="${MM_VERSION}" \
            -D MM_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -D MM_BINARY_DIR="${GITHUB_WORKSPACE}/build" \
            -P cmake/configure_doxyfile.cmake

      - name: Build docs
        run: doxygen build/Doxyfile

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: ui
        env:
          VITE_BASE: /motion-master/
        run: pnpm build

      - name: Assemble Pages artifact
        run: |
          mkdir -p build/pages/docs
          cp -r ui/apps/motion-master/dist/. build/pages/
          cp -r build/docs/html/. build/pages/docs/
          cp build/pages/index.html build/pages/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
