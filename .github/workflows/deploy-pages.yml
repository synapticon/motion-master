name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs so a queued
# deploy is not dropped when a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Checkout theme submodule
        run: git submodule update --init extern/doxygen-awesome-css

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y doxygen graphviz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Doxyfile
        run: |
          MM_VERSION=$(cat VERSION)
          mkdir -p build/docs
          cmake \
            -D MM_VERSION="${MM_VERSION}" \
            -D MM_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -D MM_BINARY_DIR="${GITHUB_WORKSPACE}/build" \
            -P cmake/configure_doxyfile.cmake

      - name: Build docs
        run: doxygen build/Doxyfile

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: |
          # Each app is served under /apps/<name>, so it is built with that base.
          pnpm generate-api
          VITE_BASE=/apps/console pnpm --filter console build
          VITE_BASE=/apps/example pnpm --filter example build

      - name: Assemble Pages artifact
        run: |
          mkdir -p build/pages/apps/console build/pages/apps/example build/pages/docs
          cp web/landing/index.html build/pages/index.html
          cp -r web/apps/console/dist/. build/pages/apps/console/
          cp -r web/apps/example/dist/. build/pages/apps/example/
          cp -r build/docs/html/. build/pages/docs/
          cp apps/motion_master/swagger.yml build/pages/swagger.yml
          # Generic 404: redirects deep links into any /apps/<app>/ PWA to that app's
          # index (the app's index.html decodes the route); a real Not Found for the rest.
          cp web/404.html build/pages/404.html
          echo "motion-master.synapticon.com" > build/pages/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
