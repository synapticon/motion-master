name: Deploy Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs so a queued
# deploy is not dropped when a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the app build can be pinned to the latest release tag.
          fetch-depth: 0

      - name: Checkout theme submodule
        run: git submodule update --init extern/doxygen-awesome-css

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y doxygen graphviz

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Doxyfile
        run: |
          MM_VERSION=$(cat VERSION)
          mkdir -p build/docs
          cmake \
            -D MM_VERSION="${MM_VERSION}" \
            -D MM_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -D MM_BINARY_DIR="${GITHUB_WORKSPACE}/build" \
            -P cmake/configure_doxyfile.cmake

      - name: Build docs
        run: doxygen build/Doxyfile

      # The web apps (web/apps/*) are pinned to the latest release tag, not main, so the
      # hosted apps always match a released server binary (both ship on v* tags). Their
      # bytes only change when a new tag is cut, so the build output is cached per tag and
      # reused on ordinary main pushes — a docs/landing commit deploys without rebuilding
      # (or even installing) the apps. Docs + landing track main (built above / copied
      # below); Pages publishes one artifact for the whole site, so every deploy still
      # reassembles it, but only a new tag pays the app build cost.
      - name: Resolve latest release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*')" >> "$GITHUB_OUTPUT"

      - name: Cache built apps
        id: apps-cache
        uses: actions/cache@v5
        with:
          path: apps-dist
          key: pages-apps-v1-${{ steps.tag.outputs.tag }}

      - uses: pnpm/action-setup@v4
        if: steps.apps-cache.outputs.cache-hit != 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.apps-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build apps from ${{ steps.tag.outputs.tag }}
        if: steps.apps-cache.outputs.cache-hit != 'true'
        run: |
          git worktree add "$RUNNER_TEMP/release" "${{ steps.tag.outputs.tag }}"
          cd "$RUNNER_TEMP/release"
          pnpm install --frozen-lockfile
          pnpm generate-api
          # Build every app under web/apps/*, each served under /apps/<name>, and stage
          # the bundles at a stable workspace path for caching + assembly.
          for dir in web/apps/*/; do
            name=$(basename "$dir")
            echo "Building app: $name"
            VITE_BASE="/apps/$name" pnpm --filter "./$dir" build
            mkdir -p "$GITHUB_WORKSPACE/apps-dist/$name"
            cp -r "${dir}dist/." "$GITHUB_WORKSPACE/apps-dist/$name/"
          done
          # Serve the released API spec (from the tag), cached with the apps so a
          # cache-hit run (no worktree) still has it. The `*/` glob in assembly copies
          # only the app dirs, so this file is left for its own explicit copy.
          cp apps/motion_master/swagger.yml "$GITHUB_WORKSPACE/apps-dist/swagger.yml"

      - name: Assemble Pages artifact
        run: |
          mkdir -p build/pages/apps build/pages/docs build/pages/fonts
          cp web/landing/index.html build/pages/index.html
          # Static root pages (landing/index.html + 404.html) reference /fonts/;
          # the Vite apps bundle their own copies from @synapticon/ui. Serve the
          # canonical woff2 from the shared package at the site root for the static pages.
          cp web/packages/ui/src/fonts/*.woff2 build/pages/fonts/
          # Every prebuilt app (from apps-dist, cached per release tag) → /apps/<name>/.
          for dir in apps-dist/*/; do
            name=$(basename "$dir")
            mkdir -p "build/pages/apps/$name"
            cp -r "${dir}." "build/pages/apps/$name/"
          done
          cp -r build/docs/html/. build/pages/docs/
          cp apps-dist/swagger.yml build/pages/swagger.yml
          # Generic 404: redirects deep links into any /apps/<app>/ PWA to that app's
          # index (the app's index.html decodes the route); a real Not Found for the rest.
          cp web/404.html build/pages/404.html
          echo "motion-master.synapticon.com" > build/pages/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
