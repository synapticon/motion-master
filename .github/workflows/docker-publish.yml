name: Docker image

# Publishes synapticon/motion-master:<version> to Docker Hub for linux/amd64 and linux/arm64, built
# from the tag v<version>. Started by hand for the versions that get an image, or called from
# release.yml for every release (see the commented job there).
#
# Each architecture builds on its own native runner, because the vcpkg build under QEMU takes hours,
# and pushes its image by digest with no tag. The last job joins the two digests into one manifest
# under the version tag.
#
# The version is the only tag. `latest` on synapticon/motion-master is not this software, and
# machines still pull it, so this workflow never moves it. There is no rolling tag for this line
# either: a user names the version to run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The released version to build, for example 6.0.0-alpha.95. The tag v<version> must exist.'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'The version to build, with or without the v of the tag.'
        required: true
        type: string

jobs:
  # One place that strips the `v`, so a caller may pass github.ref_name as it is. An expression
  # cannot strip a prefix, so this is a job.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          version="${{ inputs.version }}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.version.outputs.version }}
          submodules: recursive

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # provenance and sbom are off: each adds an attestation manifest that a registry lists as an
      # `unknown/unknown` platform next to the real ones.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: synapticon/motion-master
          provenance: false
          sbom: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      # Pull the image just pushed and run it the way a user would. The server has to start and
      # answer GET /api/version with no config, no capabilities and no fieldbus, and the version it
      # reports has to be the one asked for. This is the one place the arm64 image runs before
      # anyone pulls it.
      - name: Start the pushed image and read its version
        run: |
          expected="${{ needs.version.outputs.version }}"
          image="synapticon/motion-master@${{ steps.build.outputs.digest }}"
          docker run -d --rm --network host --name motion-master "$image"
          reply=""
          for _ in $(seq 1 30); do
            if reply=$(curl -fsk https://127.0.0.1:61447/api/version); then
              break
            fi
            sleep 1
          done
          docker logs motion-master
          docker stop motion-master
          echo "GET /api/version: $reply"
          test "$(jq -r .version <<<"$reply")" = "$expected"

      # The manifest job needs both digests. A job output cannot carry one per matrix entry, so
      # each entry uploads an empty file named after its digest, the way the Docker documentation
      # shows it.
      - name: Export the digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v5
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [version, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: digests
          pattern: docker-digest-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Join the images into one manifest under the version tag
        working-directory: digests
        run: |
          docker buildx imagetools create \
            --tag "synapticon/motion-master:${{ needs.version.outputs.version }}" \
            $(printf 'synapticon/motion-master@sha256:%s ' *)

      - name: Inspect the manifest
        run: docker buildx imagetools inspect "synapticon/motion-master:${{ needs.version.outputs.version }}"
