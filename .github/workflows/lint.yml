name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          # Update only the LLVM list. The ubuntu-24.04 runner image ships broken
          # third-party repos (packages.microsoft.com) that intermittently return
          # 403, which would otherwise abort the whole `apt-get update` and fail
          # this job for reasons unrelated to our code.
          sudo apt-get update -q \
            -o Dir::Etc::sourcelist="sources.list.d/llvm.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs clang-format-22 --dry-run --Werror

  cpplint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs cpplint

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # cppcheck is built from source at the version pinned in .cppcheck-version, rather than
      # installed from apt. Its findings change between releases, so a suppression list is only valid
      # for the version it was written against — and apt offers no choice: Ubuntu 24.04 has 2.13 while
      # a developer's Fedora has 2.21.x, which is exactly how a check that passes locally starts
      # failing here for reasons nobody changed. Building it is the only way both sides can run the
      # same binary, and the result is cached on the pinned version so it compiles once per bump.
      - name: Cache cppcheck
        id: cache-cppcheck
        uses: actions/cache@v5
        with:
          path: ~/.cppcheck-pinned
          key: cppcheck-${{ runner.os }}-${{ hashFiles('.cppcheck-version') }}

      - name: Build cppcheck
        if: steps.cache-cppcheck.outputs.cache-hit != 'true'
        run: ./tools/install-cppcheck.sh "$HOME/.cppcheck-pinned"

      - name: Verify the pinned cppcheck
        run: |
          echo "$HOME/.cppcheck-pinned/bin" >> "$GITHUB_PATH"
          pinned="$(cat .cppcheck-version)"
          installed="$("$HOME/.cppcheck-pinned/bin/cppcheck" --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
          if [ "$installed" != "$pinned" ]; then
            echo "::error::expected cppcheck ${pinned}, got ${installed}. Stale cache?"
            exit 1
          fi
          echo "cppcheck ${installed} (pinned, built from source)"

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++23 \
            --suppress=missingIncludeSystem \
            --suppressions-list=cppcheck.supp \
            --error-exitcode=1 \
            --quiet \
            -I libs \
            apps libs

  mermaid:
    name: Mermaid diagrams parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Installed here rather than added to the workspace, so that a contributor who never touches a
      # diagram does not pay for the parser on every `pnpm install`. Both versions are pinned for the
      # reason the cppcheck job pins its own: a parser that updates on its own turns an unrelated
      # upstream release into a failure here. Raise them deliberately.
      - name: Install the Mermaid parser
        run: npm install --no-save mermaid@11.17.0 jsdom@29.1.1

      - name: Check every diagram
        run: node tools/check-mermaid.mjs

  api-client-drift:
    name: Generated API client is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API client from swagger.yml
        run: pnpm --filter @synapticon/motion-master-client generate

      - name: Fail if the committed client is out of date
        run: |
          git diff --exit-code web/packages/motion-master-client/src/generated/ \
            || { echo "::error::Generated API client is out of date. Run 'pnpm --filter @synapticon/motion-master-client generate' and commit the result."; exit 1; }

  python-client-example:
    name: Python client example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r clients/python/requirements.txt

      - name: Byte-compile
        run: python -m py_compile clients/python/*.py clients/python/examples/*.py

      # Guard against swagger drift: every operationId the examples call must
      # still exist in swagger.yml (mirrors the api-client-drift job for the
      # generated TS client). The runtime client fetches the spec from a live
      # server, so this check parses the repo's swagger.yml directly instead --
      # no server needed in CI, and the file is right here in the checkout.
      - name: Check example operationIds resolve against swagger.yml
        working-directory: clients/python
        run: |
          python - <<'PY'
          import pathlib, re
          import yaml

          spec = yaml.safe_load(pathlib.Path("../../apps/motion_master/swagger.yml").read_text())
          ops = {op["operationId"]
                 for item in spec["paths"].values()
                 for op in item.values()
                 if isinstance(op, dict) and "operationId" in op}

          used = set()
          for f in pathlib.Path("examples").glob("*.py"):
              used |= set(re.findall(r'call\(\s*["\']([A-Za-z]+)["\']', f.read_text()))

          missing = used - ops
          print("operationIds used by examples:", sorted(used))
          if missing:
              raise SystemExit(f"::error::operationIds not in swagger.yml: {sorted(missing)}")
          print("all example operationIds resolve")
          PY
