name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs clang-format-22 --dry-run --Werror

  cpplint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs cpplint

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++23 \
            --suppress=missingIncludeSystem \
            --suppressions-list=cppcheck.supp \
            --error-exitcode=1 \
            --quiet \
            -I libs \
            apps libs

  api-client-drift:
    name: Generated API client is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API client from swagger.yml
        run: pnpm --filter @synapticon/motion-master-client generate

      - name: Fail if the committed client is out of date
        run: |
          git diff --exit-code web/packages/motion-master-client/src/generated/ \
            || { echo "::error::Generated API client is out of date. Run 'pnpm --filter @synapticon/motion-master-client generate' and commit the result."; exit 1; }
