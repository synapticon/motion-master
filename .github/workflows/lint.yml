name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format-22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          # Update only the LLVM list. The ubuntu-24.04 runner image ships broken
          # third-party repos (packages.microsoft.com) that intermittently return
          # 403, which would otherwise abort the whole `apt-get update` and fail
          # this job for reasons unrelated to our code.
          sudo apt-get update -q \
            -o Dir::Etc::sourcelist="sources.list.d/llvm.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs clang-format-22 --dry-run --Werror

  cpplint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install cpplint
        run: pip install cpplint

      - name: Run cpplint
        run: |
          find apps libs \( -name '*.cc' -o -name '*.h' \) \
            | xargs cpplint

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Pinned so a runner-image refresh cannot silently change what this job reports. cppcheck's
      # findings drift between releases (2.13 flags a scope guard's null check that 2.21 does not), so
      # an unpinned CI check can start disagreeing with a developer's local one for no reason anybody
      # changed. .cppcheck-version is the single source of truth; cmake/lint.cmake warns when a local
      # install differs from it.
      - name: Install cppcheck
        run: |
          pinned="$(cat .cppcheck-version)"
          if ! sudo apt-get install -y "cppcheck=${pinned}-*"; then
            echo "::error::cppcheck ${pinned} is no longer available from apt on this runner."
            echo "Pick the version the runner now ships, put it in .cppcheck-version, and re-run"
            echo "cppcheck locally against that version — cppcheck.supp is tuned per version."
            exit 1
          fi
          installed="$(cppcheck --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?')"
          if [ "$installed" != "$pinned" ]; then
            echo "::error::expected cppcheck ${pinned}, got ${installed}."
            exit 1
          fi
          echo "cppcheck ${installed} (pinned)"

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++23 \
            --suppress=missingIncludeSystem \
            --suppressions-list=cppcheck.supp \
            --error-exitcode=1 \
            --quiet \
            -I libs \
            apps libs

  api-client-drift:
    name: Generated API client is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API client from swagger.yml
        run: pnpm --filter @synapticon/motion-master-client generate

      - name: Fail if the committed client is out of date
        run: |
          git diff --exit-code web/packages/motion-master-client/src/generated/ \
            || { echo "::error::Generated API client is out of date. Run 'pnpm --filter @synapticon/motion-master-client generate' and commit the result."; exit 1; }

  python-client-example:
    name: Python client example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r clients/python/requirements.txt

      - name: Byte-compile
        run: python -m py_compile clients/python/*.py clients/python/examples/*.py

      # Guard against swagger drift: every operationId the examples call must
      # still exist in swagger.yml (mirrors the api-client-drift job for the
      # generated TS client). The runtime client fetches the spec from a live
      # server, so this check parses the repo's swagger.yml directly instead --
      # no server needed in CI, and the file is right here in the checkout.
      - name: Check example operationIds resolve against swagger.yml
        working-directory: clients/python
        run: |
          python - <<'PY'
          import pathlib, re
          import yaml

          spec = yaml.safe_load(pathlib.Path("../../apps/motion_master/swagger.yml").read_text())
          ops = {op["operationId"]
                 for item in spec["paths"].values()
                 for op in item.values()
                 if isinstance(op, dict) and "operationId" in op}

          used = set()
          for f in pathlib.Path("examples").glob("*.py"):
              used |= set(re.findall(r'call\(\s*["\']([A-Za-z]+)["\']', f.read_text()))

          missing = used - ops
          print("operationIds used by examples:", sorted(used))
          if missing:
              raise SystemExit(f"::error::operationIds not in swagger.yml: {sorted(missing)}")
          print("all example operationIds resolve")
          PY
