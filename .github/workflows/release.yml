name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Linux x64: .tar.gz + .deb + .rpm ───────────────────────────────────────
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build gcc-14 g++-14 dpkg-dev rpm

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset x64-linux-release
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Build
        run: cmake --build --preset x64-linux-release

      - name: Bundle TLS certificate and key
        run: |
          dir=build/x64-linux-release/apps/motion_master
          base=https://github.com/synapticon/motion-master/releases/download/tls-cert
          curl -fsSL "$base/cert.pem" -o "$dir/cert.pem"
          curl -fsSL "$base/key.pem"  -o "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/x64-linux-release/apps/motion_master
          cp setup.sh "$dir/setup.sh"
          cp SETUP-linux.md "$dir/SETUP.md"
          cp apps/motion_master/motion-master.example.jsonc "$dir/motion-master.example.jsonc"
          tar -czf "motion-master-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem setup.sh SETUP.md motion-master.example.jsonc

      - name: Create deb and rpm
        run: ./tools/package.sh x64-linux-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: |
            motion-master-*-linux-x64.tar.gz
            motion-master-*-amd64.deb
            motion-master-*-x86_64.rpm

  # ── Linux arm64: .tar.gz + .deb + .rpm ─────────────────────────────────────
  # Built inside a debian:13 (trixie) container on the arm64 runner: Debian aarch64 (Raspberry
  # Pi OS trixie included) is the target for the Pi appliance, so we build against the distro
  # we ship for.
  #
  # That costs no compatibility. The container's glibc does not set the floor — the symbols the
  # binary references do, and the build host only caps them. Measured with `readelf -V`, this
  # leg's artifact tops out at GLIBC_2.38 / GLIBCXX_3.4.32, the same as the Ubuntu-24.04-built
  # x64 leg, despite trixie shipping glibc 2.41. So it runs on any aarch64 host at 2.38 or
  # newer, arm64 Ubuntu 24.04 (2.39) included. Never quote the container's distro version as
  # the requirement — measure it.
  #
  # Building on the runner directly (as build-linux-arm64.yml does) would cap the floor at
  # 2.39, leaving Debian 13 / Pi OS trixie (2.41) covered either way. The container is about
  # building against the shipped distro, not about reach.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:13
    steps:
      # Runs before checkout on purpose: without git in the container, actions/checkout
      # falls back to the REST tarball and cannot fetch the vcpkg submodule.
      - name: Install system dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            ninja-build gcc-14 g++-14 \
            curl ca-certificates git \
            zip unzip tar zstd pkg-config \
            make perl \
            dpkg-dev rpm

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          # Deliberately distinct from build-linux-arm64.yml's key: that cache holds
          # archives built with Ubuntu's toolchain, whose ABI hash this container's
          # compiler never matches — sharing the key would make this leg's cache saves
          # no-ops (the key already exists) and rebuild every dependency on each tag.
          key: vcpkg-debian13-${{ runner.arch }}-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-debian13-${{ runner.arch }}-${{ runner.os }}-

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset arm64-linux-release
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Build
        run: cmake --build --preset arm64-linux-release

      - name: Bundle TLS certificate and key
        run: |
          dir=build/arm64-linux-release/apps/motion_master
          base=https://github.com/synapticon/motion-master/releases/download/tls-cert
          curl -fsSL "$base/cert.pem" -o "$dir/cert.pem"
          curl -fsSL "$base/key.pem"  -o "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/arm64-linux-release/apps/motion_master
          cp setup.sh "$dir/setup.sh"
          cp SETUP-linux.md "$dir/SETUP.md"
          cp apps/motion_master/motion-master.example.jsonc "$dir/motion-master.example.jsonc"
          tar -czf "motion-master-${GITHUB_REF_NAME#v}-linux-arm64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem setup.sh SETUP.md motion-master.example.jsonc

      - name: Create deb and rpm
        run: ./tools/package.sh arm64-linux-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-arm64
          path: |
            motion-master-*-linux-arm64.tar.gz
            motion-master-*-arm64.deb
            motion-master-*-aarch64.rpm

  # ── Windows x64: .zip (exe + vcpkg runtime DLLs) ───────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset x64-windows-release

      - name: Build
        run: cmake --build --preset x64-windows-release

      - name: Bundle TLS certificate and key
        shell: bash
        run: |
          dir=build/x64-windows-release/apps/motion_master
          base=https://github.com/synapticon/motion-master/releases/download/tls-cert
          curl -fsSL "$base/cert.pem" -o "$dir/cert.pem"
          curl -fsSL "$base/key.pem"  -o "$dir/key.pem"

      - name: Package zip
        shell: pwsh
        run: |
          $dir = "build/x64-windows-release/apps/motion_master"
          $bin = "build/x64-windows-release/vcpkg_installed/x64-windows/bin"
          # x64-windows is a dynamic triplet, so bundle the vcpkg runtime DLLs (openssl,
          # zlib, fmt, spdlog, ...). Exclude test-only libs (gtest/gmock); wpcap.dll comes
          # from the Npcap driver at runtime.
          $dlls = Get-ChildItem "$bin/*.dll" | Where-Object { $_.Name -notmatch 'gtest|gmock' }
          # Windows ships a real, auto-loaded config: motion-master.jsonc sits next to the exe and is
          # picked up on start (no --config), raising the RT period to 4 ms — robust on stock Windows.
          # Copy the Windows-specific source to that basename so it lands as motion-master.jsonc.
          Copy-Item "apps/motion_master/motion-master.windows.jsonc" "$dir/motion-master.jsonc"
          # Build one flat string[] for -Path (mixing literals with a FileInfo[] expression
          # confuses Compress-Archive); use the DLLs' full paths.
          $files = @("$dir/motion-master.exe","$dir/cert.pem","$dir/key.pem","$dir/motion-master.jsonc","apps/motion_master/motion-master.example.jsonc") + $dlls.FullName
          $zip = "motion-master-$($env:GITHUB_REF_NAME -replace '^v','')-windows-x64.zip"
          Compress-Archive -Force -DestinationPath $zip -Path $files

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: motion-master-*-windows-x64.zip

  # ── macOS Apple Silicon (arm64): .tar.gz ───────────────────────────────────
  macos:
    # macos-26 for the same reason as build-macos-arm64.yml: its Xcode has std::atomic_ref, and
    # CMAKE_OSX_DEPLOYMENT_TARGET — not the image — sets the floor of the artifact it builds.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset arm64-osx-release

      - name: Build
        run: cmake --build --preset arm64-osx-release

      - name: Bundle TLS certificate and key
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          base=https://github.com/synapticon/motion-master/releases/download/tls-cert
          curl -fsSL "$base/cert.pem" -o "$dir/cert.pem"
          curl -fsSL "$base/key.pem"  -o "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          cp SETUP-macos.md "$dir/SETUP.md"
          cp apps/motion_master/motion-master.example.jsonc "$dir/motion-master.example.jsonc"
          tar -czf "motion-master-${GITHUB_REF_NAME#v}-macos-arm64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem SETUP.md motion-master.example.jsonc

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: motion-master-*-macos-arm64.tar.gz

  # ── Publish @synapticon/motion-master-client to npm ────────────────────────
  # Independent of the binary build legs: a version bump → v* tag publishes the client library
  # at the same version as the server. Authentication is npm trusted publishing: pnpm exchanges
  # the GitHub Actions OIDC token for a short-lived npm credential, so there is no publish token
  # to store or rotate. npm accepts the exchange only for the trusted publisher registered on the
  # package, which names this repository and this workflow file, so renaming the file breaks it.
  publish-client:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and build the client
        run: pnpm run build:client

      - name: Publish to npm
        run: |
          # Pre-release versions (e.g. 6.0.0-alpha.1) publish under the `next` dist-tag so they
          # never become npm's default `latest`.
          tag="latest"
          case "$GITHUB_REF_NAME" in
            *-*) tag="next" ;;
          esac
          pnpm --filter @synapticon/motion-master-client publish --no-git-checks --tag "$tag"

  # ── Publish the GitHub Release with all platform artifacts ─────────────────
  release:
    needs: [linux-x64, linux-arm64, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a SemVer pre-release suffix (e.g. -alpha.1) are published as
          # prereleases so they don't supersede the "Latest" stable release.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*

  # ── Sign the Windows binary on-premise (USB token) ─────────────────────────
  # The Authenticode code-signing certificate lives on a USB token that only
  # exists on the self-hosted ci-belgrade-windows machine, so signing has to
  # happen there — it cannot run on the GitHub-hosted windows leg above. This
  # job runs in the SAME workflow run (needs: release), so the release with the
  # unsigned zip already exists; we download that zip, sign motion-master.exe
  # with signtool, re-zip, and replace the asset on the release with --clobber.
  # Keeping it in this run is also what avoids needing a PAT: a job in the same
  # run only updates a release asset with the built-in GITHUB_TOKEN, it does not
  # trigger a new workflow — whereas signing from a separate, dispatch-triggered
  # workflow would need a PAT to start it. Prerequisite: the USB token must be
  # plugged in and unlocked on the runner, and signtool + gh must be on PATH
  # (they are in the standard Belgrade CI image).
  sign-windows:
    needs: release
    runs-on: ci-belgrade-windows
    permissions:
      contents: write
    steps:
      - name: Clean stale artifacts from a previous run
        shell: pwsh
        run: |
          # The self-hosted workspace persists between runs; remove leftover
          # zips/dirs so the globs below can't pick up a stale version.
          Remove-Item -Path "signed" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "motion-master-*-windows-x64.zip" -Force -ErrorAction SilentlyContinue

      - name: Download the unsigned Windows zip from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "motion-master-*-windows-x64.zip" `
            --clobber

      - name: Unpack the zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "signed" -Force

      - name: Sign motion-master.exe
        shell: pwsh
        run: |
          # /a auto-selects the best signing cert from the token's store;
          # /tr + /td + /fd add an RFC-3161 SHA-256 timestamp so the signature
          # stays valid after the cert expires.
          signtool sign /tr http://timestamp.sectigo.com /td sha256 /fd sha256 /a "signed\motion-master.exe"

      - name: Re-pack the signed zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          Remove-Item $zip.FullName -Force
          Compress-Archive -Path "signed\*" -DestinationPath $zip.Name -Force

      - name: Upload the signed zip, replacing the unsigned asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" $zip.FullName --repo "$env:GITHUB_REPOSITORY" --clobber
