name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Linux x64: .tar.gz + .deb + .rpm ───────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build gcc-14 g++-14 dpkg-dev rpm

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset x64-linux-release
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Build
        run: cmake --build --preset x64-linux-release

      - name: Bundle TLS certificate and key
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/x64-linux-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/x64-linux-release/apps/motion_master
          cp setup.sh "$dir/setup.sh"
          cp SETUP.md "$dir/SETUP.md"
          tar -czf "motion-master-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem setup.sh SETUP.md

      - name: Create deb and rpm
        run: ./tools/package.sh x64-linux-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            motion-master-*-linux-x64.tar.gz
            motion-master-*-amd64.deb
            motion-master-*-x86_64.rpm

  # ── Windows x64: NSIS installer (.exe) ─────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset x64-windows-release

      - name: Build
        run: cmake --build --preset x64-windows-release

      - name: Bundle TLS certificate and key
        shell: bash
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/x64-windows-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package zip
        shell: pwsh
        run: |
          $dir = "build/x64-windows-release/apps/motion_master"
          # x64-windows is a dynamic triplet, so bundle the vcpkg runtime DLLs next
          # to the exe (openssl, zlib, fmt, ...). wpcap.dll comes from Npcap at runtime.
          Copy-Item "build/x64-windows-release/vcpkg_installed/x64-windows/bin/*.dll" $dir -ErrorAction SilentlyContinue
          Copy-Item "SETUP.md" $dir
          $zip = "motion-master-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Force -DestinationPath $zip -Path `
            "$dir/motion-master.exe","$dir/cert.pem","$dir/key.pem","$dir/SETUP.md",(Get-Item "$dir/*.dll")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: motion-master-*-windows-x64.zip

  # ── macOS Apple Silicon (arm64): .tar.gz ───────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset arm64-osx-release

      - name: Build
        run: cmake --build --preset arm64-osx-release

      - name: Bundle TLS certificate and key
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          cp SETUP.md "$dir/SETUP.md"
          tar -czf "motion-master-${GITHUB_REF_NAME}-macos-arm64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem SETUP.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: motion-master-*-macos-arm64.tar.gz

  # ── Publish the GitHub Release with all platform artifacts ─────────────────
  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a SemVer pre-release suffix (e.g. -alpha.1) are published as
          # prereleases so they don't supersede the "Latest" stable release.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*
