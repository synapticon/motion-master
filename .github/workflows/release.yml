name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Linux x64: .tar.gz + .deb + .rpm ───────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build gcc-14 g++-14 dpkg-dev rpm

      - name: Install CMake 4.x
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset x64-linux-release
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Build
        run: cmake --build --preset x64-linux-release

      - name: Bundle TLS certificate and key
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/x64-linux-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/x64-linux-release/apps/motion_master
          cp setup.sh "$dir/setup.sh"
          cp SETUP.md "$dir/SETUP.md"
          cp apps/motion_master/motion-master.example.jsonc "$dir/motion-master.example.jsonc"
          tar -czf "motion-master-${GITHUB_REF_NAME#v}-linux-x64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem setup.sh SETUP.md motion-master.example.jsonc

      - name: Create deb and rpm
        run: ./tools/package.sh x64-linux-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            motion-master-*-linux-x64.tar.gz
            motion-master-*-amd64.deb
            motion-master-*-x86_64.rpm

  # ── Windows x64: NSIS installer (.exe) ─────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset x64-windows-release

      - name: Build
        run: cmake --build --preset x64-windows-release

      - name: Bundle TLS certificate and key
        shell: bash
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/x64-windows-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package zip
        shell: pwsh
        run: |
          $dir = "build/x64-windows-release/apps/motion_master"
          $bin = "build/x64-windows-release/vcpkg_installed/x64-windows/bin"
          # x64-windows is a dynamic triplet, so bundle the vcpkg runtime DLLs (openssl,
          # zlib, fmt, spdlog, ...). Exclude test-only libs (gtest/gmock); wpcap.dll comes
          # from the Npcap driver at runtime.
          $dlls = Get-ChildItem "$bin/*.dll" | Where-Object { $_.Name -notmatch 'gtest|gmock' }
          # Build one flat string[] for -Path (mixing literals with a FileInfo[] expression
          # confuses Compress-Archive); use the DLLs' full paths.
          $files = @("$dir/motion-master.exe","$dir/cert.pem","$dir/key.pem","apps/motion_master/motion-master.example.jsonc") + $dlls.FullName
          $zip = "motion-master-$($env:GITHUB_REF_NAME -replace '^v','')-windows-x64.zip"
          Compress-Archive -Force -DestinationPath $zip -Path $files

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows
          path: motion-master-*-windows-x64.zip

  # ── macOS Apple Silicon (arm64): .tar.gz ───────────────────────────────────
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      - name: Configure
        run: cmake --preset arm64-osx-release

      - name: Build
        run: cmake --build --preset arm64-osx-release

      - name: Bundle TLS certificate and key
        env:
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          echo "$TLS_CERT" > "$dir/cert.pem"
          echo "$TLS_KEY"  > "$dir/key.pem"

      - name: Package tarball
        run: |
          dir=build/arm64-osx-release/apps/motion_master
          cp apps/motion_master/motion-master.example.jsonc "$dir/motion-master.example.jsonc"
          tar -czf "motion-master-${GITHUB_REF_NAME#v}-macos-arm64.tar.gz" \
            -C "$dir" motion-master cert.pem key.pem motion-master.example.jsonc

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos
          path: motion-master-*-macos-arm64.tar.gz

  # ── Publish @synapticon/motion-master-client to npm ────────────────────────
  # Independent of the binary build legs: a version bump → v* tag publishes the client library
  # at the same version as the server. Requires the NPM_TOKEN repo secret (an npm automation token
  # with publish rights to the @synapticon scope).
  publish-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and build the client
        run: pnpm run build:client

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Pre-release versions (e.g. 6.0.0-alpha.1) publish under the `next` dist-tag so they
          # never become npm's default `latest`.
          tag="latest"
          case "$GITHUB_REF_NAME" in
            *-*) tag="next" ;;
          esac
          pnpm --filter @synapticon/motion-master-client publish --no-git-checks --tag "$tag"

  # ── Publish the GitHub Release with all platform artifacts ─────────────────
  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a SemVer pre-release suffix (e.g. -alpha.1) are published as
          # prereleases so they don't supersede the "Latest" stable release.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*

  # ── Sign the Windows binary on-premise (USB token) ─────────────────────────
  # The Authenticode code-signing certificate lives on a USB token that only
  # exists on the self-hosted ci-belgrade-windows machine, so signing has to
  # happen there — it cannot run on the GitHub-hosted windows leg above. This
  # job runs in the SAME workflow run (needs: release), so the release with the
  # unsigned zip already exists; we download that zip, sign motion-master.exe
  # with signtool, re-zip, and replace the asset on the release with --clobber.
  # No PAT/dispatch is needed (unlike the v5 split): a job in the same run only
  # updates a release asset with the built-in GITHUB_TOKEN, it does not trigger
  # a new workflow. Prerequisite: the USB token must be plugged in and unlocked
  # on the runner, and signtool + gh must be on PATH (they are in the standard
  # Belgrade CI image).
  sign-windows:
    needs: release
    runs-on: ci-belgrade-windows
    permissions:
      contents: write
    steps:
      - name: Clean stale artifacts from a previous run
        shell: pwsh
        run: |
          # The self-hosted workspace persists between runs; remove leftover
          # zips/dirs so the globs below can't pick up a stale version.
          Remove-Item -Path "signed" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "motion-master-*-windows-x64.zip" -Force -ErrorAction SilentlyContinue

      - name: Download the unsigned Windows zip from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:GITHUB_REF_NAME" `
            --repo "$env:GITHUB_REPOSITORY" `
            --pattern "motion-master-*-windows-x64.zip" `
            --clobber

      - name: Unpack the zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath "signed" -Force

      - name: Sign motion-master.exe
        shell: pwsh
        run: |
          # /a auto-selects the best signing cert from the token's store;
          # /tr + /td + /fd add an RFC-3161 SHA-256 timestamp so the signature
          # stays valid after the cert expires.
          signtool sign /tr http://timestamp.sectigo.com /td sha256 /fd sha256 /a "signed\motion-master.exe"

      - name: Re-pack the signed zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          Remove-Item $zip.FullName -Force
          Compress-Archive -Path "signed\*" -DestinationPath $zip.Name -Force

      - name: Upload the signed zip, replacing the unsigned asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem -Filter "motion-master-*-windows-x64.zip" | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" $zip.FullName --repo "$env:GITHUB_REPOSITORY" --clobber
