# whitespace/indent_namespace is redundant under enforced clang-format (NamespaceIndentation: None
# makes real namespace indentation impossible) and false-positives on clang-format's own line-wraps
# of >100-column declarations.
filter=-legal/copyright,-build/c++11,-build/c++17,-build/include_order,-build/include_subdir,-whitespace/indent_namespace
linelength=100
extensions=cc,h
headers=h
