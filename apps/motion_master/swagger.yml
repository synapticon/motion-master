openapi: "3.1.0"
info:
  title: Motion Master API
  version: "6.0.0-alpha.78"
  description: |
    Motion Master is the motion-control software for Synapticon SOMANET servo
    drives. This HTTP API drives the EtherCAT fieldbus end to end: bring up a
    driver, discover the slaves on the bus, command AL state transitions, and
    read or write the object dictionary, ESC registers, parameters, and files of
    each device. A companion monitoring WebSocket streams live process data.

    ## Getting started

    The fieldbus is controlled through an explicit lifecycle — the driver is not
    created until you ask for it, so a fresh instance has no open network
    interface:

    1. **Init** — `POST /api/init` constructs a fieldbus driver (`soem`, or the
       planned `spoe`) and opens the network interface. SOEM has no adapter
       auto-detect, so an adapter name or MAC address is required. `init` is
       one-shot: a second call returns `409` until you reset.
    2. **Scan** — `POST /api/scan` discovers the slaves on the bus and configures
       their sync managers and FMMUs. Slaves are left in the `INIT` state.
    3. **Transition** — `POST /api/devices/state` moves the bus to a target AL
       state (`PreOp`, `SafeOp`, `Op`, …); `GET /api/devices/state` reads where
       each slave currently sits.
    4. **Reset** — `POST /api/reset` tears the driver down and clears the device
       list. `init` must be called again afterwards.

    `GET /api/adapters` lists the network interfaces available on the host, to
    help pick the adapter for step 1.

    ## Working with devices

    Once the bus has been scanned, each slave is addressed by its bus position
    (`slavePosition`). The per-device endpoints cover the common service-plane
    operations:

    - **Object dictionary (CoE)** — `GET`/`PUT …/parameters/{index}/{subindex}`
      read and write a single parameter by value, PDO-aware (the live process image
      or staged output when exchanging, SDO otherwise, with a `source=cache` read
      mode); `GET`/`PUT …/sdo/{index}/{subindex}` is the raw byte-level SDO transfer
      with no PDO awareness; `POST …/parameters/init` enumerates the full dictionary
      and `GET …/parameters` reads the cached result.
    - **ESC registers** — `GET`/`PUT …/registers/{address}` read and write raw
      EtherCAT Slave Controller register bytes.
    - **Files (FoE)** — `GET`/`PUT …/files/{filename}` transfer files to and from
      the device over File-over-EtherCAT (firmware, configuration, logs), and
      `GET …/files` lists what a SOMANET drive holds.
    - **SII (EEPROM)** — `GET …/sii` reads the Slave Information Interface, returning
      the parsed structure or the raw EEPROM bytes per the `Accept` header.

    The `/api/meta/*` endpoints expose static reference tables — AL status codes,
    ESC register definitions, FoE error codes, SDO abort codes, mailbox error codes,
    and CoE data types — so clients can decode numeric values without hard-coding them.

    ## Monitoring WebSocket

    The WebSocket runs on its own port (`62281` by default), separate from
    this HTTP API (`61447`) and on its own event loop, so a slow HTTP request can
    never stall the stream: `wss://local.motion-master.synapticon.com:62281` (the
    whole port is the WebSocket, so the URL needs no path).
    A client creates a monitoring
    with `POST /api/monitorings` (a topic, flush interval, and a list of
    parameters), then subscribes to its topic over the socket by sending
    `{"subscribe":"<topic>"}` (and `{"unsubscribe":"<topic>"}` to stop). The stream
    is **lossless**: every process-data cycle recorded since the last flush is
    delivered — `interval` is the flush cadence, not a sample rate, so a longer
    interval means a bigger batch, never dropped cycles. Each batch is published to
    that topic, delivered only to the clients subscribed to it. Each row is
    `[timestamp, value, ...]` where `timestamp` is **epoch microseconds** (exact in
    a JavaScript number, and distinct per cycle even at sub-millisecond periods).
    The messages:

    ```json
    {"type": "monitoring", "topic": "left-leg", "data": [[1735821000123456, 39000, 41], ...]}
    {"type": "notification", "data": {"event": "slaves_changed"}}
    ```

    `data` is an array of cycle rows; each row is `[timestampUs, v0, v1, ...]` where
    `timestampUs` is epoch microseconds and the values are positionally ordered by
    the monitoring's `parameters` (fetch the order, and how each value is sourced,
    via `GET /api/monitorings/{topic}`). A value is `null` while its owning device
    is not exchanging (SAFE-OP/OP). Numbers beyond 2^53 lose precision in a JS
    client; epoch microseconds stay exact until ~year 2255 and the targeted values
    are 32-bit integers and floats.

    ## Networking, TLS, and CORS

    The server binds the HTTP API to `127.0.0.1:61447` and the WebSocket
    to `127.0.0.1:62281`, reached at `https://local.motion-master.synapticon.com:61447`
    and `wss://local.motion-master.synapticon.com:62281` (a DNS record that resolves
    to localhost), with a real, publicly-trusted TLS certificate bundled in every
    release. CORS allows the single origin
    `https://motion-master.synapticon.com`, the hosted progressive web app.

    A server that should be reachable from another machine sets `server.bindAddress`
    to `0.0.0.0` in its config file and is then addressed as
    `https://<dashed-ip>.ip.motion-master.synapticon.com:61447` (`192-168-1-50.ip.…`
    for `192.168.1.50`). The same bundled certificate covers those names via its
    `*.ip.motion-master.synapticon.com` wildcard, so no per-device certificate is
    involved; they are not published in DNS, so the client machine resolves them with
    one hosts-file entry (see `docs/LAN_DEPLOYMENT.md`). Note that the API is
    **unauthenticated**: binding off loopback exposes full drive control to the network.

    ## Conventions

    - **Errors** — failures return the matching HTTP status with a JSON body of
      the form `{ "error": "<message>" }`. The message is a human-readable string;
      `409` on `init` specifically signals "already initialised" so a client can
      tell a reconnect from a real failure.
    - **Version** — the running server version is reported at `GET /api/version`.
servers:
  - url: https://local.motion-master.synapticon.com:61447
    description: Local Motion Master instance
paths:
  /api/adapters:
    get:
      summary: List network adapters on the host
      operationId: getAdapters
      responses:
        "200":
          description: Array of network adapters available on the host machine
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [macLinux, macWindows, name, description]
                  properties:
                    macLinux:
                      type: string
                      description: MAC address in colon-separated uppercase format
                      example: "AA:BB:CC:DD:EE:FF"
                    macWindows:
                      type: string
                      description: MAC address in dash-separated uppercase format
                      example: "AA-BB-CC-DD-EE-FF"
                    name:
                      type: string
                      description: OS interface name (e.g. eth0 on Linux, \\Device\\NPF_{GUID} on Windows)
                      example: "eth0"
                    description:
                      type: string
                      description: >
                        Human-readable hardware description. Populated on Windows, where the
                        interface name is a GUID device path that identifies nothing; empty on
                        Linux and macOS, where the interface name is the identification. Clients
                        must fall back to `name` when it is empty.
                      example: "Realtek USB GbE Family Controller"
  /api/version:
    get:
      summary: Get Motion Master version
      operationId: getVersion
      responses:
        "200":
          description: Version string
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    example: "6.0.0"
  /api/swagger.yml:
    get:
      summary: Get this OpenAPI specification
      operationId: getSwaggerYml
      description: >
        Returns this document — the OpenAPI specification embedded in the running binary — as
        YAML. Lets a client discover the exact API contract of the server it is talking to
        without a packaged file or a matching source checkout; the served spec always matches
        the running version.
      responses:
        "200":
          description: The OpenAPI specification, as YAML
          content:
            text/yaml:
              schema:
                type: string
  /api/config:
    get:
      summary: Get the configuration Motion Master was started with
      description: >
        The effective configuration after merging the JSONC config file (if any) over the built-in
        defaults — the same `Config` the server booted with. The config file is either the one passed
        via `--config` or a `motion-master.jsonc` auto-discovered next to the executable (`--config`
        wins). Read-only; changing it requires editing the config file and restarting. The shape
        mirrors the config file (server, fieldbus, logging, tls, gameLoop, recorder, parameterCache,
        parameters).
      operationId: getStartedConfig
      responses:
        "200":
          description: The started configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                example:
                  server: { bindAddress: "127.0.0.1", httpPort: 61447, wsPort: 62281, corsOrigin: "https://motion-master.synapticon.com" }
                  fieldbus: { driver: "", adapter: "", mailboxStatusFmmu: false }
                  logging: { level: "info", file: { enabled: true, level: "debug", directory: "", maxSizeMb: 10, maxFiles: 5 } }
                  tls: { certPath: "", keyPath: "", autoUpdate: true }
                  gameLoop: { periodUs: 1000 }
                  recorder: { capacity: 300000, dumpDir: "" }
                  parameterCache: { enabled: true, cacheAllVendors: false, directory: "" }
                  parameters: { readObjectDictionaryOnPreop: true, useCompleteAccess: true }
  /api/system-info:
    get:
      summary: Get host OS and hardware information
      description: >
        A best-effort snapshot of the operating system and hardware Motion Master is running on,
        for the Connection page's System panel. Every field is best-effort: one that cannot be
        determined on the current platform is returned empty (strings) or zero (numbers) rather
        than failing the request. Collected on demand — not cached.
      operationId: getSystemInfo
      responses:
        "200":
          description: Host system snapshot
          content:
            application/json:
              schema:
                type: object
                required:
                  - osName
                  - kernel
                  - architecture
                  - hostname
                  - cpuModel
                  - cpuCores
                  - totalMemoryBytes
                  - diskTotalBytes
                  - diskFreeBytes
                  - container
                  - dockerVersion
                properties:
                  osName:
                    type: string
                    description: Friendly OS name.
                    example: "Ubuntu 24.04 LTS"
                  kernel:
                    type: string
                    description: Kernel or OS build identifier.
                    example: "6.8.0-31-generic"
                  architecture:
                    type: string
                    description: Machine architecture.
                    example: "x86_64"
                  hostname:
                    type: string
                    description: Network host name.
                    example: "motion-master-pi"
                  cpuModel:
                    type: string
                    description: CPU brand string.
                    example: "Intel(R) Core(TM) i7-1185G7 @ 3.00GHz"
                  cpuCores:
                    type: integer
                    description: Logical processor count.
                    example: 8
                  totalMemoryBytes:
                    type: integer
                    format: int64
                    description: Total physical RAM in bytes (0 if unknown).
                    example: 16777216000
                  diskTotalBytes:
                    type: integer
                    format: int64
                    description: Capacity of the filesystem holding the working directory, in bytes.
                    example: 250790436864
                  diskFreeBytes:
                    type: integer
                    format: int64
                    description: Space available to an unprivileged process on that filesystem, in bytes.
                    example: 98765432100
                  container:
                    type: string
                    description: >
                      Container runtime when running inside one ("docker", "podman", "containerd",
                      "kubernetes", "lxc"); empty on bare metal.
                    example: "docker"
                  dockerVersion:
                    type: string
                    description: >
                      Docker version reported by `docker --version` on the host; empty if the docker
                      CLI is not installed/on PATH (including inside Motion Master's own image).
                    example: "27.1.1"
  /api/cert:
    get:
      summary: Get the TLS certificate validity window
      description: >
        Reports the validity window and identity of the certificate the server
        is currently serving. `expiresSoon` trips within 7 days of `notAfter`,
        so the PWA can prompt the user to refresh. Note that an already-expired
        certificate blocks the browser from reaching this endpoint at all; the
        binary self-heals an expired/missing certificate at startup (fetching
        from the rolling release) and exposes `--update-cert` for manual refresh.
        Returns 500 if the certificate file cannot be read or parsed.
      operationId: getCert
      responses:
        "200":
          description: Certificate validity and identity
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    path,
                    subject,
                    issuer,
                    notBefore,
                    notAfter,
                    daysRemaining,
                    expired,
                    expiresSoon,
                  ]
                properties:
                  path:
                    type: string
                    description: Filesystem path of the certificate being served.
                    example: "/opt/motion-master/cert.pem"
                  subject:
                    type: string
                    description: Subject common name (CN).
                    example: "local.motion-master.synapticon.com"
                  dnsNames:
                    type: array
                    description: >
                      The certificate's subjectAltName DNS entries — the hostnames it is valid for,
                      and what a browser actually checks (the CN is legacy and ignored). The bundled
                      certificate covers both the loopback name and the `*.ip.…` wildcard used by
                      off-loopback deployments, so one file serves either. Empty for a certificate
                      with no SAN extension.
                    items:
                      type: string
                    example:
                      [
                        "local.motion-master.synapticon.com",
                        "*.ip.motion-master.synapticon.com",
                      ]
                  issuer:
                    type: string
                    description: Issuer common name (CN).
                    example: "R10"
                  notBefore:
                    type: string
                    format: date-time
                    description: Start of the validity window (ISO 8601 UTC).
                    example: "2026-05-01T00:00:00Z"
                  notAfter:
                    type: string
                    format: date-time
                    description: End of the validity window / expiry (ISO 8601 UTC).
                    example: "2026-08-01T00:00:00Z"
                  daysRemaining:
                    type: integer
                    description: Whole days until expiry; negative once expired.
                    example: 56
                  expired:
                    type: boolean
                    description: Whether the certificate is already past notAfter.
                    example: false
                  expiresSoon:
                    type: boolean
                    description: True when expired or within 7 days of notAfter.
                    example: false
                  chain:
                    type: array
                    description: >
                      Every certificate present in the served PEM file, leaf first, in chain order
                      (leaf → intermediate(s)). A fullchain PEM usually stops at the intermediate —
                      the root lives in the OS trust store and is not transmitted — but the last
                      entry's `issuer` still names that root.
                    items:
                      type: object
                      required: [subject, issuer, organization, issuerOrganization]
                      properties:
                        subject:
                          type: string
                          description: Subject common name (CN) of this certificate.
                          example: "local.motion-master.synapticon.com"
                        issuer:
                          type: string
                          description: Issuer common name (CN) — the subject of the next link up.
                          example: "R10"
                        organization:
                          type: string
                          description: >
                            Subject organization (O) — the friendly CA name (e.g. "Let's Encrypt")
                            that the short CN does not carry; empty if absent (leaf certs often have
                            no O).
                          example: "Let's Encrypt"
                        issuerOrganization:
                          type: string
                          description: >
                            Issuer organization (O) — names the next link's (or, for the last link,
                            the root's) organization; empty if absent.
                          example: "Internet Security Research Group"
        "500":
          description: The certificate file could not be read or parsed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: Human-readable reason the certificate could not be read.
                    example: "cannot parse PEM certificate: /opt/motion-master/cert.pem"
  /api/cert/refresh:
    post:
      summary: Fetch and install a fresh TLS certificate
      description: >
        Downloads a fresh certificate and key from the rolling release, validates
        the pair (parses, CN matches, not expired, key matches cert), and atomically
        installs them next to the binary. The new certificate only takes effect after
        a restart (the TLS listener loads the certificate once at startup), indicated
        by `restartRequired` in the response. Use the still-valid proactive case; an
        already-expired certificate is healed by the binary at startup instead.
      operationId: refreshCert
      responses:
        "200":
          description: The fresh certificate was installed (restart to apply)
          content:
            application/json:
              schema:
                type: object
                required: [notAfter, daysRemaining, restartRequired]
                properties:
                  path:
                    type: string
                    example: "/opt/motion-master/cert.pem"
                  subject:
                    type: string
                    example: "local.motion-master.synapticon.com"
                  issuer:
                    type: string
                    example: "R10"
                  notBefore:
                    type: string
                    format: date-time
                  notAfter:
                    type: string
                    format: date-time
                  daysRemaining:
                    type: integer
                    example: 89
                  expired:
                    type: boolean
                    example: false
                  expiresSoon:
                    type: boolean
                    example: false
                  restartRequired:
                    type: boolean
                    description: Always true — restart Motion Master to serve the new certificate.
                    example: true
        "500":
          description: The certificate could not be fetched, validated, or installed
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "downloaded key does not match certificate"
        "501":
          description: Certificate refresh is not configured on this server
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "certificate refresh is not configured"
  /api/devices/{slavePosition}:
    get:
      summary: Get a single fieldbus device by bus position
      operationId: getDevice
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: Device at the given bus position
          content:
            application/json:
              schema:
                type: object
                required:
                  [slavePosition, name, productName, vendorId, productCode, revisionNumber,
                   serialNumber, isCia402, parametersUnavailable]
                properties:
                  slavePosition:
                    type: integer
                    description: 1-based position on the fieldbus
                    example: 1
                  name:
                    type: string
                    description: >
                      Human-readable device name from SII EEPROM. For SOMANET drives this is the
                      generic group name "SOMANET"; use productName to distinguish products.
                    example: "SOMANET"
                  productName:
                    type: string
                    description: >
                      Canonical product name, independent of the SII EEPROM. For a recognised
                      SOMANET product this distinguishes the product (e.g. "SOMANET Circulo");
                      otherwise it falls back to name.
                    example: "SOMANET Node"
                  vendorId:
                    type: integer
                    format: int64
                    description: Vendor ID from EEPROM
                    example: 131073
                  productCode:
                    type: integer
                    format: int64
                    description: Product code from EEPROM
                    example: 5570560
                  revisionNumber:
                    type: integer
                    format: int64
                    description: Revision number from EEPROM
                    example: 1
                  serialNumber:
                    type: integer
                    format: int64
                    description: Serial number from EEPROM
                    example: 12345
                  isCia402:
                    type: boolean
                    description: >
                      Whether the device implements the CiA402 drive profile (both controlword
                      0x6040 and statusword 0x6041 present in its object dictionary). Gates the
                      CiA402 motion-control endpoints under /api/devices/{slavePosition}/cia402.
                    example: true
                  parametersUnavailable:
                    type: boolean
                    description: >
                      Whether an object-dictionary read for this device has failed since it was
                      scanned. The automatic read on reaching a mailbox-active state is attempted
                      once, so a device flagged here keeps an empty parameter list until
                      `POST /api/devices/{slavePosition}/parameters/init` is called; that clears
                      the flag on success.
                    example: false
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
  /api/init:
    post:
      summary: Initialise the fieldbus driver
      operationId: init
      description: >
        Constructs the requested fieldbus driver, opens the network interface, and
        makes the driver available for subsequent calls to /api/scan.
        The driver defaults to SOEM when omitted. SOEM has no adapter auto-detect:
        a network adapter must be supplied, otherwise init fails.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                driver:
                  type: string
                  description: Fieldbus driver to use (only soem is implemented today; spoe is planned)
                  enum: [soem, spoe]
                  default: soem
                  example: "soem"
                adapter:
                  type: string
                  description: >
                    Network interface name or MAC address. Required for SOEM — there is
                    no auto-detect, so an empty value makes init fail.
                  example: "eth0"
      responses:
        "200":
          description: Driver initialised successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: Request body is not valid JSON
        "409":
          description: >
            A driver is already initialised. init() is one-shot — call POST /api/reset
            before initialising again. Clients can use this to distinguish "already
            connected" (e.g. after a page refresh) from a genuine init failure.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "already initialised — call reset() first"
        "500":
          $ref: "#/components/responses/DriverError"
        "501":
          description: No driver factory configured on this instance
  /api/scan:
    post:
      summary: Scan the bus for slaves
      operationId: scan
      description: >
        Scans the fieldbus for slaves and configures their sync managers and FMMUs.
        Must be called after a successful POST /api/init. Slaves remain in INIT state
        after this call; state transitions are driven by subsequent API calls.


        An empty bus is a successful scan returning 0 slaves, not an error: the master
        cannot distinguish a bus with no devices powered from a disconnected one, and the
        user recovers by powering devices on and scanning again. A 500 is returned only on
        a genuine driver failure (e.g. no driver initialised).
      responses:
        "200":
          description: Scan successful; returns the number of slaves found (0 for an empty or unpowered bus)
          content:
            application/json:
              schema:
                type: object
                required: [slaves]
                properties:
                  slaves:
                    type: integer
                    description: Number of slaves discovered on the bus (0 if empty/unpowered)
                    example: 3
        "500":
          $ref: "#/components/responses/DriverError"
  /api/reset:
    post:
      summary: Reset the fieldbus driver and clear the device list
      operationId: reset
      description: >
        Tears down all master-side state — unpublishes the process image, frees the
        recorder, removes all Device objects, and closes the network interface (releasing
        the NIC). It does not command the slaves to any AL state; the master simply stops
        talking to the bus. After this returns, POST /api/init and POST /api/scan may be
        called again.
      responses:
        "200":
          description: Reset completed successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
  /api/log:
    get:
      summary: Get recent log output
      operationId: getLog
      description: >
        Returns the most recent in-memory log lines as plain text, one entry per line.
        The ring buffer holds up to 100 000 entries (~10 MB).
      responses:
        "200":
          description: Log output as plain text, one entry per line
          content:
            text/plain:
              schema:
                type: string
  /api/meta/al-status-codes:
    get:
      summary: List all known AL Status Codes
      operationId: getAlStatusCodes
      description: >
        Returns the static catalogue of EtherCAT AL Status Codes defined in ETG.1000.6 §6.4.1.
        These codes appear in the alStatusCode field of the device state response when an error
        is present and identify the cause of the state transition failure.
      responses:
        "200":
          description: Array of AL Status Code descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlStatusCode"
  /api/meta/esc-registers:
    get:
      summary: List all known ESC registers
      operationId: getRegisters
      description: >
        Returns the static catalogue of well-known EtherCAT Slave Controller registers
        from the Beckhoff ESC datasheet (Section II) and ETG.1000.4.
        Use the address and length fields as inputs to the device register read/write endpoints.
      responses:
        "200":
          description: Array of ESC register descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EscRegister"
  /api/meta/foe-error-codes:
    get:
      summary: List all known FoE error codes
      operationId: getFoeErrorCodes
      description: >
        Returns the static catalogue of standard File over EtherCAT (FoE) error codes
        defined in ETG.1000.6 §5.5.  These codes appear in the FoE ERROR packet sent
        by the slave when a file transfer fails, and are surfaced in the error message
        returned by the file read endpoint.  Vendor-specific codes outside the 0x8000
        range are not listed here.
      responses:
        "200":
          description: Array of FoE error code descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FoeErrorCode"
  /api/meta/sdo-abort-codes:
    get:
      summary: List all known CoE SDO abort codes
      operationId: getSdoAbortCodes
      description: >
        Returns the static catalogue of CoE SDO abort codes defined in ETG.1000.6
        §5.6.2.7.2, Table 41 (which reproduces the CANopen CiA 301 abort transfer
        codes).  A slave returns one of these when a mailbox SDO read/write fails;
        the code is embedded in the error text returned by the SDO endpoints.
      responses:
        "200":
          description: Array of SDO abort code descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SdoAbortCode"
  /api/meta/kuebler-registers:
    get:
      summary: The Integro internal encoder's register map
      description: >
        The register map of the Integro's internal (Kübler) encoder — the reference table for
        POST /api/devices/{slavePosition}/procedures/kuebler-register-communication, and
        documentation in its own right. Static: it describes the encoder type, not any connected
        device, so it needs no bus and no scan.


        Transcribed from the vendor's own draft table. Each entry carries the width, the access type,
        whether the encoder actually implements it — seven are documented but not implemented — and
        the vendor's bit definitions verbatim, which for a bit-field register is the only place its
        meaning is recorded.


        `format` says how to read the assembled value, because signedness is not uniform and one
        register is not a single number at all: `unsigned`, `signed`, `bitField` (the number means
        nothing on its own), or `signedHalves` — two signed 16-bit values packed into 32 bits, which
        register 0x3C is the only case of. `readableInOneCommand` is false for the one 64-bit
        register, since the command's length byte caps at 4 bytes.
      operationId: getKueblerRegisters
      responses:
        "200":
          description: Every register the vendor's draft documents, ascending by address
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [address, bits, name, access, implemented, format, definition,
                     readableInOneCommand]
                  properties:
                    address:
                      type: integer
                      description: Register address, as OS command 19 carries it.
                      example: 48
                    bits:
                      type: integer
                      description: Width in bits — 8, 16, 32, or 64.
                      example: 32
                    name:
                      type: string
                      description: The vendor's own name for the register.
                      example: Absolute position ST
                    access:
                      type: string
                      enum: [ro, wo, rw]
                      example: ro
                    implemented:
                      type: boolean
                      description: Whether the encoder implements it, per the vendor's draft.
                      example: true
                    format:
                      type: string
                      enum: [unsigned, signed, bitField, signedHalves]
                      description: How to read the assembled value.
                      example: unsigned
                    definition:
                      type: string
                      description: The vendor's bit definitions, clauses joined with "; ".
                      example: Left aligned 32 bit singleturn position
                    readableInOneCommand:
                      type: boolean
                      description: >-
                        False only for the 64-bit register, which exceeds the command's 4-byte
                        length field.
                      example: true
  /api/meta/mailbox-error-codes:
    get:
      summary: List all known CoE mailbox error codes
      operationId: getMailboxErrorCodes
      description: >
        Returns the static catalogue of CoE mailbox error codes defined in
        ETG.1000.4, Table 30 ("Error Reply Service Data").  A slave returns one of
        these when the mailbox layer (below a specific protocol such as CoE/FoE)
        rejects a transfer; the code is embedded in the error text the mailbox
        endpoints return.
      responses:
        "200":
          description: Array of mailbox error code descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MailboxErrorCode"
  /api/meta/object-data-types:
    get:
      summary: List all known CoE object dictionary data types
      operationId: getObjectDataTypes
      description: >
        Returns the static catalogue of ETG.1020 data type codes used in CoE object
        dictionary entries.  Each entry of a `DeviceParameter` carries a `dataType`
        field whose value is one of the codes listed here.
      responses:
        "200":
          description: Array of data-type descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ObjectDataTypeInfo"
  /api/devices/{slavePosition}/parameters/init:
    post:
      summary: Initialise the parameter list for a device by enumerating its object dictionary
      operationId: initializeDeviceParameters
      description: >
        Enumerates the entire CoE object dictionary of the device at
        `slavePosition` via the SDO Info service ("Get Object List" → "Get Object
        Description" → "Get Entry Description") and rebuilds its parameter map.
        The device must be in PRE-OP, SAFE-OP, or OP (mailbox communication
        active).  On a fully populated drive the call can take several seconds.
        When `readValues=true` each entry is additionally read via SDO upload and
        the decoded value is stored on the parameter; entries that fail to read
        keep their type-appropriate default and the call still succeeds.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: readValues
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: >-
            When `true`, perform an SDO upload for every entry and decode the
            value.  Defaults to `false` — only schema (name, type, access) is
            populated.
      responses:
        "200":
          description: Parameter list ordered by (index, subindex)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: slavePosition is not a valid integer
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/parameters/read:
    post:
      summary: Refresh the cached value of every parameter without re-enumerating the dictionary
      operationId: readAllDeviceParameters
      description: >
        Re-reads the value of every readable parameter already loaded for the
        device at `slavePosition`, leaving the parameter list itself intact (it
        does not re-enumerate the object dictionary — use
        `POST …/parameters/init` for that).  Each value is read PDO-aware: from
        the live process image when the device is exchanging and the object is
        PDO-mapped, otherwise via an SDO upload over the mailbox.  Write-only
        objects are skipped.  Best-effort: an entry that fails to read keeps its
        cached value and the call still succeeds.  Returns the refreshed list,
        ordered by `(index, subindex)`.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: Refreshed parameter list ordered by (index, subindex)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: slavePosition is not a valid integer
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/parameters:
    get:
      summary: Read the previously initialised parameter list for a device
      operationId: getDeviceParameters
      description: >
        Returns the parameter list populated by the most recent call to
        `POST /api/devices/{slavePosition}/parameters/init`.  Empty before the
        first call.  Entries are ordered ascending by `(index, subindex)`.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: Parameter list ordered by (index, subindex)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
  /api/devices/{slavePosition}/parameters/{index}/{subindex}:
    get:
      summary: Read a single parameter value (PDO-aware, with optional cache-only mode)
      operationId: readParameter
      description: >
        Reads one parameter of the device at `slavePosition` and returns the full
        `DeviceParameter` (value plus metadata: data type, access, sync state).

        Unlike the raw `GET …/sdo/{index}/{subindex}` endpoint, this is PDO-aware.
        With `source=auto` (the default) the value is taken from the live process
        image when the device is exchanging and the object is PDO-mapped, otherwise
        via an SDO upload, otherwise from the cache. With `source=cache` the cached
        value is served with no bus access at all.

        Both `index` and `subindex` accept decimal or hexadecimal notation; prefix
        with `0x` for hex (e.g. `0x6064` or `24676` for object 0x6064).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: CoE object index in decimal (e.g. 24676 for 0x6064)
          example: 24676
        - name: subindex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 255
          description: CoE object subindex in decimal
          example: 0
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [auto, cache]
            default: auto
          description: >-
            `auto` (default) reads PDO-when-exchanging else SDO else cache;
            `cache` returns the cached value with no bus access.
      responses:
        "200":
          description: The parameter (value plus metadata)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: slavePosition, index, or subindex is missing or not a valid integer
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    put:
      summary: Write a single parameter value (PDO-aware)
      operationId: writeParameter
      description: >
        Writes one parameter of the device at `slavePosition`. The value is coerced
        to the parameter's declared data type, then routed: staged into the process
        image when the device is exchanging and the object is output (RxPDO) mapped —
        sent on the next cycle — otherwise written via an SDO download, otherwise held
        in the cache as pending until the device is back online.

        This is the endpoint to set a target (e.g. target torque 0x6071) or the modes
        of operation: it knows which objects are PDO-mapped and stages them into the
        process data, falling back to SDO transparently. Returns the updated
        `DeviceParameter` (with the coerced value and resulting sync state).

        Both `index` and `subindex` accept decimal or hexadecimal notation; prefix
        with `0x` for hex.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: CoE object index in decimal (e.g. 24676 for 0x6064)
          example: 24676
        - name: subindex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 255
          description: CoE object subindex in decimal
          example: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: >-
                    The value to set, coerced to the parameter's declared type. A
                    number for integer/real objects, a string for string objects, or
                    an array of bytes for octet/domain objects.
                  oneOf:
                    - type: number
                    - type: string
                    - type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 255
                  example: 100
      responses:
        "200":
          description: The updated parameter (value plus metadata)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceParameter"
        "400":
          description: slavePosition, index, or subindex is invalid, or the body is malformed
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/registers/{address}:
    get:
      summary: Read bytes from an ESC register
      operationId: readRegister
      description: >
        Reads `length` bytes from the ESC register at `address` on the slave at `slavePosition`
        using a Configured-Address Read (FPRD) datagram.
        Pass `address` in decimal (e.g. 272 for DL Status at 0x0110).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: address
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: ESC register address in decimal (e.g. 272 for 0x0110)
          example: 272
        - name: length
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Number of bytes to read
          example: 2
      responses:
        "200":
          description: Raw register bytes
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
                    description: Register bytes in ascending address order
                    example: [65, 0]
        "400":
          description: slavePosition, address, or length is missing or not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    post:
      summary: Write bytes to an ESC register
      operationId: writeRegister
      description: >
        Writes bytes to the ESC register at `address` on the slave at `slavePosition`
        using a Configured-Address Write (FPWR) datagram.
        Pass `address` in decimal (e.g. 272 for DL Status at 0x0110).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: address
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: ESC register address in decimal
          example: 288
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  description: Bytes to write in ascending address order
                  example: [1, 0]
      responses:
        "200":
          description: Write completed successfully
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: slavePosition or address is not a valid integer, or request body is malformed
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/watchdog:
    get:
      summary: Read the process-data (sync-manager) watchdog configuration
      operationId: getProcessDataWatchdog
      description: >
        Reads the process-data watchdog timeout the slave at `slavePosition` is configured with,
        decoded from the watchdog divider (0x0400) and process-data watchdog time (0x0420) ESC
        registers. This is the configured timeout itself, not the expiration counter exposed by
        `GET /api/devices/diagnostics`. A device in OP that misses process data past this timeout
        faults itself to SAFE-OP+error; raising it lets a device tolerate the brief PDO pause of a
        whole-bus re-map.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: Decoded watchdog configuration
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDataWatchdog"
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    put:
      summary: Set the process-data (sync-manager) watchdog timeout
      operationId: setProcessDataWatchdog
      description: >
        Sets the process-data watchdog timeout of the slave at `slavePosition`, writing the
        process-data watchdog time register (0x0420). The device's watchdog divider (0x0400) is
        left untouched (it is shared with the PDI watchdog), so the achieved timeout is rounded to
        that divider's tick base — the response reports the value actually programmed. A
        `timeoutMs` of 0 disables the watchdog. The write persists across re-maps and re-scans
        until the ESC reloads EEPROM (power cycle).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timeoutMs]
              properties:
                timeoutMs:
                  type: number
                  minimum: 0
                  description: Desired watchdog timeout in milliseconds; 0 disables the watchdog
                  example: 200
      responses:
        "200":
          description: Watchdog configuration actually programmed (timeout rounded to the tick base)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDataWatchdog"
        "400":
          description: >
            slavePosition is not a valid integer, the body is malformed, timeoutMs is negative, or
            the requested timeout exceeds what the device's watchdog divider can represent
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/pdo-mapping:
    get:
      summary: Read a device's PDO mapping grouped by object (CoE)
      operationId: getDevicePdoMapping
      description: >
        Reads the PDO mapping of the slave at `slavePosition` over CoE, grouped by mapping object:
        the sync-manager assignment (0x1C12 outputs / 0x1C13 inputs) and, for each assigned mapping
        object (0x16xx / 0x1Axx), its `pdoIndex` and ordered entries. `outputs` are RxPDO objects
        (master→slave), `inputs` are TxPDO objects (slave→master). Each entry carries its derived
        `bitOffset` within the direction's window. This is the grouped, round-trippable counterpart
        of the flat, whole-bus `GET /api/process-image`.


        Reads fresh over SDO, so the device's mailbox must be active (PRE-OP, SAFE-OP, or OP); a
        device in INIT or BOOT yields 409.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The device's grouped PDO mapping
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdoMapping"
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
        "409":
          description: The device's mailbox is not active (it is in INIT or BOOT)
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
        "500":
          $ref: "#/components/responses/DriverError"
    put:
      summary: Rewrite a device's PDO mapping (CoE)
      operationId: writeDevicePdoMapping
      description: >
        Reconfigures the PDO mapping of the slave at `slavePosition` over CoE: both directions'
        sync-manager assignment (0x1C12 outputs / 0x1C13 inputs) and the referenced mapping objects
        (0x16xx / 0x1Axx). `outputs` are RxPDO objects (master→slave), `inputs` are TxPDO objects
        (slave→master); the array order is the sync-manager assignment order, which fixes each
        object's position in the process image. Both directions must be present — an empty array
        clears that sync manager's assignment.


        **The device must be in PRE-OP.** The mapping and assignment objects are writable only in
        PRE-OP; in SAFE-OP/OP the sync managers are active and the slave rejects the write, and
        INIT/BOOT have no CoE mailbox. This is the "drop to PRE-OP, remap, climb back" flow: take
        the device to PRE-OP (`POST /api/devices/state`), call this, then transition it back to
        SAFE-OP/OP — at which point the whole-bus process image is re-mapped from the new mapping.


        The write follows the CoE ordering rule (clear assignment, rewrite each mapping object, then
        re-assign), is read back and verified, and is retried a few times so a dropped mailbox frame
        cannot leave the object dictionary half-configured. The response is the device's grouped
        read-back mapping (same shape as GET), whose `bitOffset` values are derived by the device
        (the request omits them). This endpoint does not itself change the AL state or re-map the
        process image.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdoMappingRequest"
      responses:
        "200":
          description: The device's grouped read-back mapping, verified equal to the request
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdoMapping"
        "400":
          description: slavePosition is not a valid integer, or the body is malformed or out of range
        "404":
          description: No device at the given bus position
        "409":
          description: >
            The write was rejected — most often because the device is not in PRE-OP, but also a
            malformed mapping the device aborted, or a read-back that did not match the request
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/cia402:
    get:
      summary: Read a device's CiA402 control snapshot
      description: >
        Returns the drive's current control state — the decoded state-machine state, the raw
        status (0x6041) and control (0x6040) words, and the active operation mode (display object
        0x6061). The values are read live (from the process image when the device is exchanging,
        else over SDO), so poll this to drive a motion UI. Only valid for a CiA402 device (see the
        isCia402 flag on GET /api/devices).
      operationId: getCia402Status
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The device's CiA402 control snapshot
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cia402Status"
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a CiA402 drive, or its object dictionary is not enumerated
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
  /api/devices/{slavePosition}/operation-modes:
    get:
      summary: List a device's operation modes
      description: >
        Every operation mode the device has, standard and manufacturer-specific, with what the
        drive says about each. The standard modes are CiA402's (ETG.6010 §6.8.1) and carry the bit
        of "Supported drive modes" (0x6502) that advertises them, decoded into `supported`. The
        manufacturer modes are the vendor's own — the negative half of 0x6060 — and are listed only
        for a device whose vendor this server knows; their `supported` is null, because 0x6502
        reserves bits 16-31 for the vendor without defining them, so a drive has no way to advertise
        one that a master could read. That null means "the drive does not say", not "no".

        Read this once per device and cache it: it is a static property of the firmware, and the one
        thing that makes a negative value of 0x6061 nameable rather than "Unknown".
      operationId: getOperationModes
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The device's operation modes
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationModes"
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a CiA402 drive, or its object dictionary is not enumerated
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
  /api/devices/{slavePosition}/cia402/mode:
    post:
      summary: Set a device's CiA402 operation mode
      description: >
        Writes the requested operation mode to 0x6060 and returns the resulting control snapshot.
        The drive reflects the accepted mode in 0x6061 (the modeOfOperation of the response) once
        it takes effect.


        Any value object 0x6060 can hold is accepted, standard or manufacturer-specific — the
        negative half of that range belongs to the vendor, so a SOMANET's diagnostics (-2) or
        system identification (-4) go through here like any other. Whether a given drive has the
        mode is the drive's answer, seen in the modeOfOperation of the response;
        GET /api/devices/{slavePosition}/operation-modes is what lists them beforehand.
      operationId: setCia402OperationMode
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: integer
                  minimum: -128
                  maximum: 127
                  description: >
                    Operation mode to request (the 0x6060 value). Standard modes are 0 NoMode,
                    1 Profile Position, 2 Velocity, 3 Profile Velocity, 4 Profile Torque, 6 Homing,
                    7 Interpolated Position, 8 Cyclic Sync Position, 9 Cyclic Sync Velocity,
                    10 Cyclic Sync Torque, 11 Cyclic Sync Torque with Commutation Angle; negative
                    values are the vendor's.
                  example: 9
      responses:
        "200":
          description: The post-write CiA402 control snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cia402Status"
        "400":
          description: slavePosition is invalid, the body is malformed, or the mode is unknown
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a CiA402 drive, or the write failed
  /api/devices/{slavePosition}/cia402/state:
    post:
      summary: Bring a drive to a CiA402 state
      description: >
        Walks the CiA402 device-control state machine to the state you name, issuing whatever
        transitions that takes and re-reading the drive between each — so multi-hop paths are
        ordinary: Switch On Disabled up to Operation Enabled, Quick Stop Active back down to Ready
        To Switch On. Starting from Fault begins with a fault reset, and a fault whose cause is
        still present is reported as such (with the drive's 0x603F error code) rather than as a
        timeout.


        Only the five states a master can command are accepted. Not Ready To Switch On, Fault
        Reaction Active and Fault are entered by the drive itself and are rejected as a bad request.


        **Asking for Operation Enabled while the drive is in Quick Stop Active leaves that quick
        stop** (CiA402 transition 16), because naming the destination is an explicit instruction to
        go there. The "enable" command on the sibling endpoint deliberately does not, so a
        procedure preparing a drive cannot undo somebody's stop by accident.


        The device must be exchanging process data for any of this to progress — the statusword has
        to update between polls, and the firmware refuses Operation Enabled unless master
        communication is live. Returns the resulting control snapshot.
      operationId: transitionToCia402State
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum:
                    [SwitchOnDisabled, ReadyToSwitchOn, SwitchedOn, OperationEnabled,
                     QuickStopActive]
                  description: The state to bring the drive to.
                  example: OperationEnabled
      responses:
        "200":
          description: The CiA402 control snapshot after arriving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cia402Status"
        "400":
          description: >-
            slavePosition is invalid, the body is malformed, the state is unknown, or the state is
            one the drive enters on its own and cannot be asked for
        "404":
          description: No device at that slavePosition
        "409":
          description: >-
            The device is not a CiA402 drive, its object dictionary is not enumerated, a fault will
            not clear, or the walk timed out
  /api/devices/{slavePosition}/cia402/command:
    post:
      summary: Run a CiA402 state-machine command
      description: >
        Drives the CiA402 device-control state machine. "enable" walks every intermediate
        transition to Operation Enabled (clearing a fault first if needed); "disable" goes to
        Switch On Disabled; "quickStop" triggers a quick stop; "faultReset" clears a latched
        fault. The device must be exchanging process data for "enable" to make progress. Returns
        the resulting control snapshot.


        Use POST /api/devices/{slavePosition}/cia402/state to name a destination instead of an
        action — it reaches states these four cannot, and it is the one that will leave a quick
        stop. "enable" here deliberately will not.
      operationId: runCia402Command
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [enable, disable, quickStop, faultReset]
                  description: The state-machine action to perform.
                  example: enable
      responses:
        "200":
          description: The post-command CiA402 control snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cia402Status"
        "400":
          description: slavePosition is invalid, the body is malformed, or the command is unknown
        "404":
          description: No device at that slavePosition
        "409":
          description: >
            The device is not a CiA402 drive, or the command failed (including an enable that did
            not reach Operation Enabled before timing out)
  /api/devices/{slavePosition}/cia402/target:
    post:
      summary: Set a CiA402 cyclic setpoint (target)
      description: >
        Writes the one setpoint that matches the active operation mode — target position (0x607A,
        INTEGER32) in PP/CSP, target velocity (0x60FF, INTEGER32) in PV/CSV, or target torque
        (0x6071, INTEGER16, per-mille of rated) in PT/CST. All are signed: negative values command
        reverse motion or regenerative torque. Routes through the live process image when the
        object is PDO-mapped and the device is exchanging, else an SDO download.
      operationId: setCia402Target
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, value]
              properties:
                target:
                  type: string
                  enum: [position, velocity, torque]
                  description: Which setpoint to write (pick the one matching the active mode).
                  example: velocity
                value:
                  type: integer
                  description: >
                    The setpoint value in the object's own units (signed). For torque it is
                    per-mille of rated and is narrowed to INTEGER16.
                  example: 1000
      responses:
        "204":
          description: The setpoint was written
        "400":
          description: slavePosition is invalid, the body is malformed, or the target kind is unknown
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a CiA402 drive, or the write failed
  /api/devices/{slavePosition}/procedures:
    get:
      summary: List the procedures a device supports
      description: >
        Returns every procedure available on the device, each with its descriptor and the state of
        its current or last run. One request is enough to render a whole per-device procedures view:
        the descriptor carries the title, description and caveats to display, and the snapshot says
        whether anything is running or how the last run went.


        The list is per device, not global — a procedure is offered only where it applies, so a
        third-party slave reports an empty list rather than controls that could only ever fail. A
        procedure that has never run reports an idle snapshot (`status` `idle`, `runCount` 0, every
        step `idle`), so every entry has the same shape.
      operationId: listProcedures
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The procedures this device supports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcedureListing" }
        "400":
          description: slavePosition is invalid
        "404":
          description: No device at that slavePosition
  /api/devices/{slavePosition}/procedures/{procedureName}:
    post:
      summary: Start a procedure on a device
      description: >
        Starts the named procedure and returns as soon as the run is under way — this does **not**
        wait for it to finish. Poll `GET` on the same path for its outcome, or `DELETE` to cancel it.


        The request body carries the procedure's parameters, and each descriptor from
        `GET /api/devices/{slavePosition}/procedures` reports its own in `parameters` — name, type,
        bounds, default, and whether it is required — which is enough to build a form for any
        procedure without hard-coding one per name. A procedure that takes no parameters may be
        started with no body.


        Only one procedure may run on a device at a time; a second start is refused with 409 while
        the first is in flight. Most procedures require an active mailbox, so the device must be in
        PRE-OP, SAFE-OP or OP. A run the drive answers with an error is not a failure of *this*
        request — it is reported in the snapshot as a failed run.
      operationId: startProcedure
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: procedureName
          in: path
          required: true
          schema: { type: string }
          description: Procedure identifier, as reported by the list endpoint
          example: os-command
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcedureRequest" }
      responses:
        "202":
          description: >
            The run has started. The body is the initial snapshot, with `status` `running` and
            `runCount` already bumped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcedureSnapshot" }
        "400":
          description: >
            slavePosition is invalid, the body is not valid JSON, or the procedure rejected its
            parameters
        "404":
          description: >
            No device at that slavePosition, or no procedure by that name on that device
        "409":
          description: Another procedure is already running on that device
    get:
      summary: Read the state of a procedure on a device
      description: >
        Returns the current run, or the last one to have finished. This is the whole progress
        surface — there is no push channel — and polling it is lossless: every finished step keeps
        its terminal status and value, so a step that both starts and completes between two polls is
        still reported as succeeded. A polling loop is `while status == "running"`.


        A procedure that has never run is not an absence: it reports an idle snapshot built from the
        procedure's step template, so a client renders one shape and needs no empty-state branch.
        The snapshot is retained after a run ends, so a client that reconnects (or a user returning
        to a page) sees how the last run went. It is dropped when the device set is rebuilt by a scan
        or reset, because bus positions may then name different hardware.
      operationId: getProcedure
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: procedureName
          in: path
          required: true
          schema: { type: string }
          description: Procedure identifier, as reported by the list endpoint
          example: os-command
      responses:
        "200":
          description: The current or last-known state of the procedure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcedureSnapshot" }
        "400":
          description: slavePosition is invalid
        "404":
          description: >
            No device at that slavePosition, or no procedure by that name on that device
    delete:
      summary: Cancel a running procedure on a device
      description: >
        Asks the running procedure to stop and returns immediately. Where the procedure is waiting on
        the drive it also tells the drive to abort (for an OS command, 0x1024 = 3), so a run that is
        waiting stops when asked rather than carrying on to completion. The run then finishes with
        status `cancelled`.


        This cancels the *run*, not the record: the snapshot remains and reports how far it got.
      operationId: cancelProcedure
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: procedureName
          in: path
          required: true
          schema: { type: string }
          description: Procedure identifier, as reported by the list endpoint
          example: os-command
      responses:
        "202":
          description: The running procedure has been asked to stop
        "400":
          description: slavePosition is invalid
        "404":
          description: >
            No device at that slavePosition, no procedure by that name, or nothing running for it
  /api/devices/{slavePosition}/brake:
    get:
      summary: Read a drive's brake configuration and state
      description: >
        Reports the brake objects (0x2004) that decide what a release or engage will do: its current
        state, the release strategy, the pull time and the pull/hold voltages.


        Read this before commanding the brake. `softwareControllable` is false when the release
        strategy is `manualOutputVoltage`, meaning the firmware does not drive the brake at all and
        both commands below are no-ops. `releaseMovesShaft` is true for a pin brake, whose release
        procedure turns the motor to lift the load off the pin.
      operationId: getBrake
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The brake's configuration and current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrakeState" }
        "400":
          description: slavePosition is invalid
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a SOMANET drive, or a read failed
  /api/devices/{slavePosition}/hrd:
    get:
      summary: Read back a drive's high resolution data recording
      description: >
        Reads the files the `hrd-streaming` procedure recorded, concatenates them in order and
        decodes them into samples. Run that procedure first; this endpoint only reads what is
        already on the drive.


        **`data` is required and must match what was recorded.** Nothing on the drive says which
        signal its files hold, so the wrong selection reinterprets the same bytes as a different
        layout and returns plausible nonsense. The procedure's `configure-stream` step reports the
        selection it used for exactly this reason.


        Samples travel positionally — `columns` names the fields of each row, once, the way a
        monitoring topic ships its parameter order once — because a full recording is up to ten
        thousand rows. `trailingBytes` is what was left over past the last whole sample: the drive
        allocates its files in fixed-size blocks, so a recording that does not fill the last block
        ends in padding rather than data.


        Answers **JSON or CSV**, chosen by the `Accept` header. CSV is the same numbers in the same
        column order, one header row then one row per sample — a file to open in a spreadsheet
        rather than JSON to read, which for ten thousand rows is usually what is wanted.


        Values are decoded, not raw: `velocityRpm` is converted out of the file's Q15 fixed point
        (exactly — multiply by 32768 to recover the stored integer), while `torquePermil` and the
        encoder's `raw` word are the file's own values.


        Blocks for the transfer, which is up to five 8 KB FoE reads plus the listing.
      operationId: readHrdRecording
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: data
          in: query
          required: true
          schema:
            type: string
            enum: [encoder-raw, system-identification]
          description: >
            Which layout the files hold — the same selection the recording was made with.
          example: encoder-raw
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum: [application/json, text/csv]
            default: application/json
          description: >
            `text/csv` returns the recording as CSV — a header row of column names, then one row
            per sample. Anything else returns JSON.
      responses:
        "200":
          description: The decoded recording
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HrdRecording" }
            text/csv:
              schema:
                type: string
              example: |
                raw,masterCount,noniusCount
                16385,1,1
                16386,2,1
        "400":
          description: slavePosition is invalid, or `data` is missing or not a known selection
        "404":
          description: No device at that slavePosition
        "409":
          description: >
            The device is not a SOMANET drive, holds no recording, or a file could not be read
  /api/devices/{slavePosition}/brake/release:
    post:
      summary: Release (disengage) a drive's brake
      description: >
        Writes "disengaged" to the brake state object (0x2004:07) and waits the drive's pull time
        (0x2004:03) plus `settle` before answering, because the firmware blocks motion — and
        motion-related OS commands — until the pull time expires. Answers with the brake state read
        back.


        **The release only actually happens while the drive is in OP ENABLED.** In any other state the
        write merely energises the brake output (phase D). Note also that entering OP ENABLED releases
        the brake automatically in normal operation but **not** in diagnostics mode, where the master
        owns the brake — which is why a diagnostics procedure has to call this.


        **On a pin brake this moves the shaft**: the controller raises current progressively until the
        load has lifted off the pin by the minimum displacement (0x2004:08), reversing direction if it
        reaches the current ceiling (0x2004:09, a percentage of rated current) first. Check `releaseMovesShaft` on `GET .../brake`.


        Brake release is open-loop — nothing confirms the brake let go — so the wait is the only
        margin there is. A brake whose release strategy is `manualOutputVoltage` is left alone and the
        returned state says so; that is not an error. **A released brake stays released**: nothing
        re-engages it for you, so on a vertical or loaded axis engage it again when you are done.
      operationId: releaseBrake
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: settle
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 50 }
          description: >
            Extra wait in milliseconds on top of the drive's pull time. Size it for the machine —
            release is open-loop, so this is the only margin between "commanded" and "assumed
            released".
          example: 50
      responses:
        "200":
          description: The brake state read back after the command
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrakeState" }
        "400":
          description: slavePosition or settle is invalid
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a SOMANET drive, or the command failed
  /api/devices/{slavePosition}/brake/engage:
    post:
      summary: Engage a drive's brake
      description: >
        Writes "engaged" to the brake state object (0x2004:07) and waits `settle` before answering
        with the brake state read back. There is no pull time on the way in — a brake is
        spring-engaged, so engaging it is the removal of voltage — so the wait is only `settle`.


        As with release, a brake whose release strategy is `manualOutputVoltage` is left alone and the
        returned state says so.
      operationId: engageBrake
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: settle
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 50 }
          description: How long to wait in milliseconds after commanding the brake before answering.
          example: 50
      responses:
        "200":
          description: The brake state read back after the command
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrakeState" }
        "400":
          description: slavePosition or settle is invalid
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a SOMANET drive, or the command failed
  /api/devices/{slavePosition}/sdo/{index}/{subindex}:
    get:
      summary: Upload an object dictionary entry from a device (CoE SDO upload)
      operationId: sdoUpload
      description: >
        Performs a CoE SDO upload — reads the value of object `index:subindex` from
        the device at `slavePosition` and returns the raw bytes as a JSON array.
        Both `index` and `subindex` accept decimal or hexadecimal notation;
        prefix with `0x` for hex (e.g. `0x6064` or `24676` for object 0x6064).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: CoE object index in decimal (e.g. 24676 for 0x6064)
          example: 24676
        - name: subindex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 255
          description: CoE object subindex in decimal
          example: 0
      responses:
        "200":
          description: Raw object bytes from the device
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                      maximum: 255
                    description: Object bytes as transferred by the SDO upload
                    example: [0, 0, 0, 0]
        "400":
          description: slavePosition, index, or subindex is missing or not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    put:
      summary: Download an object dictionary entry to a device (CoE SDO download)
      operationId: sdoDownload
      description: >
        Performs a CoE SDO download — writes the raw bytes in the request body to
        object `index:subindex` on the device at `slavePosition`. The byte count must
        match the object's length. Requires the device to be in PRE-OP, SAFE-OP, or OP
        (mailbox communication active). Both `index` and `subindex` accept decimal or
        hexadecimal notation; prefix with `0x` for hex (e.g. `0x6064` or `24676`).
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 65535
          description: CoE object index in decimal (e.g. 24676 for 0x6064)
          example: 24676
        - name: subindex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 255
          description: CoE object subindex in decimal
          example: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 255
                  description: Object bytes to write (little-endian, must match the object length)
                  example: [100, 0, 0, 0]
      responses:
        "200":
          description: Download completed successfully
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: slavePosition, index, or subindex is invalid, or the request body is malformed
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/files:
    get:
      summary: List the files stored on a device
      description: >
        Lists what the device holds — firmware images, the ESI, logs, configuration and any
        high resolution data recording — with the size it reports for each.


        **Vendor-specific despite reading like a filesystem listing.** EtherCAT defines no directory
        service, so SOMANET firmware serves its own as a pseudo-file (`fs-getlist`) read over FoE. A
        device that is not a SOMANET drive is refused rather than probed.


        `byteCount` is absent when the device reported a name without a size, which is a formatting
        quirk of one entry rather than a reason to hide the file.
      operationId: listDeviceFiles
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The files the device reported, in the order it reported them
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceFile" }
        "400":
          description: slavePosition is invalid
        "404":
          description: No device at that slavePosition
        "409":
          description: The device is not a SOMANET drive, or the listing could not be read
  /api/devices/{slavePosition}/hardware-description:
    get:
      summary: Read what a device says it is
      operationId: getDeviceHardwareDescription
      description: >
        Reads and decodes the device's `.hardware_description` file over FoE — its product id and
        revision, serial number, the components it is built from, and the assembly it was packaged
        into.


        It is also the only source of the descriptor that decides which firmware belongs on the
        device, which is what most callers want it for (see
        `/api/devices/{slavePosition}/firmware-compatibility`).


        **Readable in BOOT as well as PRE-OP and above.** The bootloader deliberately allows this one
        file, which is what lets a compatibility check work on a drive a failed install left
        stranded there — precisely when knowing whether the package was the right one matters most.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The decoded file
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareDescription"
        "400":
          description: slavePosition is invalid
        "404":
          description: No device at that slavePosition
        "409":
          description: >
            The device is not a SOMANET drive, the file could not be read, or its content is not a
            hardware description
  /api/devices/{slavePosition}/variant:
    get:
      summary: Read a device's Integro variant file
      operationId: getDeviceIntegroVariant
      description: >
        Reads and decodes the device's `.variant` file over FoE — which features the Integro was
        licensed with.


        **A 404 is the ordinary answer for most devices.** Only Integro drives carry this file, so
        the resource being absent is normal rather than a problem. Its one property that matters
        beyond inspection is `fieldbusProtocol`, which the hardware description deliberately does
        not carry and a full firmware descriptor ends with.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
      responses:
        "200":
          description: The decoded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegroVariant"
        "400":
          description: slavePosition is invalid
        "404":
          description: No device at that slavePosition, or the device carries no `.variant` file
        "409":
          description: >
            The device is not a SOMANET drive, the file could not be read, or its content is not a
            variant file
  /api/devices/{slavePosition}/firmware-compatibility:
    get:
      summary: Check whether a firmware package belongs on a device
      operationId: checkDeviceFirmwareCompatibility
      description: >
        Reads the device's `.hardware_description` and `.variant`, assembles the full firmware
        descriptors it accepts, and compares them against the descriptor in `filename`.


        **A mismatch is a `200` carrying `compatible: false`**, not an error status: the client asked
        a question and got an answer, and the body names both descriptors so it can say which
        hardware the package was for. A `4xx` means the question could not be asked — the filename is
        not a package name, or the hardware description could not be read.


        **Nothing acts on the answer.** The firmware installation procedure writes whatever it is
        given, on purpose, so this exists to tell a user before they start.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: filename
          in: query
          required: true
          schema: { type: string }
          description: The package filename, with no directory part.
          example: package_SOMANET-Circulo-7_8500-04-2332_motion-drive_v5.6.10.zip
      responses:
        "200":
          description: The verdict, compatible or not
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareCompatibility"
        "400":
          description: >
            slavePosition is invalid, no `filename` was given, or it is not a SOMANET firmware
            package name
        "404":
          description: No device at that slavePosition
        "409":
          description: >
            The device is not a SOMANET drive, or its hardware description could not be read
  /api/devices/{slavePosition}/files/{filename}:
    get:
      summary: Read a file from a device via FoE (File over EtherCAT)
      operationId: foeReadFile
      description: >
        Sends an FoE read request for `filename` to the device at `slavePosition`
        and returns the raw file bytes.  FoE is available in Boot, Pre-Op, Safe-Op,
        and Op states (device-dependent); the caller is responsible for ensuring the
        device is in a suitable state before calling.  The call blocks until the full
        file has been received or a per-packet timeout of 700 ms is exceeded.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: FoE filename as recognised by the slave firmware
          example: "firmware.bin"
      responses:
        "200":
          description: Raw file bytes from the device
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    put:
      summary: Write a file to a device via FoE (File over EtherCAT)
      operationId: foeWriteFile
      description: >
        Sends an FoE write request for `filename` to the device at `slavePosition`,
        streaming the raw request body as the file contents.  FoE is available in
        Boot, Pre-Op, Safe-Op, and Op states (device-dependent); the caller is
        responsible for ensuring the device is in a suitable state before calling.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: FoE filename as recognised by the slave firmware
          example: "config.csv"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: File written successfully
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/{slavePosition}/sii:
    get:
      summary: Read a device's SII (Slave Information Interface / EEPROM)
      operationId: readSii
      description: >
        Reads the raw SII EEPROM image of the device at `slavePosition` through the
        ESC's EEPROM-control registers and returns either the parsed structure or the
        raw bytes, selected by the `Accept` request header.


        With `Accept: application/json` (or `*/*`, or no `Accept` header) the parsed
        `SlaveInformationInterface` is returned — the 128-byte fixed header plus the
        decoded category section (strings, general info, FMMU/Sync-Manager and PDO
        defaults, distributed-clock settings).  With `Accept: application/octet-stream`
        the raw EEPROM image is returned unparsed, suitable for a hex dump or archival.


        EEPROM access is a control-plane operation and is most reliable while the
        device is in INIT or PRE-OP.  String-index fields in the parsed structure
        (e.g. `general.nameIdx`) are 1-based references into `category.strings`.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum: [application/json, application/octet-stream]
            default: application/json
          description: >
            `application/octet-stream` returns the raw EEPROM bytes; anything else
            returns the parsed JSON structure.
      responses:
        "200":
          description: Parsed SII structure, or the raw EEPROM image
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaveInformationInterface"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: slavePosition is not a valid integer
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
    put:
      summary: Write a raw SII (EEPROM) image to a device
      operationId: writeSii
      description: >
        Writes the raw SII image in the request body to the device's EEPROM, one 16-bit
        word at a time. The image is parse-validated first and rejected if it is not a
        well-formed SII (a guard against bricking the device). **Destructive:** a wrong
        image can leave the device unidentifiable until re-flashed. The device adopts the
        new contents only after a **power cycle**, and the write is most reliable while
        the device is in INIT or PRE-OP. Intended for restoring a previously downloaded
        image.
      parameters:
        - name: slavePosition
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based position of the device on the fieldbus
          example: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: SII image written successfully
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: slavePosition is invalid, or the body is not a valid SII image
        "404":
          description: No device at the given bus position
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/sii/parse:
    post:
      summary: Parse a raw SII (EEPROM) image
      operationId: parseSii
      description: >
        Decodes a raw SII EEPROM image supplied in the request body and returns the
        parsed structure — the same decoder the device read path uses, exposed as a
        bus-independent utility. No device is involved; the Tools SII page uses this to
        view previously downloaded `.bin` files offline.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Parsed SII structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlaveInformationInterface"
        "400":
          description: The body is not a valid SII image (e.g. shorter than the 128-byte header)
  /api/firmware-package-name:
    get:
      summary: Decode a SOMANET firmware package filename
      operationId: getFirmwarePackageName
      description: >
        Breaks a firmware package filename into the five fields the SOMANET naming convention
        defines (Hardware description specification §3.4.2) —
        `package_<hardware>_<fullFirmwareDescriptor>_<software>_v<version>.zip` — and, where the
        descriptor is the numeric `<id>-<version>[-<key>[-<fieldbus>]]` kind, decodes it further.
        The specification allows a descriptor that is not (its own example `Branded-Drive-Elite`
        carries `MyProduct-v25-key3-ecat`), so those four fields are omitted rather than guessed.


        Bus-independent, like `/api/sii/parse` and `/api/esi/parse`, but a `GET` with a query
        because there is no file to upload — only a short string. This is the same decoder firmware
        installation uses to decide whether a package can be cached, so what it reports is what that
        will do.
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
          description: The package filename, with no directory part.
          example: package_SOMANET-Circulo-7_8500-04-2332_motion-drive_v5.6.10.zip
      responses:
        "200":
          description: The decoded fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePackageName"
        "400":
          description: >
            No `filename` was given, or it is not a SOMANET firmware package name. The `error`
            message names the part of the grammar it missed.
  /api/hardware-description/parse:
    post:
      summary: Parse a .hardware_description file
      operationId: parseHardwareDescription
      description: >
        Decodes a `.hardware_description` supplied in the request body. No device is involved — the
        same parse a device read uses, so a file saved from one device can be inspected with no
        hardware present.


        Three things fail a parse: content that is not JSON, content with no `device` object, and a
        device carrying no `id` or no `version`. Everything else is accepted as written. Those three
        required fields are exactly what a descriptor is built from, which is also what makes this a
        usable type check — arbitrary JSON is rejected rather than yielding an empty descriptor.


        The `fileVersion` major is reported but not enforced: a bump means "a new parser is needed",
        but refusing an unknown one would make a drive flashed with a future file unreadable today.
      requestBody:
        required: true
        description: >
          The file's text, sent as-is. `text/plain` rather than `application/json` because the body
          *is* the document — a JSON body would be the file re-encoded as a JSON string, which is
          then not a hardware description at all.
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: The decoded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareDescription"
        "400":
          description: The body is not a valid hardware description
  /api/integro-variant/parse:
    post:
      summary: Parse a .variant file
      operationId: parseIntegroVariant
      description: >
        Decodes a `.variant` file supplied in the request body. Binary rather than text, hence a
        `POST` with bytes like `/api/sii/parse` rather than a query like `/api/firmware-package-name`.


        Trailing bytes past the last option are accepted: the firmware reads only as many options as
        the count claims and ignores the rest, so refusing padding would reject a file the drive is
        happy with.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The decoded file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegroVariant"
        "400":
          description: >
            The body is not a valid variant file — too short for its 128-byte header, claiming more
            options than a drive accepts, or truncated mid-option
  /api/integro-variant/options:
    get:
      summary: The whole Integro variant option catalogue
      operationId: listIntegroVariantOptions
      description: >
        Every option an Integro can be licensed with, in code order. Static data: no device, no bus,
        no request body.


        Served so a client can explain a decoded file — or simply show what is available — without
        carrying a second copy of a table that belongs to the firmware. The codes ascend with real
        gaps, and the catalogue keeps codes current firmware no longer implements, because files
        written years ago still carry them.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegroVariantOption" }
  /api/esi/parse:
    post:
      summary: Parse an EtherCAT Slave Information (ESI) file
      operationId: parseEsi
      description: >
        Decodes a vendor's ESI XML supplied in the request body. No device is involved —
        the Tools page uses this to inspect an ESI with no hardware present, which is the
        only way to see object descriptions, enum option labels, engineering units and
        min/max bounds: the CoE SDO-Information service reports none of them.


        The response carries the vendor, every module, and **every device with its own
        assembled `entries` table** — one row per addressable `(index, subindex)`, merged
        from the device's own dictionary plus the dictionaries of the modules its slots
        reference, with each row recording in `source` where it came from.


        Object-level annotation (an object's description and raw properties) is attached to
        **subindex 0 only** — that row *is* the object — rather than repeated onto every
        subindex. A RECORD member still carries its own description on its own row; an
        ARRAY element carries none, because the ESI describes an array once rather than per
        element. To read an object's text for any subindex, look at subindex 0 of the same
        index.


        Where a slot offers mutually exclusive module variants the merge necessarily
        collides; it is resolved last-wins and reported in that device's `warnings`. Pass
        `modules` to model one concrete configuration instead.
      parameters:
        - name: modules
          in: query
          required: false
          description: >
            Comma-separated `ModuleIdent` values (hexadecimal or decimal) restricting the merge,
            applied to every device by intersection with the idents that device's slots actually
            reference. Omit to merge every module each device references.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        "200":
          description: The parsed ESI — every device with its assembled entry table
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsiParseResult"
        "400":
          description: The body is not a valid ESI file, or the `modules` query is malformed
  /api/devices/diagnostics:
    get:
      summary: Read live ESC health diagnostics for devices
      operationId: getDeviceDiagnostics
      description: >
        Reads live link-quality and watchdog diagnostics from each slave's EtherCAT Slave
        Controller (DL Status 0x0110, error-counter block 0x0300–0x0313, watchdog block
        0x0440–0x0443) via FPRD. Counters are 8-bit, saturate at 255, and are cleared only by a
        power cycle or explicit write — poll this endpoint and watch for a rising delta rather than
        an absolute value. The per-port counters localise a degrading link to a specific
        cable/connector; the watchdog counters distinguish a slave that stopped receiving process
        data from a master-side problem. Omit `positions` to query all discovered devices.
        Returns 500 for transports without an ESC (e.g. SPoE).
      parameters:
        - name: positions
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of 1-based slave positions to query (e.g. `1,2,3`).
            Omit to query all discovered devices.
          example: "1,2"
      responses:
        "200":
          description: Decoded ESC diagnostics for each queried device
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceDiagnostics"
        "400":
          description: A `positions` value is not a valid integer
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/dc-sync:
    get:
      summary: Read live distributed-clock synchronisation status for devices
      operationId: getDcSync
      description: >
        Reads each slave's distributed-clock unit live from its EtherCAT Slave Controller
        (system-time delay 0x0928 and system-time difference 0x092C) via FPRD. The reference clock
        is the first DC-capable slave; every other DC slave continuously corrects its local clock
        toward it, and `systemTimeDifference` is the live deviation in nanoseconds. The figure is
        meaningful only while the bus is exchanging process data in SAFE-OP/OP (the reference time
        is distributed in the cyclic frame) and converges toward zero as the slaves' drift loops
        settle — poll this endpoint and watch for a slave whose deviation stays large or grows
        rather than an absolute value. Non-DC slaves report `dcCapable` false with zeroed values.
        Omit `positions` to query all discovered devices. Returns 500 for transports without an ESC
        (e.g. SPoE).
      parameters:
        - name: positions
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of 1-based slave positions to query (e.g. `1,2,3`).
            Omit to query all discovered devices.
          example: "1,2"
      responses:
        "200":
          description: Decoded DC sync status for each queried device
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DcSyncStatus"
        "400":
          description: A `positions` value is not a valid integer
        "500":
          $ref: "#/components/responses/DriverErrorTimed"
  /api/devices/state:
    get:
      summary: Read current AL state for devices
      operationId: getDeviceStates
      description: >
        Reads the current EtherCAT Application Layer state for one or more devices.
        Omit the `positions` query parameter to query all discovered devices.
      parameters:
        - name: positions
          in: query
          required: false
          schema:
            type: string
          description: >
            Comma-separated list of 1-based slave positions to query (e.g. `1,2,3`).
            Omit to query all discovered devices.
          example: "1,2"
      responses:
        "200":
          description: AL state snapshot for each queried device
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [slavePosition, alStatus, alState, error, alStatusCode]
                  properties:
                    slavePosition:
                      type: integer
                      description: 1-based position on the fieldbus
                      example: 1
                    alStatus:
                      type: integer
                      description: >
                        Raw AL Status register value (ETG.1000.6 §6.4.1).
                        Bits 3:0 encode the state; bit 4 is the error indicator.
                      example: 17
                    alState:
                      type: integer
                      enum: [1, 2, 3, 4, 8]
                      description: >
                        Current AL state decoded from alStatus (ETG.1000.6 encoding):
                        1 = Init, 2 = PreOp, 3 = Boot, 4 = SafeOp, 8 = Op.
                      example: 1
                    error:
                      type: boolean
                      description: True when the AL Status error indicator bit (bit 4) is set
                      example: true
                    alStatusCode:
                      type: integer
                      description: >
                        AL Status Code register (ETG.1000.6 §6.4.1).
                        Non-zero when error is true; identifies the error cause
                        (e.g. 0x0014 = No valid firmware).
                      example: 20
        "400":
          description: A `positions` value is not a valid integer
        "500":
          $ref: "#/components/responses/DriverError"
    post:
      summary: Transition devices to an EtherCAT AL state
      operationId: transitionToState
      description: >
        Commands one or more devices to the requested EtherCAT Application Layer state
        and blocks until all targeted devices arrive or the timeout elapses. The settled
        state of every targeted device is then read back and returned in `devices`, each
        with a `reached` flag; `ok` is true only when every device reached the target.
        A device that did not reach it carries an `alStatusCode` explaining why.
        Omit `positions` or pass an empty array to target all discovered devices.
        State values are the standard AL state register encodings from ETG.1000.6:
        1 (Init), 2 (PreOp), 3 (Boot), 4 (SafeOp), 8 (Op).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                positions:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: >
                    1-based slave positions to target. Omit or pass an empty array
                    to target all discovered devices.
                  example: [1, 2]
                state:
                  type: integer
                  enum: [1, 2, 3, 4, 8]
                  description: >
                    Target EtherCAT AL state (ETG.1000.6 AL control register encoding):
                    1 = Init, 2 = PreOp, 3 = Boot, 4 = SafeOp, 8 = Op.
                  example: 8
                timeout:
                  type: integer
                  description: Maximum time to wait for all devices, in milliseconds
                  default: 5000
                  example: 5000
      responses:
        "200":
          description: >
            Transition command completed and the settled state of each targeted device
            was read back. `ok` is true only when every device reached the target state
            within the timeout; otherwise inspect `devices` to see which fell short and why.
          content:
            application/json:
              schema:
                type: object
                required: [ok, devices]
                properties:
                  ok:
                    type: boolean
                    description: True only when every targeted device reached the target state.
                    example: true
                  devices:
                    type: array
                    description: Settled state of each targeted device, in the order targeted.
                    items:
                      type: object
                      required: [slavePosition, alStatus, alState, error, alStatusCode, reached]
                      properties:
                        slavePosition:
                          type: integer
                          description: 1-based position on the fieldbus
                          example: 1
                        alStatus:
                          type: integer
                          description: >
                            Raw AL Status register value (ETG.1000.6 §6.4.1).
                            Bits 3:0 encode the state; bit 4 is the error indicator.
                          example: 2
                        alState:
                          type: integer
                          enum: [1, 2, 3, 4, 8]
                          description: >
                            Current AL state decoded from alStatus (ETG.1000.6 encoding):
                            1 = Init, 2 = PreOp, 3 = Boot, 4 = SafeOp, 8 = Op.
                          example: 2
                        error:
                          type: boolean
                          description: True when the AL Status error indicator bit (bit 4) is set
                          example: false
                        alStatusCode:
                          type: integer
                          description: >
                            AL Status Code register (ETG.1000.6 §6.4.1).
                            Non-zero when error is true; identifies the error cause
                            (e.g. 0x0014 = No valid firmware).
                          example: 0
                        reached:
                          type: boolean
                          description: >
                            True when this device reached the requested target state
                            (error clear and alState equal to the requested state).
                          example: true
        "400":
          description: Request body is malformed or `state` is not a valid AL state value
        "500":
          $ref: "#/components/responses/DriverError"
  /api/devices:
    get:
      summary: List all fieldbus devices
      operationId: getDevices
      responses:
        "200":
          description: Array of devices in bus order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [slavePosition, name, productName, vendorId, productCode, revisionNumber,
                     serialNumber, isCia402, parametersUnavailable]
                  properties:
                    slavePosition:
                      type: integer
                      description: 1-based position on the fieldbus
                      example: 1
                    name:
                      type: string
                      description: >
                        Human-readable device name from SII EEPROM. For SOMANET drives this is the
                        generic group name "SOMANET"; use productName to distinguish products.
                      example: "SOMANET"
                    productName:
                      type: string
                      description: >
                        Canonical product name, independent of the SII EEPROM. For a recognised
                        SOMANET product this distinguishes the product (e.g. "SOMANET Circulo");
                        otherwise it falls back to name.
                      example: "SOMANET Node"
                    vendorId:
                      type: integer
                      format: int64
                      description: Vendor ID from EEPROM
                      example: 131073
                    productCode:
                      type: integer
                      format: int64
                      description: Product code from EEPROM
                      example: 5570560
                    revisionNumber:
                      type: integer
                      format: int64
                      description: Revision number from EEPROM
                      example: 1
                    serialNumber:
                      type: integer
                      format: int64
                      description: Serial number from EEPROM
                      example: 12345
                    isCia402:
                      type: boolean
                      description: >
                        Whether the device implements the CiA402 drive profile (both controlword
                        0x6040 and statusword 0x6041 present in its object dictionary). Gates the
                        CiA402 motion-control endpoints under
                        /api/devices/{slavePosition}/cia402.
                      example: true
                    parametersUnavailable:
                      type: boolean
                      description: >
                        Whether an object-dictionary read for this device has failed since it was
                        scanned. The automatic read on reaching a mailbox-active state is attempted
                        once, so a device flagged here keeps an empty parameter list until
                        `POST /api/devices/{slavePosition}/parameters/init` is called; that clears
                        the flag on success.
                      example: false
  /api/process-image:
    get:
      summary: Inspect the published EtherCAT process image
      description: >-
        Returns the whole-bus process image: the byte sizes of each direction,
        the expected and last working counters and overall health, the number of
        retained image generations (one per re-map since the last reset), and
        every mapped object resolved to its absolute bit offset. While an image
        is live `configured` is true and the layout describes it. When no image
        is published (no device is in SAFE-OP/OP) but at least one generation has
        been mapped, `configured` is false and the layout describes the most
        recent retained generation — the last-known mapping — so a bus that has
        dropped out of SAFE-OP/OP stays inspectable; `lastWkc` then holds the
        final exchange value and working-counter health does not apply. The
        object lists are empty only before any image has ever been mapped. Object
        `name` is populated only for devices whose object dictionary has been
        enumerated.
      operationId: getProcessImage
      responses:
        "200":
          description: The published process image and its runtime health
          content:
            application/json:
              schema:
                type: object
                required:
                  [configured, outputBytes, inputBytes, expectedWkc, lastWkc, healthy,
                   shortWkcCycles, firstShortWkcUs, lastShortWkcUs, generations, outputs, inputs]
                properties:
                  configured:
                    type: boolean
                    description: Whether an image is currently published for exchange
                    example: true
                  outputBytes:
                    type: integer
                    description: Size of the output image (master→slave) in bytes
                    example: 12
                  inputBytes:
                    type: integer
                    description: Size of the input image (slave→master) in bytes
                    example: 16
                  expectedWkc:
                    type: integer
                    description: Working counter expected from the devices currently exchanging
                    example: 3
                  lastWkc:
                    type: integer
                    description: Working counter from the most recent exchange (0 before any)
                    example: 3
                  healthy:
                    type: boolean
                    description: Whether the last working counter meets the expected value
                    example: true
                  shortWkcCycles:
                    type: integer
                    format: int64
                    description: >
                      Cycles that answered with a working counter below the value expected at the
                      time, counted since `POST /api/init` and cleared only by `POST /api/reset`.
                      `healthy` is a sample of the most recent cycle and so cannot see a fault that
                      has already cleared; this count can.


                      It spans every re-map rather than resetting per image, because a re-map
                      happens whenever a device is brought into or out of SAFE-OP/OP — which is
                      exactly when someone is chasing a fault. `generations` says how many images
                      the count spans. Cycles missed while a device was being deliberately
                      commanded out of an exchange state are not counted: the expectation is
                      lowered before the transition is commanded.
                    example: 0
                  firstShortWkcUs:
                    type: integer
                    format: int64
                    description: Epoch microseconds of the first such cycle, 0 if there has been none
                    example: 0
                  lastShortWkcUs:
                    type: integer
                    format: int64
                    description: Epoch microseconds of the most recent such cycle, 0 if there has been none
                    example: 0
                  generations:
                    type: integer
                    description: Number of process images retained since the last reset
                    example: 1
                  outputs:
                    type: array
                    description: Output-mapped objects (RxPDO), in image order
                    items:
                      $ref: "#/components/schemas/ProcessImageObject"
                  inputs:
                    type: array
                    description: Input-mapped objects (TxPDO), in image order
                    items:
                      $ref: "#/components/schemas/ProcessImageObject"
  /api/game-loop:
    get:
      summary: Inspect real-time game-loop health
      description: >-
        Returns a point-in-time snapshot of the RT cyclic loop: the configured
        period and target rate, the cumulative achieved rate since start, the
        executed- and skipped-cycle counters, per-cycle task-execution timing
        (last / worst / mean), and whether real-time scheduling was acquired.
        Skipped cycles accumulate whenever the loop cannot meet its period
        (common on non-RT hosts such as Windows userspace) — a steadily rising
        `skippedCycles`, or an `achievedHz` well below `targetHz`, means the
        configured period is too aggressive for the hardware. Poll this endpoint
        and diff `executedCycles`/`skippedCycles` against `timestampUs` to chart
        the instantaneous rate over time.
      operationId: getGameLoop
      responses:
        "200":
          description: Real-time game-loop health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLoopHealth"
    put:
      summary: Change the real-time cycle period
      description: >-
        Retimes the running RT loop to a new cycle period, in microseconds. The
        change takes effect within one cycle and is transient — it is not written
        back to the config file, so a restart reverts to the configured
        `gameLoop.periodUs`. Intended for tuning on hosts that cannot sustain the
        configured rate: if `skippedCycles` climbs steadily (common on Windows
        userspace), raise the period (e.g. from 1000 to 2000 µs) until the loop
        meets its grid. Only the master cadence is retimed — the process-data
        recorder ring is not resized, and no drive-side watchdog is touched, so
        raising the period toward a drive's PDO/SM watchdog window can fault that
        drive. Applying a period starts a fresh health epoch: the cumulative
        counters (`executedCycles`, `skippedCycles`, the `achievedHz` average, and
        `maxExecNs`/`avgExecNs`) reset so the snapshot reflects only the new
        period — letting you see straight away whether the change improved the
        loop's health. Returns the updated health snapshot.
      operationId: setGameLoopPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodUs]
              properties:
                periodUs:
                  type: integer
                  format: int64
                  minimum: 1
                  description: New cycle period in microseconds. Must be greater than 0.
                  example: 2000
      responses:
        "200":
          description: Period applied; returns the updated health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameLoopHealth"
        "400":
          description: Invalid period (e.g. missing/zero `periodUs` or malformed body)
        "501":
          description: Game-loop control is not configured on this server
  /api/process-data/dump:
    get:
      summary: Stream the recorder ring as a binary .mmpd
      description: >-
        Streams the same `.mmpd` serialisation as the POST variant (the recorder's
        current span, with the process image embedded as a header) directly in the
        response body instead of writing a file — for the client SDK / browser,
        which parses the bytes offline. Request with `Accept:
        application/octet-stream`. Same span semantics as the POST; works in any
        state.
      operationId: streamProcessDataDump
      responses:
        "200":
          description: The .mmpd dump bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "409":
          description: >-
            Nothing to dump — no process image has ever been mapped, or the recorder
            is empty (no cycles recorded yet).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: Human-readable reason the dump could not be produced
    post:
      summary: Dump the recorder ring to a binary .mmpd file
      description: >-
        Serialises the process-data recorder's current span — every cycle from the
        oldest still in the ring up to the newest at the instant of the call — to a
        `.mmpd` file and returns its path. Each cycle's full raw input and output
        images, sequence, and epoch-nanosecond timestamp are written, with the
        process image (per-device identity and PDO object layout, including object
        names and data types where the object dictionary has been enumerated)
        embedded as a header, so the file decodes fully offline with no running
        Motion Master and no live bus. Works in any state: while devices are
        exchanging (SAFE-OP/OP) it captures tail→head at that moment and ignores
        cycles recorded afterwards; after the bus has left the exchange states it
        uses the most recent retained image layout. The file is written under the
        configured `recorder.dumpDir`, created if absent; by default that is a
        `dumps` subdirectory of the user-cache root, so the written file is also
        reachable through the `/api/user-cache` endpoints — list it, download it,
        or delete it there. Only the path is returned here. (Setting an explicit
        `recorder.dumpDir` outside the cache root opts out of that; the file is
        then only reachable from a shell on the server.)
      operationId: dumpProcessData
      responses:
        "200":
          description: The dump was written
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path:
                    type: string
                    description: Absolute path of the written .mmpd file
                    example: /tmp/motion-master/dump-20260610T141530Z-300123.mmpd
        "409":
          description: >-
            Nothing to dump — no process image has ever been mapped, or the recorder
            is empty (no cycles recorded yet) — or the file could not be written.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: Human-readable reason the dump could not be produced
                    example: "the recorder is empty — no cycles have been recorded yet"
  /api/process-data/outputs:
    post:
      summary: Stage a batch of output values into the process image
      operationId: stageProcessDataOutputs
      description: >
        Stages many output (RxPDO) objects at once — the "send all" action of the Process Data
        page. Each value is coerced to the object's declared data type and, when the object is
        output-mapped and its device is exchanging (SAFE-OP/OP), written into the output image so
        it is sent on the next real-time cycle and re-sent every cycle thereafter (set-once,
        sent-continuously). The batch is best-effort atomic: values are staged sequentially, so a
        batch can straddle two consecutive ~1 ms cycles. The request never fails as a whole — each
        object gets its own result, so the client can flag any object that was not cyclically
        staged (unknown device, coercion failure, object not output-mapped, or bus not exchanging;
        in the last two cases the value is still written via SDO/cache, just not cyclically driven).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: >
                Objects to stage, each as `[slavePosition, index, subindex, value]` — the
                monitoring `[devicePosition, index, subindex]` shape with the value appended.
              items:
                type: array
                minItems: 4
                maxItems: 4
                description: "[slavePosition, index, subindex, value]"
                items: {}
              example: [[1, 24698, 0, 5000], [1, 24640, 0, 15]]
      responses:
        "200":
          description: Per-object staging outcomes, in request order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutputStageResult"
        "400":
          description: >
            Invalid request — malformed body, an entry that is not a four-element array, a
            non-integer id, or an unsupported value type.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /api/bus-config:
    get:
      summary: Inspect each slave's static EtherCAT Slave Controller configuration
      description: >-
        Returns the static ESC configuration the master programmed into every
        slave during the last scan: station/alias addresses, mapped process-data
        sizes, the mailbox transport windows, the distributed-clock setup, and the
        configured Sync Managers and FMMUs. Read from cached state with no bus I/O
        and valid once the bus has been scanned. The list is empty before any scan,
        or when the active transport has no ESC (e.g. SPoE). Numeric fields (SM/FMMU
        type, mailbox protocol bits, SM flags) are raw register values; the client
        decodes them. `deviceName` is empty when no known device occupies the slave.
      operationId: getBusConfig
      responses:
        "200":
          description: Per-slave ESC configuration, in bus order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SlaveConfig"
  /api/monitorings:
    get:
      summary: List all monitorings
      operationId: listMonitorings
      description: >
        Returns every registered monitoring as a resource — its configuration plus, per
        parameter, how its value is sourced, and the current buffer fill.
      responses:
        "200":
          description: All monitorings, in topic order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Monitoring"
    post:
      summary: Create a monitoring
      operationId: createMonitoring
      description: >
        Registers a monitoring and starts sampling it off the real-time thread. Each parameter is
        classified once against the published process image: PDO-mapped objects are decoded from
        the live image; the rest are polled over SDO in the background. Create monitorings after
        the bus is operational so PDO objects are recognised as PDO. Monitoring is live-only — a
        parameter samples `null` while its owning device is not exchanging (SAFE-OP/OP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, interval, parameters]
              properties:
                topic:
                  type: string
                  pattern: "^[A-Za-z0-9._-]{1,64}$"
                  description: URL-safe unique id; also the WebSocket topic.
                  example: "left-leg"
                name:
                  type: string
                  description: Optional human-readable label.
                  example: "Left Leg"
                interval:
                  type: integer
                  minimum: 5
                  maximum: 2000
                  description: >
                    Flush cadence in milliseconds (5–2000). Not a sample rate: every recorded
                    cycle since the last flush is delivered, so a longer interval yields a larger
                    batch rather than fewer samples. 16 ms (~one batch per 60 Hz display frame) is
                    a good default for live plotting.
                  example: 16
                parameters:
                  type: array
                  minItems: 1
                  description: Objects to sample, each as `[devicePosition, index, subindex]`.
                  items:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items:
                      type: integer
                  example: [[1, 8240, 1], [1, 24676, 0]]
      responses:
        "201":
          description: Monitoring created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitoring"
        "400":
          description: >
            Invalid request — malformed body, non-URL-safe topic, interval outside
            5–2000 ms, empty parameters, or a parameter that is neither PDO-mapped nor in the
            device's object dictionary.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "409":
          description: A monitoring with this topic already exists
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /api/monitorings/{topic}:
    parameters:
      - name: topic
        in: path
        required: true
        schema:
          type: string
        description: The monitoring's topic.
    get:
      summary: Get a monitoring
      operationId: getMonitoring
      responses:
        "200":
          description: The monitoring resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitoring"
        "404":
          description: No monitoring with this topic
    delete:
      summary: Delete a monitoring
      operationId: deleteMonitoring
      description: >
        Stops sampling and releases the monitoring's SDO parameters from the shared refresher — an
        object no remaining monitoring needs stops being polled.
      responses:
        "204":
          description: Monitoring deleted
        "404":
          description: No monitoring with this topic
  /api/parameter-cache:
    get:
      summary: List on-disk parameter caches
      operationId: listParameterCacheEntries
      description: >
        Returns one entry per cached parameter-definition file on disk, keyed by device identity
        (vendor, product, revision). The cache stores only the object-dictionary *definitions* (not
        live values), so a scan of previously-seen hardware can skip the slow SDO enumeration.
        Independent of the bus — works whether or not a driver is initialised.
      responses:
        "200":
          description: The cache files currently on disk.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParameterCacheEntry"
  /api/parameter-cache/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Opaque cache id from listParameterCacheEntries ("<vendor>-<product>-<revision>").
    get:
      summary: Download a parameter-cache file
      operationId: getParameterCache
      description: >
        Returns the raw JSON cache file for the given id, verbatim, so it can be saved or inspected
        offline.
      responses:
        "200":
          description: The cache file (JSON).
          content:
            application/json:
              schema:
                type: object
        "404":
          description: No cache file with this id (or the id is malformed).
    delete:
      summary: Delete a parameter-cache file
      operationId: deleteParameterCache
      description: >
        Removes one cached file from disk. The next scan of that hardware re-enumerates it. Useful
        when a vendor reused a revision across an object-dictionary change.
      responses:
        "204":
          description: Cache file deleted.
        "404":
          description: No cache file with this id (or the id is malformed).
  /api/user-cache:
    get:
      summary: List the files in the user cache
      operationId: listUserCacheFiles
      description: >
        Returns every file in Motion Master's per-user cache directory, flattened: one entry per
        file with its full path relative to the cache root, whatever the nesting. Directories have
        no entries of their own. Independent of the bus — works whether or not a driver is
        initialised.


        The cache is a plain file store for data that should outlive a restart. The store itself
        neither validates nor interprets an upload — `PUT` accepts any bytes at any valid path, and
        putting a file here does not, on its own, make Motion Master do anything with it; the client
        chooses the paths.


        That is separate from whether a *feature* reads a given file, and several do: `parameters/`
        (the on-disk object-dictionary cache) and `dumps/` (`.mmpd` recorder dumps) are written and
        consumed by those features, with more to follow. Their files appear in this listing
        alongside everything else, so a client must not assume every entry was uploaded through this
        API, nor that deleting one is inconsequential.
      responses:
        "200":
          description: The cache root and its files.
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCacheListing"
        "500":
          description: The cache directory could not be listed.
  /api/user-cache/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: >
          Path relative to the cache root, e.g. `configs/machine-a.json`. May contain `/` to nest
          into subdirectories, which are created and removed implicitly. Percent-encoding is
          decoded, so a name with spaces or other reserved characters round-trips.


          Nothing may resolve outside the cache directory, so a component is rejected with 400 if
          it is `.` or `..`, is empty (a leading, trailing or doubled `/`), contains `:` or any
          control character (including `%00`), ends in a dot or a space, or is a Windows device
          name (`CON`, `NUL`, `COM1`, …, matched before the extension). The last three close
          spellings of `..` that survive an exact-match check: a `%00` is truncated back to `..` by
          the C string the OS path API takes, and Windows strips trailing dots and spaces before
          resolving. The same rules apply on every platform.
    get:
      summary: Download a user-cache file
      operationId: getUserCacheFile
      description: >
        Returns the file verbatim, always as `application/octet-stream` and always with
        `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` and a
        `default-src 'none'; sandbox` CSP. The bytes are whatever a user uploaded, served from the
        API's own origin, so a browser must never *render* them — a rendered upload would be stored
        XSS against the origin that controls the drives, which CORS cannot help with. No extension
        is trusted to name a content type, and the attachment carries no `filename` (the path is
        user-controlled and must not reach a response header). Clients read the bytes and name the
        saved file themselves.
      responses:
        "200":
          description: The file's contents.
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such file (or the path is invalid).
    put:
      summary: Upload a user-cache file
      operationId: putUserCacheFile
      description: >
        Writes the request body to the given path, creating parent directories as needed and
        replacing any existing file. The write is atomic — a concurrent reader sees either the old
        contents or the new one, never a partial file. The body is taken as raw bytes whatever its
        content type.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The file was written.
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
          content:
            application/json:
              schema:
                type: object
                required: [path, size]
                properties:
                  path:
                    type: string
                    description: The path written, relative to the cache root.
                    example: configs/machine-a.json
                  size:
                    type: integer
                    description: Bytes written.
                    example: 20480
        "400":
          description: The path is invalid, or the file could not be written.
    delete:
      summary: Delete a user-cache file or directory
      operationId: deleteUserCacheFile
      description: >
        Removes a file, or a directory and everything under it. Directories left empty between the
        removed path and the cache root are pruned, so no husks remain.


        A file the running server holds open is refused — see `deletable` on `UserCacheFile`.
      responses:
        "204":
          description: The file or directory was removed.
          headers:
            X-Wire-Us:
              $ref: "#/components/headers/WireTime"
        "400":
          description: The path is invalid, or the removal failed.
        "404":
          description: No such file or directory.
        "409":
          description: >
            The file is in use by the running server (`deletable` is false in the listing) — today
            only its own log file. It can be deleted once the server stops; rotated copies of it can
            be deleted now.
components:
  schemas:
    Cia402Status:
      type: object
      description: A CiA402 drive's control snapshot — its state machine, control words, and mode.
      required: [state, statusword, controlword, modeOfOperation, modeName, target]
      properties:
        state:
          type: string
          description: Decoded CiA402 state-machine state (from the statusword, 0x6041).
          enum:
            [NotReadyToSwitchOn, SwitchOnDisabled, ReadyToSwitchOn, SwitchedOn, OperationEnabled,
             QuickStopActive, FaultReactionActive, Fault]
          example: OperationEnabled
        statusword:
          type: integer
          description: Raw statusword (0x6041), 0–65535.
          example: 4663
        controlword:
          type: integer
          description: Last-commanded controlword (0x6040), 0–65535.
          example: 15
        modeOfOperation:
          type: integer
          description: Active operation mode (display object 0x6061), as an INTEGER8 value.
          example: 9
        modeName:
          type: string
          description: Human-readable name of the active operation mode.
          example: CyclicSyncVelocity
        target:
          type: integer
          description: >-
            The setpoint currently commanded for the active mode — target position 0x607A (PP/CSP),
            velocity 0x60FF (PV/CSV), or torque 0x6071 (PT/CST), widened to INTEGER32. 0 only when
            the active mode has no linear setpoint (NoMode / Homing / vl / ip).
          example: 100000
    OperationModes:
      type: object
      description: >-
        Every operation mode a device has, with what its "Supported drive modes" field (0x6502)
        says about each.
      required: [supportedDriveModes, manufacturerBits, modes]
      properties:
        supportedDriveModes:
          type: integer
          description: Object 0x6502 verbatim, as an UNSIGNED32.
          example: 197549
        manufacturerBits:
          type: array
          description: >-
            The set bits of 0x6502 from bit 16 upwards, reported as bit numbers and nothing more.
            The profile leaves their meaning entirely to the vendor, so nothing here can decode
            them — a SOMANET drive sets bits 16 and 17 and publishes no definition for either.
          items: { type: integer }
          example: [16, 17]
        modes:
          type: array
          description: Every mode, ascending by value — manufacturer modes first, then standard.
          items:
            $ref: "#/components/schemas/OperationMode"
    OperationMode:
      type: object
      description: One operation mode of one device.
      required: [value, name, label, kind, bit, abbreviation, supported]
      properties:
        value:
          type: integer
          description: The value written to 0x6060 / read from 0x6061. Negative for a vendor mode.
          example: -2
        name:
          type: string
          description: PascalCase identifier, matching the modeName of GET /api/devices/{n}/cia402.
          example: Diagnostics
        label:
          type: string
          description: The profile's or the vendor's own wording, for a user-facing list.
          example: Diagnostics mode
        kind:
          type: string
          description: Whether CiA402 or the vendor defines this mode.
          enum: [standard, manufacturer]
          example: manufacturer
        bit:
          type: integer
          nullable: true
          description: >-
            The bit of 0x6502 that advertises this mode. Null for every manufacturer mode, and for
            NoMode, which is always legal and so has no bit.
          example: 7
        abbreviation:
          type: string
          nullable: true
          description: The profile's short form (pp, vl, pv, tq, hm, ip, csp, csv, cst, cstca).
          example: csp
        supported:
          type: boolean
          nullable: true
          description: >-
            Whether the drive advertises this mode. Null for every manufacturer mode — 0x6502 has
            no bit a master could read for one — which means "the drive does not say", not "no".
          example: true
        deprecated:
          type: boolean
          description: Present and true only for a mode the vendor's firmware marks deprecated.
          example: true
    GameLoopHealth:
      type: object
      description: >-
        Point-in-time health of the real-time game loop. Times are nanoseconds;
        rates are hertz. All fields are diagnostic (relaxed reads), not
        synchronised.
      required:
        [periodUs, targetHz, achievedHz, executedCycles, skippedCycles,
         lastExecNs, maxExecNs, avgExecNs, schedFifo, memLocked, cpuAffinity,
         cpuPinned, timestampUs]
      properties:
        periodUs:
          type: integer
          format: int64
          description: Configured target cycle period, in microseconds
          example: 1000
        targetHz:
          type: number
          description: Target cycle rate (1e6 / periodUs), in hertz
          example: 1000.0
        achievedHz:
          type: number
          description: >-
            Cumulative average rate since the loop started (executedCycles /
            uptime), in hertz; 0 before the loop starts. Below targetHz means
            the host cannot sustain the configured period.
          example: 999.56
        executedCycles:
          type: integer
          format: int64
          description: Loop iterations actually executed since start
          example: 2023
        skippedCycles:
          type: integer
          format: int64
          description: >-
            Cycles skipped to catch up after overruns/stalls since start. A
            rising value means the loop is not meeting its period.
          example: 0
        lastExecNs:
          type: integer
          format: int64
          description: Task-execution time of the most recent cycle, in nanoseconds
          example: 104
        maxExecNs:
          type: integer
          format: int64
          description: Worst task-execution time since start, in nanoseconds
          example: 4009
        avgExecNs:
          type: integer
          format: int64
          description: Mean task-execution time since start, in nanoseconds
          example: 338
        schedFifo:
          type: boolean
          description: >-
            Whether SCHED_FIFO real-time priority was acquired (false on Windows,
            which never attempts it, and on Linux/macOS when the privilege is
            missing).
          example: false
        memLocked:
          type: boolean
          description: >-
            Whether mlockall succeeded to pin memory (Linux only; false elsewhere
            or when the privilege is missing).
          example: false
        cpuAffinity:
          type: integer
          description: >-
            Core the real-time thread was configured to pin to
            (gameLoop.cpuAffinity), or -1 when unpinned. Pointing this at an
            isolcpus core is what gives the RT thread a core to itself; only that
            thread is pinned, so the HTTP, WebSocket and monitoring threads stay
            on the remaining cores.
          example: -1
        cpuPinned:
          type: boolean
          description: >-
            Whether the pin took. Always false when cpuAffinity is -1 (nothing was
            asked for); false while cpuAffinity is >= 0 means the request failed
            and the thread is running unpinned.
          example: false
        timestampUs:
          type: integer
          format: int64
          description: Server wall-clock timestamp (epoch microseconds) when sampled
          example: 1783968687738680
    UserCacheListing:
      type: object
      description: The user cache's location on disk plus every file it holds.
      required: [root, files]
      properties:
        root:
          type: string
          description: >
            Absolute path of the cache directory on the server's filesystem. Platform-dependent
            (and overridable via the `userCache.directory` config key), so it is reported rather
            than assumed — show it to the user so they can find the files themselves.
          example: /home/user/.cache/motion-master
        files:
          type: array
          items:
            $ref: "#/components/schemas/UserCacheFile"
    UserCacheFile:
      type: object
      description: One file in the user cache.
      required: [path, size, modifiedMs, deletable]
      properties:
        path:
          type: string
          description: >
            Path relative to the cache root, always with `/` separators. Use it verbatim in the
            download/upload/delete endpoints.
          example: configs/machine-a.json
        size:
          type: integer
          description: File size in bytes.
          example: 20480
        modifiedMs:
          type: integer
          description: Last-write time, in milliseconds since the Unix epoch.
          example: 1783968687738
        deletable:
          type: boolean
          description: >
            Whether `DELETE` will accept this path. False for a file the running server holds open —
            today only its own log file, `logs/motion-master.log`. Deleting such a file cannot do
            what it appears to (Windows refuses; Linux and macOS unlink it while the server keeps
            writing to it, reclaiming nothing), so the request is refused with `409 Conflict` and a
            client should not offer the action. Rotated copies are closed and remain deletable,
            which is how the space is reclaimed.
          example: true
    ParameterCacheEntry:
      type: object
      description: Summary of one on-disk parameter-cache file (its identity, size, and count).
      required: [id, vendorId, productCode, revisionNumber, parameterCount, sizeBytes]
      properties:
        id:
          type: string
          description: >
            Opaque key addressing this cache file in the download/delete endpoints
            ("<vendor>-<product>-<revision>"). Use it verbatim — do not construct it client-side.
          example: "000022d2-00000201-0000000a"
        vendorId:
          type: integer
          description: EtherCAT vendor ID (0x22D2 = Synapticon).
          example: 8914
        productCode:
          type: integer
          description: Product code.
          example: 513
        revisionNumber:
          type: integer
          description: Revision number.
          example: 10
        parameterCount:
          type: integer
          description: Number of cached parameter definitions in the file.
          example: 312
        sizeBytes:
          type: integer
          description: File size on disk, in bytes.
          example: 48213
    ProcessDataWatchdog:
      type: object
      description: >
        A device's process-data (sync-manager) watchdog configuration, decoded from the watchdog
        divider (0x0400) and process-data watchdog time (0x0420) ESC registers.
      required: [slavePosition, enabled, running, timeoutNs, timeoutMs, divider, ticks]
      properties:
        slavePosition:
          type: integer
          description: 1-based position of the device on the fieldbus.
          example: 1
        enabled:
          type: boolean
          description: False when the time register (ticks) is 0, i.e. the watchdog is disabled.
          example: true
        running:
          type: boolean
          description: >
            Live status register (0x0440 bit 0): true = the watchdog is counting, false = expired
            or disabled. Meaningful only when enabled; it counts down only while process data flows.
          example: true
        timeoutNs:
          type: integer
          description: "Configured timeout in nanoseconds: ticks × 40 ns × (divider + 2)."
          example: 100000000
        timeoutMs:
          type: number
          description: The same timeout in milliseconds (convenience for display/editing).
          example: 100
        divider:
          type: integer
          description: Raw watchdog divider register (0x0400); shared with the PDI watchdog.
          example: 2498
        ticks:
          type: integer
          description: Raw process-data watchdog time register (0x0420), in watchdog ticks.
          example: 1000
    Monitoring:
      type: object
      description: A monitoring's configuration plus its per-parameter source classification.
      required: [topic, interval, parameters]
      properties:
        topic:
          type: string
          example: "left-leg"
        name:
          type: string
          description: Present only when a label was supplied at creation.
          example: "Left Leg"
        interval:
          type: integer
          description: Flush cadence in milliseconds (5–2000).
          example: 20
        parameters:
          type: array
          description: The sampled objects, in the positional order of each WebSocket sample row.
          items:
            type: object
            required: [devicePosition, index, subindex, source]
            properties:
              devicePosition:
                type: integer
                example: 1
              index:
                type: integer
                example: 24676
              subindex:
                type: integer
                example: 0
              source:
                type: string
                enum: [pdo, sdo]
                description: >
                  How the value is sourced — `pdo` (decoded from the live process image) or `sdo`
                  (polled in the background and read from cache).
                example: "pdo"
    PdoMappingRequestEntry:
      type: object
      required: [index, subindex, bitLength]
      description: One mapping entry to write. Packs to the 32-bit CoE word index<<16 | subindex<<8 | bitLength.
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 65535
          description: CoE object index; 0 marks an alignment-padding gap (no bound object)
          example: 24640
        subindex:
          type: integer
          minimum: 0
          maximum: 255
          description: CoE object subindex
          example: 0
        bitLength:
          type: integer
          minimum: 0
          maximum: 255
          description: Width of the entry in bits
          example: 16
    PdoMappingRequestObject:
      type: object
      required: [pdoIndex, entries]
      description: One PDO mapping object to write and its ordered entries.
      properties:
        pdoIndex:
          type: integer
          minimum: 0
          maximum: 65535
          description: Mapping-object index (0x16xx RxPDO for outputs, 0x1Axx TxPDO for inputs)
          example: 5632
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PdoMappingRequestEntry"
    PdoMappingRequest:
      type: object
      required: [outputs, inputs]
      description: >
        A device's desired PDO configuration to write. `outputs` are RxPDO objects (master→slave,
        assigned to 0x1C12); `inputs` are TxPDO objects (slave→master, assigned to 0x1C13). Vector
        order is the sync-manager assignment order. Both keys are required; an empty array clears
        that direction.
      properties:
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/PdoMappingRequestObject"
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/PdoMappingRequestObject"
    PdoMappingEntry:
      type: object
      required: [index, subindex, bitLength, bitOffset]
      description: One entry of a mapping object, as read back from the device.
      properties:
        index:
          type: integer
          description: CoE object index; 0 marks an alignment-padding gap
          example: 24640
        subindex:
          type: integer
          description: CoE object subindex
          example: 0
        bitLength:
          type: integer
          description: Width of the entry in bits
          example: 16
        bitOffset:
          type: integer
          description: Bit offset from the start of this direction's window (derived by the device)
          example: 0
    PdoMappingObject:
      type: object
      required: [pdoIndex, entries]
      description: One mapping object as read back, with its ordered entries (offsets included).
      properties:
        pdoIndex:
          type: integer
          description: Mapping-object index (0x16xx RxPDO for outputs, 0x1Axx TxPDO for inputs)
          example: 5632
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PdoMappingEntry"
    PdoMapping:
      type: object
      required: [outputs, inputs]
      description: >
        A device's PDO mapping grouped by mapping object — the read/write-back shape. `outputs` are
        RxPDO objects (0x1C12), `inputs` are TxPDO objects (0x1C13), each in sync-manager assignment
        order with its entries and derived bit offsets.
      properties:
        outputs:
          type: array
          description: RxPDO objects (master→slave), in assignment order
          items:
            $ref: "#/components/schemas/PdoMappingObject"
        inputs:
          type: array
          description: TxPDO objects (slave→master), in assignment order
          items:
            $ref: "#/components/schemas/PdoMappingObject"
    ProcessImageObject:
      type: object
      required: [slavePosition, index, subindex, name, bitOffset, bitLength]
      properties:
        slavePosition:
          type: integer
          description: 1-based bus position of the owning device
          example: 1
        index:
          type: integer
          description: CoE object index
          example: 24640
        subindex:
          type: integer
          description: CoE object subindex
          example: 0
        name:
          type: string
          description: >-
            Object name resolved from the device's parameter map; empty when the
            object dictionary has not been enumerated for that device
          example: "Target position"
        bitOffset:
          type: integer
          description: Absolute bit offset within the direction's image
          example: 32
        bitLength:
          type: integer
          description: Width of the value in bits
          example: 32
    ProgressStep:
      type: object
      description: >
        One step of a procedure. `id` is stable across runs, so a client keys its label and its
        value formatting off it. A step never reports cancellation: cancelling stops the procedure,
        leaving the step it was on `running` and the rest `idle`, which records how far it got.
      properties:
        id:
          type: string
          description: Stable identifier of the step within its procedure.
          example: command
        status:
          type: string
          enum: [idle, running, succeeded, failed]
          example: succeeded
        value:
          description: >
            What the step produced, if anything — shape is per procedure. Absent when the step
            produced nothing. For `os-command` it is an object with `status`, `data`, and
            `errorCode` when the drive sent one.
          example: { status: 1, data: [1, 2, 3, 4, 5, 6] }
        error:
          type: string
          description: Why the step failed. Absent unless it did.
      required: [id, status]
    ProcedureSnapshot:
      type: object
      description: >
        The complete state of a procedure on one device — an accumulating snapshot rather than an
        event, which is what makes polling lossless.
      properties:
        status:
          type: string
          enum: [idle, running, succeeded, failed, cancelled]
          description: >
            The one field a polling loop checks. `cancelled` is distinct from `failed` on purpose:
            "I stopped it" and "the drive could not do it" are different outcomes.
          example: succeeded
        runCount:
          type: integer
          description: >
            How many runs have been accepted on this device since the last scan or reset; a
            rejected start does not count. Doubles as a generation counter — with no run id, a
            changed `runCount` is how a poller can tell one run from the next.
          example: 3
        startedAt:
          type: integer
          format: int64
          description: Epoch milliseconds the run began. Absent when never run.
          example: 1735821000123
        finishedAt:
          type: integer
          format: int64
          description: Epoch milliseconds the run ended. Absent while running.
          example: 1735821042456
        steps:
          type: array
          items: { $ref: "#/components/schemas/ProgressStep" }
          description: The procedure's ordered steps, always the full template.
        error:
          type: string
          description: >
            Why the run failed when no step captured it — a failure belonging to no step, such as
            the device not being the kind the procedure needs. Absent otherwise.
      required: [status, runCount, steps]
    DeviceFile:
      type: object
      required: [name]
      description: One file stored on a device, as its file list reports it.
      properties:
        name:
          type: string
          description: Filename as FoE addresses it.
          example: hr_data0.bin
        byteCount:
          type: integer
          description: >
            Size the device reported. Absent when it reported the name without one — the size is
            what the listing claims, not what a read returned.
          example: 8032
    HrdRecording:
      type: object
      required: [data, files, byteCount, trailingBytes, sampleCount, columns, samples]
      description: >
        One high resolution data recording, read back from a drive's files and decoded.
      properties:
        data:
          type: string
          enum: [encoder-raw, system-identification]
          description: Which layout the files were decoded as — echoes the request.
          example: encoder-raw
        files:
          type: array
          items: { $ref: "#/components/schemas/DeviceFile" }
          description: >
            The files it was read from, in order. A recording that came back shorter than expected
            can be told from one that was never made by what is listed here.
        byteCount:
          type: integer
          description: Total bytes read across those files.
          example: 20000
        trailingBytes:
          type: integer
          description: >
            Bytes past the last whole sample. The drive allocates its files in fixed-size blocks, so
            this is the last block's padding rather than data that failed to decode.
          example: 0
        sampleCount:
          type: integer
          description: How many samples were decoded.
          example: 5000
        columns:
          type: array
          items: { type: string }
          description: >
            What each value of a row is, in order. For `encoder-raw`: `raw` (the 32-bit word the
            encoder reported), `masterCount` (its low 14 bits) and `noniusCount` (the next 14) — the
            raw word is kept because the firmware specification describes only bits 0-27 and says
            nothing about the top four. For `system-identification`: `velocityRpm` (converted out of
            the file's Q15 fixed point) and `torquePermil` (per mille of rated torque).
          example: [raw, masterCount, noniusCount]
        samples:
          type: array
          description: >
            One row per sample, positional in the order `columns` gives — a full recording is up to
            ten thousand rows, so the names travel once beside them rather than on every row.
          items:
            type: array
            items: { type: number }
          example: [[4661, 4661, 0], [4662, 4662, 0]]
    BrakeState:
      type: object
      description: >
        A drive's brake configuration and current state — the parts of object 0x2004 that decide what
        commanding the brake will actually do. Returned by every brake endpoint, so the outcome of a
        release or engage arrives in the same shape as a plain read.
      properties:
        status:
          type: string
          enum: [notConfigured, engaged, disengaged]
          description: >
            Brake state (0x2004:07). A brake is spring-engaged, so `engaged` is also its powered-off
            state.
          example: engaged
        releaseStrategy:
          type: string
          enum: [manualOutputVoltage, clutch, pin]
          description: >
            How the brake is driven (0x2004:04). `manualOutputVoltage` means the firmware does not
            drive it — the brake is a raw output voltage (0x2004:10) instead.
          example: clutch
        pullTimeMs:
          type: integer
          description: >
            How long the pull voltage is applied to release the brake (0x2004:03). The firmware blocks
            motion, and motion-related OS commands, until this expires.
          example: 120
        pullVoltageMv:
          type: integer
          description: Voltage that disengages the brake, in millivolts (0x2004:01).
          example: 24000
        holdVoltageMv:
          type: integer
          description: >
            Lower voltage that keeps it disengaged once released, in millivolts (0x2004:02).
          example: 12000
        softwareControllable:
          type: boolean
          description: >
            Whether commanding the brake does anything at all — false for `manualOutputVoltage`.
            Derived from the release strategy and served so a client need not encode that rule.
          example: true
        releaseMovesShaft:
          type: boolean
          description: >
            Whether releasing this brake turns the motor. True only for a pin brake, whose release
            raises current progressively to lift the load off the pin.
          example: false
      required:
        [status, releaseStrategy, pullTimeMs, pullVoltageMv, holdVoltageMv, softwareControllable,
         releaseMovesShaft]
    ProcedureDescriptor:
      type: object
      description: >
        What a procedure *is*, independent of any run — everything needed to render a control for it.
        The text is served rather than held per client, because the house rule that every action
        carries a description and its caveats means it has to exist somewhere, and duplicating it in
        each client is how it goes stale.
      properties:
        name:
          type: string
          description: >
            Identifier: the `procedureName` path segment, and the key its snapshot is retained under.
          example: os-command
        title:
          type: string
          description: Short human-readable name.
          example: OS command
        description:
          type: string
          description: What the procedure does.
        caveats:
          type: array
          items: { type: string }
          description: What a user must know before running it. May be empty.
        movesMotor:
          type: boolean
          description: True if running it can move the shaft.
          example: true
        requiresEnabled:
          type: boolean
          description: True if the drive must be enabled before it will run.
          example: false
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ProcedureParameter" }
          description: >
            What the request body may carry, in the order a client should present it. Empty for a
            procedure that takes none, which is most of them — a procedure's timings are properties
            of the command it issues rather than a caller's choice.
        steps:
          type: array
          items: { type: string }
          description: >
            The ordered step ids the procedure reports against — bare ids, because a template's
            per-step status is always idle and says nothing. Live status for the same ids is in the
            snapshot's `steps`.
          example: [command]
      required:
        [name, title, description, caveats, movesMotor, requiresEnabled, parameters, steps]
    ParameterOption:
      type: object
      description: One choice of an `enum` parameter.
      properties:
        value:
          description: What the request body carries when this option is chosen.
          example: 1
        title:
          type: string
          description: What the user picks.
          example: Encoder 1
      required: [value, title]
    ProcedureParameter:
      type: object
      description: >
        One named parameter a procedure accepts — enough to render a field for it and to know what
        to put in. Descriptive rather than authoritative: the server validates every request whatever
        a client sends, and this is what lets a client build a sensible form and catch a mistake
        before the request goes out. The three type-specific fields are absent where they do not
        apply.
      properties:
        name:
          type: string
          description: "The key in the request body."
          example: registerAddress
        title:
          type: string
          description: Short label.
          example: Register address
        description:
          type: string
          description: What it does and what a sensible value is.
        type:
          type: string
          enum: [integer, boolean, enum, byteArray, string, stringArray, file]
          description: >
            Which kind of control to render. `file` carries a whole file as a base64 string, so a
            client renders a file picker and encodes what it reads; `stringArray` is an editable
            list of free-text values.
          example: integer
        required:
          type: boolean
          description: >
            Whether a request must carry it — true exactly when there is no `defaultValue`. Reported
            rather than left to be derived, so a client need not know the rule.
          example: true
        defaultValue:
          description: What an omitting request gets. Absent when the parameter is required.
          example: 1
        minValue:
          type: integer
          description: "`integer` only: smallest accepted value."
          example: 0
        maxValue:
          type: integer
          description: "`integer` only: largest accepted value."
          example: 255
        length:
          type: integer
          description: "`byteArray` only: the exact number of bytes."
          example: 8
        options:
          type: array
          items: { $ref: "#/components/schemas/ParameterOption" }
          description: "`enum` only: the values that may be chosen."
      required: [name, title, description, type, required]
    FirmwarePackageName:
      type: object
      description: >
        A SOMANET firmware package filename broken into its fields. The four decoded-descriptor
        properties are absent — not null — when the full firmware descriptor is not the numeric
        kind, which the naming specification explicitly allows.
      required:
        [
          description,
          hardwareName,
          fullFirmwareDescriptor,
          softwareName,
          softwareVersion,
        ]
      properties:
        description:
          type: string
          description: The format description; always `package` for a firmware bundle.
          example: package
        hardwareName:
          type: string
          description: Human-readable hardware name.
          example: SOMANET-Circulo-7
        fullFirmwareDescriptor:
          type: string
          description: >
            The hardware this package is built for, verbatim — the string a compatibility check
            compares.
          example: 8500-04-2332
        softwareName:
          type: string
          description: Firmware or software name.
          example: motion-drive
        softwareVersion:
          type: string
          description: >
            The firmware or software version, including the leading `v`. Not to be confused with
            `firmwareVersion`, which is the *hardware* revision inside the descriptor.
          example: v5.6.10
        firmwareId:
          type: string
          description: Firmware id from the descriptor — the hardware product.
          example: "8500"
        firmwareVersion:
          type: string
          description: >
            Hardware revision from the descriptor. A string, so a leading zero survives: `04`
            read as a number and printed back would be `4`, and `8500-4` matches no package.
          example: "04"
        keyId:
          type: string
          description: >
            Firmware encryption key id from the descriptor. A string because real packages carry
            non-numeric ones, e.g. `A`.
          example: "2332"
        fieldbusProtocol:
          type: string
          description: >
            Fieldbus protocol character from the descriptor, hexadecimal. `1` is EtherCAT.
          example: "1"
        buildDescriptor:
          type: string
          description: >
            `firmwareId` and `firmwareVersion` joined — the descriptor without the key or fieldbus.
            Useful for saying *how* a package missed: a matching build descriptor with a different
            key means right hardware, wrong encryption key.
          example: 8500-04
    HardwareComponent:
      type: object
      description: >
        One item making up a device or assembly. Carries no function beyond recording what has a
        serial number, so every property can legitimately be empty.
      required: [name, version, serialNumber]
      properties:
        name:
          type: string
          example: Com EtherCAT
        version:
          type: string
          example: A.2
        serialNumber:
          type: string
          example: "1000-02-0005739-1815"
    HardwareProduct:
      type: object
      description: >
        A device or an assembly. The two are one shape — the specification lists their fields in a
        single table and they differ only in that `keyId` and `macAddress` are device-only.
      required:
        [
          name,
          imageId,
          id,
          version,
          keyId,
          serialNumber,
          macAddress,
          components,
          buildDescriptor,
        ]
      properties:
        name:
          type: string
          description: Human-readable description of the hardware.
          example: SOMANET Servo Node 400 EtherCAT
        imageId:
          type: string
          description: Names the product's picture. Empty when the file carries none.
          example: 9501-xx
        id:
          type: string
          description: The `firmwareId` — identifies the hardware product.
          example: "9501"
        version:
          type: string
          description: The `firmwareVersion` — revision of that product.
          example: "01"
        keyId:
          type: string
          description: >
            Firmware encryption key burned to OTP memory. Device only, and empty on hardware whose
            firmware predates encryption.
          example: "4622"
        serialNumber:
          type: string
          example: "9501-01-040595-4023"
        macAddress:
          type: string
          description: MAC address of the Ethernet port. Device only.
          example: "01-23-45-67-89-AB"
        components:
          type: array
          items: { $ref: "#/components/schemas/HardwareComponent" }
        buildDescriptor:
          type: string
          description: "`id` and `version` joined by a dash."
          example: 9501-01
    HardwareDescription:
      type: object
      description: >
        A device's `.hardware_description` file — what the hardware says it is, and the source of
        the descriptor that decides which firmware belongs on it.


        `device` is never absent, and that is structural rather than a simplification: the file
        lives *on* the device, so a file without one cannot exist. `assembly` is present only when
        the device was packaged into a product — an ACTILINK is an assembly with a SOMANET Node
        device inside it — and when it is, it is what firmware is matched against first.
      required: [fileVersion, device]
      properties:
        fileVersion:
          type: string
          description: Format version of the file itself, semver.
          example: 1.2.0
        device:
          $ref: "#/components/schemas/HardwareProduct"
        assembly:
          $ref: "#/components/schemas/HardwareProduct"
    IntegroVariantOption:
      type: object
      description: >
        One entry of the Integro runtime-variant option catalogue. Nothing on the server acts on
        `socVariables` or `incompatibleOptionIds` — the drive enforces them — but they are what make
        a decoded file legible.
      required:
        [id, category, meaning, socVariables, incompatibleOptionIds, mpnSegmentCodes]
      properties:
        id:
          type: integer
          description: The option code as it appears in the file.
          example: 1
        category:
          type: string
          description: What the option selects.
          example: Fieldbus Protocol
        meaning:
          type: string
          description: Which choice within that category.
          example: EtherCAT
        socVariables:
          type: array
          description: >
            The drive's own configuration values this option sets. Empty for an option the fieldbus
            firmware acts on rather than the SoC.
          items: { type: string }
          example: [adc_phase_current_sensor_gain]
        incompatibleOptionIds:
          type: array
          description: >
            Options that cannot be selected alongside this one — the other members of a category
            that selects exactly one choice. Empty for an independent flag such as "disable DI1".
          items: { type: integer }
          example: [0, 2, 3, 39]
        mpnSegmentCodes:
          type: array
          description: >
            Segments of the part number this option corresponds to. Empty for an option not
            distinguished in the part number.
          items: { type: string }
          example: [EC]
    IntegroVariantFileOption:
      type: object
      description: >
        One option code from a decoded file, expanded into its catalogue entry. Everything but `id`
        is absent for a code the catalogue does not name, so "we do not know what this is" is
        missing properties rather than the string `unknown`.
      required: [id]
      allOf: [{ $ref: "#/components/schemas/IntegroVariantOption" }]
    IntegroVariant:
      type: object
      description: >
        A decoded `.variant` file: which features a SOMANET Integro was licensed with.


        Only Integro drives carry one. Its layout comes from the firmware that reads it rather than
        from a specification — there is none — and the one thing on it that matters beyond
        inspection is `fieldbusProtocol`, which the hardware description deliberately does not
        carry and a full firmware descriptor ends with.
      required:
        [
          fileVersion,
          signature,
          chipId,
          serialNumber,
          macAddress,
          customerId,
          operationMode,
          operationModeName,
          options,
        ]
      properties:
        fileVersion:
          type: integer
          description: Format version; 1 in every file seen so far.
          example: 1
        signature:
          type: string
          description: >
            Lowercase hex. Opaque — verification needs the private key and happens on the drive —
            and reported only so a caller can see whether one is present.
        chipId:
          type: string
          description: Lowercase hex netX chip id this file was issued for.
          example: 4e64646c70b286a000000000
        serialNumber:
          type: string
          example: 9004-02-0000424-2445
        macAddress:
          type: string
          example: 40:49:8A:01:21:D6
        customerId:
          type: integer
          description: Who the device was licensed to.
          example: 1
        operationMode:
          type: integer
          description: >
            Raw mode value. `passive` (0x51) is the failure state as much as a mode: firmware falls
            back to it when the file is missing, its signature does not verify, or its chip id
            belongs to another device.
          example: 87
        operationModeName:
          type: string
          enum: [passive, trial, production, live, unknown]
          example: live
        fieldbusProtocol:
          type: integer
          description: >
            The fieldbus the device is licensed for, for the tail of a full firmware descriptor.
            **EtherCAT wins when several are selected** — real files do carry more than one.
            Absent when the file selects no fieldbus at all.
          example: 1
        options:
          type: array
          description: >
            The option codes, in the order the file lists them — which is not sorted, and is the
            only record of how the file was written.
          items: { $ref: "#/components/schemas/IntegroVariantFileOption" }
    FullFirmwareDescriptors:
      type: object
      description: >
        The full firmware descriptors one device accepts firmware under. Two rather than one because
        the specification says both are compatible and lists both for the user to choose from: the
        assembly's firmware "should have been customized for the assembly", so it is the one to
        prefer, while the device package is the generic build for the hardware inside it.
      required: [device]
      properties:
        device:
          type: string
          description: The device's own descriptor. Always present.
          example: 9010-02-2423-1
        assembly:
          type: string
          description: >
            The assembly's build descriptor with the **device's** key id — assemblies have no key of
            their own. Absent when the hardware description carries no assembly.
          example: 6000-01-2423-1
    FirmwareCompatibility:
      type: object
      description: >
        Whether one firmware package belongs on one device.


        **The whole descriptor string is compared, never its decoded parts.** That is what makes the
        check correct for descriptors outside the numeric convention, and it is how the
        specification frames the operation — find compatible firmware by searching for the
        `fullFirmwareDescriptor` string.
      required: [compatible, match, packageName, deviceDescriptors, explanation]
      properties:
        compatible:
          type: boolean
          example: true
        match:
          type: string
          enum: [none, assembly, device]
          description: >
            Which of the device's descriptors matched. `device` is a match that still has something
            to say: it is the generic build rather than the one customised for the assembly.
          example: assembly
        packageName:
          $ref: "#/components/schemas/FirmwarePackageName"
        deviceDescriptors:
          $ref: "#/components/schemas/FullFirmwareDescriptors"
        explanation:
          type: string
          description: >
            One sentence naming the descriptors involved, ready to show a user. Populated for a
            match as well as a mismatch.
          example: This package is built for 6000-01-2423-1, which is this device's assembly.
    ProcedureListing:
      type: object
      description: >
        One procedure paired with how its last run on this device went — an entry of
        `GET /api/devices/{slavePosition}/procedures`. The pairing is what lets a page render in a
        single request instead of one per procedure.
      properties:
        descriptor: { $ref: "#/components/schemas/ProcedureDescriptor" }
        snapshot: { $ref: "#/components/schemas/ProcedureSnapshot" }
      required: [descriptor, snapshot]
    ProcedureRequest:
      type: object
      additionalProperties: true
      description: >
        A procedure's parameters. Which fields apply is per procedure, and each descriptor reports
        its own in `parameters` — so this schema is open, and a procedure that takes none may be
        started with no body at all. The properties below are the union of every procedure's, each
        naming the procedure it belongs to.
      properties:
        command:
          type: array
          minItems: 8
          maxItems: 8
          items: { type: integer, minimum: 0, maximum: 255 }
          description: >
            `os-command` only, and required for it: the eight request bytes. Byte 0 is the OS command
            ID; bytes 1-7 are that command's parameters.
          example: [8, 0, 0, 0, 0, 0, 0, 0]
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 600000
          default: 1000
          description: >
            Ceiling on the whole command. Not a liveness check — the drive fails a command no service
            acknowledges within 5 s on its own — so size it for the command being run. Hitting it
            aborts the command on the drive.
          example: 30000
        pollIntervalMs:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
          description: >
            `os-command` only: how often the server reads the drive's response object while waiting.
        encoder:
          type: integer
          enum: [1, 2]
          default: 1
          description: >
            `encoder-register-communication` and `ic-mu-calibration-mode`: which of the drive's
            encoders to address. Encoder 1 is the encoder configured in 0x2110 and encoder 2 the one
            configured in 0x2112, so the ordinal picks a configuration object rather than a kind of
            encoder.
          example: 1
        write:
          type: boolean
          default: false
          description: >
            `encoder-register-communication` only: false reads the register, true writes `value`
            into it. Either way the drive reports what the register holds afterwards.
        registerAddress:
          type: integer
          minimum: 0
          maximum: 255
          description: >
            `encoder-register-communication` only, and required for it: the register to access. The
            map belongs to the encoder chip rather than to the drive's firmware.
          example: 117
        value:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
          description: >
            `encoder-register-communication` only: the byte to write into the register. Ignored when
            reading.
          example: 7
        data:
          type: string
          enum: [encoder-raw, system-identification]
          description: >
            `hrd-streaming` only, and required for it: which signal to record. Also decides how the
            recording decodes when it is read back from `/api/devices/{slavePosition}/hrd`.
          example: encoder-raw
        durationMs:
          type: integer
          minimum: 1
          maximum: 10000
          description: >
            `hrd-streaming` only, and required for it: how long to record. One sample is written
            every millisecond into at most five 8032-byte files, so the real ceiling depends on the
            sample size — 10000 ms for `encoder-raw`, but only 6000 ms for `system-identification`.
            The drive applies both limits; the narrower one is checked here too, so an over-long
            request is rejected before a run starts rather than failing on its first step.
          example: 5000
        mode:
          type: string
          enum: [configuration, raw, standard]
          description: >
            `ic-mu-calibration-mode` only, and required for it: how the BiSS service should clock the
            encoder. `standard` is normal operation; `configuration` keeps the encoder clocked but
            uses only the register-communication bits, so position stops updating and no CRC fault is
            raised; `raw` clocks an encoder already configured for raw output and averages that data
            into 0x2704. There is no default — the mode is the instruction.
          example: configuration
        group:
          type: string
          enum: [all, communication, application, manufacturer]
          default: all
          description: >
            `restore-default-parameters` only: which group of defaults to restore — all
            (0x1011:01), communication (0x1011:02), application (0x1011:03), or manufacturer
            (0x1011:04).
          example: all
        packageContent:
          type: string
          description: >
            `firmware-installation`: the .zip firmware package, base64-encoded into this JSON
            string. One of this or a `packageFilename` naming an already-cached package must be
            present; this wins when both are given. To avoid base64 entirely, `PUT` the raw bytes to
            `/api/user-cache/firmwares/<name>.zip` first and then send only `packageFilename` — the
            firmware cache is that directory.
            (Deliberately not `format: byte`: that is the correct OpenAPI spelling for base64, but
            generators map it to a binary type — `Blob` in TypeScript — which is not what goes on
            the wire here and would serialise to `{}`.)
        packageFilename:
          type: string
          description: >
            `firmware-installation`: the package's filename. Optional — it names the package for
            caching and identifies a cached one to re-install without uploading it again. A name
            outside the SOMANET convention still installs, it is just not cached.
          example: package_SOMANET-Circulo-7_8500-04-2332_motion-drive_v5.6.10.zip
        skipFiles:
          type: array
          items: { type: string }
          default: ["SOMANET_CiA_402.xml.zip", "stack_image.svg.zip"]
          description: >
            `firmware-installation`: entries inside the package that are not written to the device.
            An explicit list replaces the defaults wholesale rather than adding to them, so `[]`
            means "write everything the package holds". Any entry can be named, including the SII
            and the firmware binaries.
        cachePackage:
          type: boolean
          default: true
          description: >
            `firmware-installation`: keep a copy of the package on the server so it can be
            re-installed without uploading it again. Only possible when a filename is given and it
            follows the SOMANET package naming convention.
        finalState:
          type: integer
          enum: [1, 2, 3, 4, 8]
          default: 2
          description: >
            `firmware-installation`: where the device is left, as an AL state number — the same
            ETG.1000.6 encoding `POST /api/devices/state` takes and `alState` reports, so a client
            holds one way to name a state rather than two. `2` (PRE-OP) is the default and the
            confirmation that the install worked: the bootloader hands over to the newly written
            firmware on that transition, so reaching PRE-OP means the new firmware booted. No power
            cycle is needed for the firmware (an SII written from the package does need one — the
            ESC reads its EEPROM at reset). Choose `3` (BOOT) when no application will be present,
            after erasing one or between two installs, since a PRE-OP transition then has nothing to
            hand over to and the drive answers AL status `0x0014`, "No valid firmware". `4` and `8`
            climb through PRE-OP and re-map the whole bus on the way, briefly pausing every other
            device. The state the device was in beforehand is not restored.
          example: 2
    OutputStageResult:
      type: object
      required: [slavePosition, index, subindex, staged, error]
      properties:
        slavePosition:
          type: integer
          description: 1-based bus position of the owning device (echoes the request)
          example: 1
        index:
          type: integer
          description: CoE object index (echoes the request)
          example: 24698
        subindex:
          type: integer
          description: CoE object subindex (echoes the request)
          example: 0
        staged:
          type: boolean
          description: >-
            True when the value landed in the published output image and will be sent on the next
            exchange cycle
          example: true
        error:
          type: string
          description: >-
            Empty on success; otherwise why the object was not cyclically staged (unknown device,
            coercion failure, object not output-mapped, or the bus not exchanging)
          example: ""
    SyncManagerConfig:
      type: object
      required: [index, physicalStart, length, flags, type]
      properties:
        index:
          type: integer
          description: Sync Manager number (0–7)
          example: 2
        physicalStart:
          type: integer
          description: Physical ESC memory start address the SM guards
          example: 4352
        length:
          type: integer
          description: Length of the guarded window in bytes
          example: 12
        flags:
          type: integer
          description: >-
            Raw SM control/flags register (buffer mode, direction, watchdog,
            enable) — decoded by the client
          example: 100100
        type:
          type: integer
          description: "0 unused, 1 MbxOut, 2 MbxIn, 3 Outputs, 4 Inputs"
          example: 3
    FmmuConfig:
      type: object
      required:
        [index, logicalStart, length, logicalStartBit, logicalEndBit,
         physicalStart, physicalStartBit, type, active]
      properties:
        index:
          type: integer
          description: FMMU number (0–3)
          example: 0
        logicalStart:
          type: integer
          description: Logical (bus-wide) start address
          example: 0
        length:
          type: integer
          description: Mapped length in bytes
          example: 12
        logicalStartBit:
          type: integer
          description: Start bit within the first logical byte
          example: 0
        logicalEndBit:
          type: integer
          description: End bit within the last logical byte
          example: 7
        physicalStart:
          type: integer
          description: Physical ESC start address (ties the FMMU to a Sync Manager)
          example: 4352
        physicalStartBit:
          type: integer
          description: Start bit within the first physical byte
          example: 0
        type:
          type: integer
          description: "ESC FMMU type: 1 read (inputs/TxPDO), 2 write (outputs/RxPDO)"
          example: 2
        active:
          type: boolean
          description: Whether the FMMU is active
          example: true
    SlaveConfig:
      type: object
      required:
        [slavePosition, deviceName, productName, vendorId, productCode, revisionNumber,
         serialNumber, configuredAddress, aliasAddress, outputBits, inputBits, mailbox, dc,
         syncManagers, fmmus]
      properties:
        slavePosition:
          type: integer
          description: 1-based bus position
          example: 1
        deviceName:
          type: string
          description: >
            SII device name for this slave position, empty if unknown. For SOMANET drives this is
            the generic group name "SOMANET"; use productName to distinguish products.
          example: "SOMANET"
        productName:
          type: string
          description: >
            Canonical product name, empty if unknown. For a recognised SOMANET product this
            distinguishes the product (e.g. "SOMANET Circulo"); otherwise it falls back to
            deviceName.
          example: "SOMANET Node"
        vendorId:
          type: integer
          format: int64
          description: Vendor ID from EEPROM (0 if the slave is unknown)
          example: 8914
        productCode:
          type: integer
          format: int64
          description: Product code from EEPROM
          example: 769
        revisionNumber:
          type: integer
          format: int64
          description: Revision number from EEPROM
          example: 285212675
        serialNumber:
          type: integer
          format: int64
          description: Serial number from EEPROM
          example: 0
        configuredAddress:
          type: integer
          description: Station (configured) address assigned during scan
          example: 4097
        aliasAddress:
          type: integer
          description: Configured station alias from EEPROM
          example: 0
        outputBits:
          type: integer
          description: Mapped output (master→slave) bits
          example: 96
        inputBits:
          type: integer
          description: Mapped input (slave→master) bits
          example: 128
        mailbox:
          type: object
          required:
            [writeLength, writeOffset, readLength, readOffset, protocols, coeDetails,
             foeDetails, eoeDetails, soeDetails]
          properties:
            writeLength:
              type: integer
              description: Write (master→slave) mailbox length in bytes; 0 if none
              example: 128
            writeOffset:
              type: integer
              description: Write mailbox physical ESC offset
              example: 4096
            readLength:
              type: integer
              description: Read (slave→master) mailbox length in bytes
              example: 128
            readOffset:
              type: integer
              description: Read mailbox physical ESC offset
              example: 4224
            protocols:
              type: integer
              description: >-
                Supported-protocol bits (0x01 AoE, 0x02 EoE, 0x04 CoE, 0x08 FoE,
                0x10 SoE, 0x20 VoE) — decoded by the client
              example: 14
            coeDetails:
              type: integer
              description: >-
                CoE detail bits, advertised in EEPROM — decoded by the client (0x01 SDO,
                0x02 SDO-Info, 0x04 PDO-Assign, 0x08 PDO-Config, 0x10 Upload, 0x20 Complete-Access).
                A hint, not a guarantee.
              example: 15
            foeDetails:
              type: integer
              description: FoE detail byte (bit 0 = enabled).
              example: 1
            eoeDetails:
              type: integer
              description: EoE detail byte (bit 0 = enabled).
              example: 0
            soeDetails:
              type: integer
              description: SoE detail byte / channel count.
              example: 0
        dc:
          type: object
          required: [capable, active, propagationDelay, cycleTime, shift]
          properties:
            capable:
              type: boolean
              description: Slave has distributed-clock hardware
              example: true
            active:
              type: boolean
              description: SYNC0 generation enabled (false for SM-synchronous bring-up)
              example: false
            propagationDelay:
              type: integer
              description: Measured propagation delay in nanoseconds
              example: 300
            cycleTime:
              type: integer
              description: DC cycle time in nanoseconds
              example: 0
            shift:
              type: integer
              description: Shift from the cycle-modulus boundary in nanoseconds
              example: 0
        syncManagers:
          type: array
          description: Configured Sync Managers, by index
          items:
            $ref: "#/components/schemas/SyncManagerConfig"
        fmmus:
          type: array
          description: Configured FMMUs, by index
          items:
            $ref: "#/components/schemas/FmmuConfig"
    PortDiagnostics:
      type: object
      required:
        [linkUp, loopClosed, communication, invalidFrame, rxError, forwardedError, lostLink]
      properties:
        linkUp:
          type: boolean
          description: Physical link detected on this port (DL Status link bit)
          example: true
        loopClosed:
          type: boolean
          description: Loop closed on this port (no downstream slave, or port disabled)
          example: false
        communication:
          type: boolean
          description: Stable communication established on this port
          example: true
        invalidFrame:
          type: integer
          description: >-
            Invalid-frame counter (0x0300+): frames with a bad FCS/structure. 8-bit, saturates
            at 255; watch for a rising delta rather than the absolute value
          example: 0
        rxError:
          type: integer
          description: "Physical-layer RX error counter (0x0301+): RX_ER asserted by the PHY"
          example: 0
        forwardedError:
          type: integer
          description: >-
            Forwarded RX error counter (0x0308+): errors first flagged by an upstream ESC —
            pinpoints the segment where corruption began
          example: 0
        lostLink:
          type: integer
          description: "Lost-link counter (0x0310+): link-down events on this port"
          example: 0
    DeviceDiagnostics:
      type: object
      required:
        [slavePosition, deviceName, ports, processingUnitError, pdiError,
         processDataWatchdog, pdiWatchdog]
      properties:
        slavePosition:
          type: integer
          description: 1-based position on the fieldbus
          example: 1
        deviceName:
          type: string
          description: Device name for this slave position, empty if unknown
          example: "SOMANET Node"
        ports:
          type: array
          description: Per-port link state and error counters (ports 0–3, in order)
          items:
            $ref: "#/components/schemas/PortDiagnostics"
        processingUnitError:
          type: integer
          description: "ECAT processing-unit error counter (0x030C): datagrams reaching the unit malformed"
          example: 0
        pdiError:
          type: integer
          description: "PDI error counter (0x030D): problems on the slave-local process-data interface"
          example: 0
        processDataWatchdog:
          type: integer
          description: >-
            Process-data (SM) watchdog expirations (0x0442): the slave stopped seeing fresh outputs
          example: 0
        pdiWatchdog:
          type: integer
          description: "PDI watchdog expirations (0x0443)"
          example: 0
    DcSyncStatus:
      type: object
      required:
        [slavePosition, deviceName, dcCapable, referenceClock, propagationDelay,
         systemTimeDifference]
      properties:
        slavePosition:
          type: integer
          description: 1-based position on the fieldbus
          example: 1
        deviceName:
          type: string
          description: Device name for this slave position, empty if unknown
          example: "SOMANET Node"
        dcCapable:
          type: boolean
          description: Slave has distributed-clock hardware
          example: true
        referenceClock:
          type: boolean
          description: >-
            This slave is the DC reference clock (the first DC-capable slave) — it defines bus
            time, so its own systemTimeDifference is zero
          example: false
        propagationDelay:
          type: integer
          description: "System-time delay / propagation delay (0x0928), nanoseconds"
          example: 300
        systemTimeDifference:
          type: integer
          description: >-
            Signed deviation of the local system time from the reference clock (0x092C), in
            nanoseconds. Positive = local clock ahead of the reference, negative = behind; zero on
            the reference clock. Meaningful only while exchanging in SAFE-OP/OP; converges toward
            zero as the drift-compensation loop settles
          example: 0
    AlStatusCode:
      type: object
      required: [code, name, description, terminal]
      properties:
        code:
          type: integer
          description: AL Status Code value (ETG.1000.6 §6.4.1)
          example: 20
        name:
          type: string
          description: Short human-readable name
          example: "No valid firmware"
        description:
          type: string
          description: Full description of the error condition
          example: "No valid firmware is present — the slave needs firmware flashed"
        terminal:
          type: boolean
          description: >-
            True if a slave reporting this code cannot reach the requested
            EtherCAT state by retrying. The server abandons the slave
            immediately during a state transition instead of waiting for
            timeout; the master must change something (re-init, reflash,
            power cycle) before another transition attempt can succeed.
          example: true
    EscRegister:
      type: object
      required: [address, length, name, description]
      properties:
        address:
          type: integer
          description: Register address in the ESC address space (decimal)
          example: 272
        length:
          type: integer
          description: Register width in bytes (1, 2, 4, or 8)
          example: 2
        name:
          type: string
          description: Short snake_case identifier
          example: "dl_status"
        description:
          type: string
          description: Human-readable description from the Beckhoff ESC datasheet
          example: "DL status: EEPROM load ok, link detected, communication established per port"
    FoeErrorCode:
      type: object
      required: [code, name, description]
      properties:
        code:
          type: integer
          description: 32-bit FoE error code as sent in the FoE ERROR packet (ETG.1000.6 §5.5)
          example: 32770
        name:
          type: string
          description: Short human-readable name
          example: "File not found"
        description:
          type: string
          description: Full description of the error condition
          example: "The requested file does not exist on the slave"
    SdoAbortCode:
      type: object
      required: [code, description]
      properties:
        code:
          type: integer
          description: 32-bit CoE SDO abort code (ETG.1000.6 §5.6.2.7.2, Table 41)
          example: 100794368
        description:
          type: string
          description: Human-readable meaning of the abort
          example: "The object does not exist in the object dictionary"
    MailboxErrorCode:
      type: object
      required: [code, name, description]
      properties:
        code:
          type: integer
          description: 16-bit mailbox error Detail code (ETG.1000.4, Table 30)
          example: 1
        name:
          type: string
          description: Symbolic name
          example: "MBXERR_SYNTAX"
        description:
          type: string
          description: Human-readable meaning of the error
          example: "Syntax of the 6-octet mailbox header is wrong"
    ObjectDataTypeInfo:
      type: object
      required: [code, name, bitSize]
      properties:
        code:
          type: integer
          description: ETG.1020 data type code
          example: 7
        name:
          type: string
          description: Symbolic name of the data type
          example: "UNSIGNED32"
        bitSize:
          type: integer
          description: Declared bit width of one element; 0 for variable-length types
          example: 32
    DeviceParameter:
      type: object
      required: [index, subindex, name, objectCode, dataType, dataTypeName, bitLength, access, origin, value, syncState]
      properties:
        index:
          type: integer
          description: CoE object index
          example: 24640
        subindex:
          type: integer
          description: CoE object subindex
          example: 0
        name:
          type: string
          description: Textual description from the slave's SDO Info "Get Entry Description"
          example: "Position actual value"
        objectCode:
          type: integer
          description: ETG.1000.6 §5 object code (VAR=7, ARRAY=8, RECORD=9)
          example: 7
        dataType:
          type: integer
          description: ETG.1020 data type code (e.g. 7 = UNSIGNED32)
          example: 4
        dataTypeName:
          type: string
          description: Symbolic name of the data type (resolved server-side from `dataType`)
          example: "INTEGER32"
        bitLength:
          type: integer
          description: Bit length of the entry's value
          example: 32
        access:
          type: integer
          description: ObjAccess bitfield (read/write per AL state)
          example: 7
        origin:
          type: string
          enum: [objectDictionary, sii]
          description: >-
            Where this parameter's definition came from. `objectDictionary` —
            enumerated over the CoE object dictionary (SDO-Info). `sii` — derived
            from the SII EEPROM PDO categories, for a mailbox-less slave (an
            EtherCAT coupler / simple I/O terminal) that has no CoE object
            dictionary; such a parameter has no live SDO access, so its value
            comes only from the process image.
          example: "objectDictionary"
        value:
          description: >-
            Last-known value, decoded according to `dataType`.  Initialised to
            a type-appropriate zero (0 for numbers, "" for strings, [] for raw
            bytes) before the first read.  After a successful SDO upload,
            holds the decoded value; the JSON encoding follows the variant
            alternative — number, string, or array of byte values.
          oneOf:
            - type: number
            - type: string
            - type: array
              items:
                type: integer
          example: 12345
        unit:
          type: integer
          description: >-
            ETG.1004 unit code reported by the slave for this entry.  Absent
            when the slave does not populate the Unit field of the SDO Info
            response.  The 32-bit code decomposes into prefix, base SI unit,
            and exponent per ETG.1004.
          example: 0
        defaultValue:
          description: >-
            Slave-reported default value, decoded with the same logic as
            `value`.  Absent when the slave does not report a default.
          oneOf:
            - type: number
            - type: string
            - type: array
              items:
                type: integer
        minValue:
          description: >-
            Slave-reported minimum value, decoded with the same logic as
            `value`.  Absent when the slave does not report a minimum.
          oneOf:
            - type: number
            - type: string
            - type: array
              items:
                type: integer
        maxValue:
          description: >-
            Slave-reported maximum value, decoded with the same logic as
            `value`.  Absent when the slave does not report a maximum.
          oneOf:
            - type: number
            - type: string
            - type: array
              items:
                type: integer
        syncState:
          type: string
          enum: [unknown, synced, pending]
          description: >-
            Freshness of `value` relative to the device. `synced` — matches the
            device (last successful read or write); `pending` — set locally while
            offline or after a failed write, not yet confirmed on the device;
            `unknown` — never read, `value` is the type-appropriate default.
          example: "synced"
    SlaveInformationInterface:
      type: object
      description: >
        Parsed SII (EEPROM) image of a slave — the fixed header plus the decoded
        category section.  String-index fields are 1-based references into
        `category.strings`.
      required: [info, category]
      properties:
        info:
          type: object
          description: Fixed 128-byte header (identity and mailbox configuration)
          properties:
            pdiControl: { type: integer }
            pdiConfiguration: { type: integer }
            syncImpulseLen: { type: integer }
            pdiConfiguration2: { type: integer }
            configuredStationAlias: { type: integer }
            checksum: { type: integer }
            vendorId: { type: integer, example: 8914 }
            productCode: { type: integer, example: 769 }
            revisionNumber: { type: integer }
            serialNumber: { type: integer }
            bootstrapReceiveMailboxOffset: { type: integer }
            bootstrapReceiveMailboxSize: { type: integer }
            bootstrapSendMailboxOffset: { type: integer }
            bootstrapSendMailboxSize: { type: integer }
            standardReceiveMailboxOffset: { type: integer }
            standardReceiveMailboxSize: { type: integer }
            standardSendMailboxOffset: { type: integer }
            standardSendMailboxSize: { type: integer }
            mailboxProtocol:
              type: integer
              description: "Bitfield: 0x01 AoE, 0x02 EoE, 0x04 CoE, 0x08 FoE, 0x10 SoE, 0x20 VoE"
              example: 12
            size:
              type: integer
              description: "Raw EEPROM-size word (ETG: size in KiBit − 1)"
            version: { type: integer }
        category:
          type: object
          description: Decoded SII category section
          properties:
            strings:
              type: array
              description: STRINGS table (category 10), referenced by 1-based index
              items: { type: string }
              example: ["SOMANET", "SOMANET Circulo CiA402 Drive"]
            general:
              type: object
              description: GENERAL device information (category 30)
              properties:
                groupIdx: { type: integer }
                imgIdx: { type: integer }
                orderIdx: { type: integer }
                nameIdx: { type: integer }
                coeDetails: { type: integer }
                foeDetails: { type: integer }
                eoeDetails: { type: integer }
                soeChannels: { type: integer }
                ds402Channels: { type: integer }
                sysmanClass: { type: integer }
                flags: { type: integer }
                currentOnEBus: { type: integer }
                physicalPort: { type: integer }
                physicalMemoryAddress: { type: integer }
            fmmus:
              type: array
              description: FMMU defaults (category 40), one raw 16-bit word per entry
              items: { type: integer }
            syncManagers:
              type: array
              description: Sync-Manager defaults (category 41)
              items:
                type: object
                properties:
                  physicalStartAddress: { type: integer }
                  length: { type: integer }
                  controlRegister: { type: integer }
                  statusRegister: { type: integer }
                  enableSyncManager: { type: integer }
                  syncManagerType:
                    type: integer
                    description: "1 MbxOut, 2 MbxIn, 3 Outputs, 4 Inputs"
            rxPdos:
              type: array
              description: Default RxPDOs (category 51)
              items: { $ref: "#/components/schemas/SiiPdo" }
            txPdos:
              type: array
              description: Default TxPDOs (category 50)
              items: { $ref: "#/components/schemas/SiiPdo" }
            distributedClocks:
              type: array
              description: Distributed-clock settings (category 60)
              items:
                type: object
                properties:
                  cycleTime0: { type: integer }
                  shiftTime0: { type: integer }
                  shiftTime1: { type: integer }
                  sync1CycleFactor: { type: integer }
                  assignActivate: { type: integer }
                  sync0CycleFactor: { type: integer }
                  nameIdx: { type: integer }
                  descIdx: { type: integer }
    SiiPdo:
      type: object
      description: One default PDO from the SII (RxPDO category 51 or TxPDO category 50)
      properties:
        pdoIndex: { type: integer }
        nEntry:
          type: integer
          description: Declared entry count (may exceed `entries.length` if the payload was truncated)
        syncM: { type: integer }
        synchronization: { type: integer }
        nameIdx: { type: integer }
        flags: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              entryIndex: { type: integer }
              subindex: { type: integer }
              entryNameIdx: { type: integer }
              dataType: { type: integer }
              bitLen: { type: integer }
              flags: { type: integer }
    EsiEntry:
      type: object
      description: >
        One addressable `(index, subindex)` of a device's object dictionary, assembled
        from the ESI. `defaultData`/`minData`/`maxData` are **raw little-endian bytes**
        as uppercase hexBinary, the same spelling the ESI itself uses — the first byte is
        the least significant, so `92010200` is `0x00020192`. Decode them with `dataType`;
        a byte-wise comparison of `minData` against `maxData` is wrong when `isSigned`.
      required:
        [index, subindex, objectName, entryName, displayName, objectCode, dataTypeName,
         dataType, cxxType, isSigned, bitSize, bitOffset, access, category, pdoMapping, sdoAccess,
         backup, setting, objAccess, source]
      properties:
        index: { type: integer, description: Effective CoE index, slot offset applied }
        subindex: { type: integer }
        rawIndex:
          type: integer
          description: Index as written in the source dictionary; omitted when unrelocated
        objectName:
          type: string
          description: The parent object's name — identical across all its subindices
        entryName: { type: string, description: This subindex's own name }
        displayName:
          type: string
          description: The ESI's display-name override, else `entryName`
        objectCode: { type: string, enum: [VAR, ARRAY, RECORD] }
        objectCodeValue:
          type: integer
          description: The CoE object code (ETG.1000.6 §5) — 7, 8 or 9
        numberOfEntries:
          type: integer
          description: Highest subindex; omitted for a VAR
        dataTypeName:
          type: string
          description: ESI/IEC 61131-3 type name, e.g. `UDINT`, `STRING(50)`
          example: "UDINT"
        dataType:
          type: integer
          description: ETG.1020 code, matching `DeviceParameter.dataType`; 0 if unresolved
          example: 7
        cxxType:
          type: string
          description: >
            The C++ type this entry's value maps to, resolved from `dataType` **and** `bitSize`.
            The width is not decoration: a vendor's `ARRAY [0..24] OF BYTE` resolves to the
            ETG.1020 code for BYTE, so trusting the code alone would call a 25-byte object a
            `uint8_t` and every read of it would return its first byte. Where the declared width
            contradicts the code, this is `std::vector<uint8_t>`.
          example: "int32_t"
        isSigned: { type: boolean }
        bitSize: { type: integer }
        bitOffset:
          type: integer
          description: Offset within the object's complete-access image
        defaultData: { type: string, description: Uppercase hexBinary, little-endian }
        minData: { type: string }
        maxData: { type: string }
        unit: { type: integer, description: Packed ETG.1004 notation value }
        unitSymbol: { type: string, example: "mV" }
        access:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [ro, rw, wo] }
            readRestrictions:
              type: string
              enum: [PreOP, PreOP_SafeOP, PreOP_OP, SafeOP, SafeOP_OP, OP]
            writeRestrictions:
              type: string
              enum: [PreOP, PreOP_SafeOP, PreOP_OP, SafeOP, SafeOP_OP, OP]
        category:
          type: string
          enum: [m, o, c]
          description: Mandatory, optional or conditional
        pdoMapping:
          type: string
          enum: ["", t, r, tr]
          description: Empty when not mappable; `t` TxPDO, `r` RxPDO
        safetyMapping: { type: string, enum: [si, so, sio, sp] }
        sdoAccess: { type: string, enum: [SubIndexAccess, CompleteAccess] }
        backup: { type: boolean }
        setting: { type: boolean }
        attribute: { type: integer, description: SoE IDN, when declared }
        objAccess:
          type: integer
          description: >
            ETG.1000.6 ObjAccess bitfield synthesised from the flags — bits 0-2 read in
            PreOP/SafeOP/OP, 3-5 write, 6 RxPDO-mappable, 7 TxPDO-mappable, 8 backup,
            9 setting. Matches `DeviceParameter.access`.
        description:
          type: string
          description: >
            This row's description (HTML), decoded from `properties`. On subindex 0 it is the
            object's; on a RECORD member it is that member's; an ARRAY element has none.
        options:
          type: array
          description: Enum labels, from `<EnumInfo>` and/or an `options` property
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: integer }
        properties: { $ref: "#/components/schemas/EsiProperties" }
        source:
          type: object
          description: >
            Which dictionary this entry came from. The module's *name* is not repeated here —
            resolve `moduleIdent` against the top-level `modules` list.
          required: [kind]
          properties:
            kind: { type: string, enum: [device, module] }
            moduleIdent: { type: integer }
            slot: { type: integer, description: Zero-based slot number }
            indexOffset: { type: integer, description: Slot offset applied to `rawIndex` }
    EsiProperties:
      type: array
      description: >
        Raw `<Property>` annotations as written, for whatever this row describes. This is the
        ESI's generic extension mechanism; `description` and `options` above are conveniences
        decoded from the two conventional names, so a vendor using other names still has its
        data here. **Subindex 0 carries the object's own annotation** (stored once, not repeated
        onto every subindex); other rows carry only what that entry itself declares.
      items:
        type: object
        required: [name, value]
        properties:
          name: { type: string }
          value: { type: string }
    EsiDeviceSummary:
      type: object
      required: [ordinal, type, name, groupType, objectCount, moduleIdents]
      properties:
        ordinal: { type: integer, description: Zero-based position in the file }
        type: { type: string, example: "SOMANET Node" }
        name: { type: string }
        productCode: { type: integer }
        revisionNo: { type: integer }
        profileNo: { type: integer, example: 402 }
        groupType: { type: string }
        objectCount:
          type: integer
          description: Objects in the device's own dictionary, before any module merge
        rxPdoCount: { type: integer }
        txPdoCount: { type: integer }
        moduleIdents:
          type: array
          description: Every `ModuleIdent` the device's slots reference, in slot order
          items: { type: integer }
        slots: { type: object, description: The parsed `<Slots>` block }
        entries:
          type: array
          description: This device's flat, slot-merged object dictionary
          items: { $ref: "#/components/schemas/EsiEntry" }
        warnings:
          type: array
          description: >
            Problems found while assembling *this device* — a value whose byte length disagrees
            with its declared width, an unresolvable type, a module collision. Distinct from the
            top-level `warnings`, which are about the document; a different `modules` selection
            would produce a different list here.
          items: { type: string }
    EsiParseResult:
      type: object
      description: >
        A parsed ESI. Every device carries its own assembled `entries` table.
      required: [vendor, devices, modules]
      properties:
        version: { type: string, description: The `EtherCATInfo/@Version` attribute }
        vendor:
          type: object
          required: [id, name]
          properties:
            id: { type: integer, example: 8914 }
            name: { type: string }
            url: { type: string }
        devices:
          type: array
          items: { $ref: "#/components/schemas/EsiDeviceSummary" }
        modules:
          type: array
          items:
            type: object
            required: [moduleIdent, type, name]
            properties:
              moduleIdent: { type: integer }
              type: { type: string, example: "CiA402 Dictionary" }
              name: { type: string }
              objectCount: { type: integer }
        warnings:
          type: array
          description: >
            Recoverable problems in the document itself — a skipped malformed object, an
            unparsable value. A file with warnings still parses. Per-device assembly problems
            are reported on the device instead.
          items: { type: string }
  headers:
    WireTime:
      description: >
        Server-measured duration of the on-device operation in microseconds — the control-plane
        lock acquire plus the mailbox/ESC wire transaction(s). For a single-transaction endpoint
        (one SDO/FoE/register/EEPROM access) this is essentially the pure wire round-trip; for a
        multi-transaction one (object-dictionary enumeration, bulk value read, PDO-mapping
        read/write) it is the total across all of the operation's transactions. Either way it is
        far smaller than the end-to-end HTTP round-trip a cross-origin browser client observes
        (which additionally includes TLS and transport overhead), letting the client attribute the
        device cost to the device and the remainder to the browser/transport. Present on **both**
        the success and the failure response (driver-error 500, or 409 where applicable) of every
        endpoint that performs a fieldbus operation — a failed operation still consumed device time
        (e.g. an SDO read that waits out the mailbox timeout). CORS-exposed
        (`Access-Control-Expose-Headers`) so a cross-origin client may read it.


        A few endpoints touch no device at all and report their **server-side** work on this same
        header, because the client-side split it enables is the same one: the `/api/user-cache`
        routes report the filesystem operation (path validation plus the read/write/list/remove),
        so a slow large-file transfer is visibly transport cost rather than a slow server. Read the
        figure as "time the server spent doing the work", of which a fieldbus transaction is the
        usual — but not the only — case.
      schema:
        type: integer
        minimum: 0
      example: 5000
  responses:
    DriverError:
      description: Fieldbus driver returned an error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                description: Human-readable error message from the driver
                example: "FPRD slave 1: wkc=0"
    DriverErrorTimed:
      description: >
        Fieldbus driver returned an error. Same body as `DriverError`, but carries the
        `X-Wire-Us` timing header because the failing endpoint performed (or attempted) a
        fieldbus transaction — the failure still consumed wire time.
      headers:
        X-Wire-Us:
          $ref: "#/components/headers/WireTime"
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                description: Human-readable error message from the driver
                example: "SDOread slave 1 0x2345:01 failed (no response — mailbox timeout)"
