---
- name: Restart NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: restarted

# udev applies a .link file when the device appears, which is at boot. The trigger applies it now.
- name: Apply the EtherCAT link configuration
  ansible.builtin.command: >-
    udevadm trigger --settle --subsystem-match=net --action=add
    /sys/class/net/{{ bench_host_ethercat_interface }}
  changed_when: true
