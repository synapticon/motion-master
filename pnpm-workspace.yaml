# Single pnpm workspace for all JavaScript/TypeScript in the repo. The bulk lives under web/ (the
# PWA app and the published client library); hil/api is the outlier — it stays beside its C++ HIL
# sibling (jitter_bench) but joins the workspace so it can consume the client via `workspace:*`.
packages:
  - 'web/apps/*'
  - 'web/packages/*'
  - 'hil/api'
allowBuilds:
  esbuild: true
  sharp: true
  # Its install script picks the Vue 2 or the Vue 3 build. The package ships the Vue 3 build as its
  # default, and Vue 3 is the only Vue here, so the script has nothing to do.
  vue-demi: false
