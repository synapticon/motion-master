---
# Asking dpkg beats mapping ansible_architecture ourselves: it is the same value
# apt resolves the metapackage against, on every architecture, with no table to
# keep current. check_mode:false because it is read-only and later tasks need it.
- name: Determine Debian architecture
  ansible.builtin.command: dpkg --print-architecture
  register: rt_dpkg_architecture
  changed_when: false
  check_mode: false

# Its own task, before the install. A fresh image ships with no package lists at
# all, and apt cannot resolve a metapackage it has never seen.
- name: Update the package lists
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the real-time kernel
  ansible.builtin.apt:
    name: "{{ rt_kernel_packages }}"
    state: present
  register: rt_kernel_install
  vars:
    rt_kernel_packages: >-
      {{ ['linux-image-rt-' ~ rt_dpkg_architecture.stdout]
         + (['linux-headers-rt-' ~ rt_dpkg_architecture.stdout]
            if rt_kernel_install_headers else []) }}

# The reboot itself happens once, at the end of the play (rt-target.yml), so a
# kernel install and a boot-parameter change cost one restart between them.
- name: Request a reboot when the kernel changed
  ansible.builtin.set_fact:
    rt_reboot_required: true
  when: rt_kernel_install.changed
