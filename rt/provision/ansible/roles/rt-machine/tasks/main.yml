---
- name: Install system packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    update_cache: true

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: true

- name: Allow runner user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ username }}-nopasswd
    content: "{{ username }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
