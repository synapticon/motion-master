    <meta name="theme-color" content="#004f5d" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Restore a deep link encoded by the site's 404.html. A cold-loaded route
      // (e.g. /apps/console/data/recorder) has no file on disk, so GitHub Pages' 404.html
      // redirects here as /apps/console/?/data/recorder; rewrite it back to the real path
      // before the router mounts. See web/404.html for the encoding side.
      ;(function () {
        var l = window.location
        if (l.search.charAt(1) === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
